<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTO-V Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="supabase.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0a0c15;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            background: #0f172a;
            padding: 40px;
            border-radius: 24px;
            max-width: 400px;
            width: 100%;
            border: 1px solid #1e293b;
        }
        h1 { color: #eab308; text-align: center; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #94a3b8; }
        input {
            width: 100%;
            padding: 12px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #eab308;
            border: none;
            border-radius: 40px;
            font-weight: bold;
            color: #000;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background: #facc15; }
        .message { padding: 10px; border-radius: 8px; margin-bottom: 15px; display: none; }
        .error { background: #7f1d1d; color: #fecaca; }
        .success { background: #14532d; color: #bbf7d0; }
        .signup-link { text-align: center; margin-top: 20px; color: #94a3b8; }
        .signup-link a { color: #eab308; text-decoration: none; }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🚗 AUTO-V</h1>
        <div id="message" class="message"></div>
        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="your@email.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" id="loginBtn">Login</button>
        </form>
        <div class="signup-link">
            Don't have an account? <a href="register.html">Sign up</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msg = document.getElementById('message');
            
            const { data, error } = await autoV.supabase.auth.signInWithPassword({ email, password });
            
            if (error) {
                msg.className = 'message error';
                msg.textContent = error.message;
                msg.style.display = 'block';
            } else {
                msg.className = 'message success';
                msg.textContent = 'Login successful! Redirecting...';
                msg.style.display = 'block';
                setTimeout(() => window.location.href = 'dashboard.html', 1500);
            }
        });
    </script>
</body>
</html>
