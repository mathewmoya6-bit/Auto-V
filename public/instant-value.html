<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTO-V | Instant Value Check</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23eab308' rx='20'/%3E%3Ctext x='50' y='72' font-size='60' text-anchor='middle' fill='%23000'%3E🚗%3C/text%3E%3C/svg%3E">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="supabase.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; 
            background: #0b1120; 
            color: white; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
        }
        
        .container {
            max-width: 680px;
            width: 100%;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 32px;
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        
        .back-link {
            display: inline-block;
            color: #94a3b8;
            text-decoration: none;
            margin-bottom: 20px;
            font-size: 14px;
            transition: color 0.2s;
        }
        .back-link:hover { color: #eab308; }

        h1 {
            color: #eab308;
            font-size: 28px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        
        .form-group { margin-bottom: 16px; }
        .full-width { grid-column: 1 / -1; }
        
        label {
            display: block;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        input, select {
            width: 100%;
            padding: 12px 14px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #eab308;
            box-shadow: 0 0 0 3px rgba(234, 179, 8, 0.1);
        }

        input::placeholder {
            color: #64748b;
        }

        .price-banner {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-left: 4px solid #22c55e;
            padding: 14px 20px;
            border-radius: 8px;
            margin: 20px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .price-banner span:first-child { 
            color: #94a3b8; 
            font-size: 14px;
            font-weight: 500;
        }
        .price-banner span:last-child { 
            color: #22c55e; 
            font-size: 24px; 
            font-weight: bold;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            position: relative;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #eab308, #ca8a04);
            color: black;
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(234, 179, 8, 0.3);
        }

        .btn-primary:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
            opacity: 0.7;
        }

        .btn-secondary {
            background: #475569;
            color: white;
            margin-top: 10px;
        }
        
        .btn-secondary:hover { background: #5a6a7a; }

        .status-box {
            padding: 15px 20px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
            font-size: 14px;
            align-items: center;
            gap: 10px;
        }
        .status-success {
            background: #14532d;
            color: #bbf7d0;
            border-left: 4px solid #22c55e;
        }
        .status-error {
            background: #7f1d1d;
            color: #fecaca;
            border-left: 4px solid #ef4444;
        }
        .status-info {
            background: #1e3a5f;
            color: #b3d9ff;
            border-left: 4px solid #3b82f6;
        }
        
        .result-box {
            background: #1e293b;
            padding: 24px;
            border-radius: 12px;
            margin-top: 20px;
            display: none;
            animation: slideUp 0.4s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .result-value {
            font-size: 40px;
            color: #22c55e;
            font-weight: bold;
            text-align: center;
            padding: 12px 0;
        }
        .result-detail {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #2d3a4e;
            font-size: 14px;
        }
        .result-detail:last-child { border-bottom: none; }
        .result-detail span:first-child { color: #94a3b8; }
        .result-detail span:last-child { color: #eab308; font-weight: 500; }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #1e293b;
            border-top-color: #eab308;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .hidden { display: none !important; }

        .badge {
            background: #1e293b;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: #94a3b8;
        }

        @media (max-width: 640px) {
            .container { padding: 20px; }
            .form-grid { grid-template-columns: 1fr; }
            .result-value { font-size: 30px; }
            h1 { font-size: 22px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
        
        <h1>💡 Instant Value Check</h1>
        <p class="subtitle">AI-powered market estimate for Cars, Bikes, and Tricycles in Kenya</p>

        <form id="instantForm" novalidate>
            <div class="form-grid">
                <!-- Vehicle Type -->
                <div class="form-group full-width">
                    <label>Vehicle Type *</label>
                    <select id="vehicleType" required>
                        <option value="Car">🚗 Car</option>
                        <option value="Bike">🏍️ Motorcycle</option>
                        <option value="Tricycle">🛺 Tricycle</option>
                    </select>
                </div>

                <!-- Make -->
                <div class="form-group">
                    <label>Make *</label>
                    <select id="make" required>
                        <optgroup label="Cars">
                            <option value="Toyota">Toyota</option>
                            <option value="Nissan">Nissan</option>
                            <option value="BMW">BMW</option>
                            <option value="Mercedes">Mercedes</option>
                            <option value="Honda">Honda</option>
                            <option value="Mazda">Mazda</option>
                            <option value="Volkswagen">Volkswagen</option>
                            <option value="Mitsubishi">Mitsubishi</option>
                            <option value="Subaru">Subaru</option>
                            <option value="Ford">Ford</option>
                            <option value="Chevrolet">Chevrolet</option>
                            <option value="Jeep">Jeep</option>
                            <option value="Land Rover">Land Rover</option>
                            <option value="Hyundai">Hyundai</option>
                            <option value="Kia">Kia</option>
                            <option value="Peugeot">Peugeot</option>
                            <option value="Suzuki Car">Suzuki</option>
                            <option value="Isuzu">Isuzu</option>
                            <option value="Daihatsu">Daihatsu</option>
                        </optgroup>
                        <optgroup label="Bikes">
                            <option value="Honda Bike">Honda</option>
                            <option value="Yamaha">Yamaha</option>
                            <option value="Suzuki Bike">Suzuki</option>
                            <option value="Kawasaki">Kawasaki</option>
                            <option value="TVS">TVS</option>
                            <option value="Bajaj">Bajaj</option>
                            <option value="Hero">Hero</option>
                            <option value="Royal Enfield">Royal Enfield</option>
                            <option value="KTM">KTM</option>
                            <option value="Aprilia">Aprilia</option>
                            <option value="BMW Motorrad">BMW Motorrad</option>
                            <option value="Ducati">Ducati</option>
                            <option value="Triumph">Triumph</option>
                            <option value="Harley Davidson">Harley Davidson</option>
                            <option value="MV Agusta">MV Agusta</option>
                        </optgroup>
                        <optgroup label="Tricycles">
                            <option value="Piaggio">Piaggio</option>
                            <option value="TVS Tricycle">TVS</option>
                            <option value="Bajaj Tricycle">Bajaj</option>
                        </optgroup>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <!-- Model -->
                <div class="form-group">
                    <label>Model *</label>
                    <select id="model" required>
                        <option value="">-- Select Model --</option>
                    </select>
                </div>

                <!-- Year -->
                <div class="form-group">
                    <label>Year of Manufacture *</label>
                    <input type="number" id="year" placeholder="e.g., 2020" min="1990" max="2026" required>
                </div>

                <!-- Engine Capacity -->
                <div class="form-group">
                    <label>Engine Capacity (cc) *</label>
                    <select id="engineCapacity" required>
                        <option value="">-- Select Engine --</option>
                    </select>
                </div>

                <!-- Fuel Type -->
                <div class="form-group">
                    <label>Fuel Type *</label>
                    <select id="fuelType" required>
                        <option value="Petrol">Petrol</option>
                        <option value="Diesel">Diesel</option>
                        <option value="Hybrid">Hybrid</option>
                        <option value="Electric">Electric</option>
                    </select>
                </div>

                <!-- Transmission -->
                <div class="form-group">
                    <label>Transmission *</label>
                    <select id="transmission" required>
                        <option value="Automatic">Automatic</option>
                        <option value="Manual">Manual</option>
                        <option value="CVT">CVT</option>
                    </select>
                </div>

                <!-- Body Type -->
                <div class="form-group full-width">
                    <label>Body Type *</label>
                    <select id="bodyType" required>
                        <option value="">-- Select Body Type --</option>
                    </select>
                </div>

                <!-- Body Color -->
                <div class="form-group">
                    <label>Body Color</label>
                    <select id="bodyColor">
                        <option value="White">White</option>
                        <option value="Silver">Silver</option>
                        <option value="Grey">Grey</option>
                        <option value="Black">Black</option>
                        <option value="Red">Red</option>
                        <option value="Blue">Blue</option>
                        <option value="Green">Green</option>
                        <option value="Yellow">Yellow</option>
                        <option value="Orange">Orange</option>
                        <option value="Maroon">Maroon</option>
                        <option value="Brown">Brown</option>
                        <option value="Gold">Gold</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <!-- Mileage -->
                <div class="form-group">
                    <label>Odometer (km) *</label>
                    <input type="number" id="mileage" placeholder="e.g., 50000" required>
                </div>

                <!-- Previous Owners -->
                <div class="form-group full-width">
                    <label>Number of Previous Owners *</label>
                    <select id="previousOwners" required>
                        <option value="0">0 (Brand New)</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5+</option>
                    </select>
                </div>

                <!-- Usage Type -->
                <div class="form-group full-width">
                    <label>Usage Type *</label>
                    <select id="usageType" required>
                        <option value="Personal">Personal</option>
                        <option value="Commercial">Commercial</option>
                    </select>
                </div>

                <!-- Condition -->
                <div class="form-group full-width">
                    <label>Overall Condition *</label>
                    <select id="condition" required>
                        <option value="Excellent">🌟 Excellent</option>
                        <option value="Good" selected>👍 Good</option>
                        <option value="Fair">👌 Fair</option>
                        <option value="Poor">⚠️ Poor</option>
                    </select>
                </div>

                <!-- Accident History -->
                <div class="form-group full-width">
                    <label>Accident History *</label>
                    <select id="accidentHistory" required>
                        <option value="None">✅ None</option>
                        <option value="Minor">🟡 Minor (Scratches/Dents)</option>
                        <option value="Major">🔴 Major (Structural Damage)</option>
                        <option value="WriteOff">💀 Insurance Write-Off</option>
                    </select>
                </div>

                <!-- Location -->
                <div class="form-group full-width">
                    <label>County / Location *</label>
                    <select id="location" required>
                        <option value="Nairobi">Nairobi</option>
                        <option value="Mombasa">Mombasa</option>
                        <option value="Kisumu">Kisumu</option>
                        <option value="Nakuru">Nakuru</option>
                        <option value="Eldoret">Eldoret</option>
                        <option value="Thika">Thika</option>
                        <option value="Malindi">Malindi</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>

            <!-- Service Fee -->
            <div class="price-banner" id="priceBanner">
                <span>Service Fee</span>
                <span id="serviceFeeDisplay">Loading...</span>
            </div>

            <!-- M-Pesa Phone -->
            <div class="form-group">
                <label>M-Pesa Phone Number *</label>
                <input type="tel" id="mpesaPhone" placeholder="0712345678" required>
                <small style="color: #64748b; font-size: 12px; display: block; margin-top: 4px;">
                    Enter the M-Pesa number you'll pay from
                </small>
            </div>

            <button type="submit" class="btn btn-primary" id="submitBtn">
                💳 Get Instant Value
            </button>
        </form>

        <div id="statusBox" class="status-box"></div>

        <div id="resultBox" class="result-box">
            <h3 style="color: #eab308; margin-bottom: 15px; font-size: 18px;">✅ AI Valuation Result</h3>
            <div class="result-value" id="resultMarketValue">KES 0</div>
            
            <div style="margin-top: 20px;">
                <div class="result-detail">
                    <span>Vehicle</span>
                    <span id="resultVehicle">-</span>
                </div>
                <div class="result-detail">
                    <span>Year</span>
                    <span id="resultYear">-</span>
                </div>
                <div class="result-detail">
                    <span>Engine</span>
                    <span id="resultEngine">-</span>
                </div>
                <div class="result-detail">
                    <span>Color</span>
                    <span id="resultColor">-</span>
                </div>
                <div class="result-detail">
                    <span>Location</span>
                    <span id="resultLocation">-</span>
                </div>
                <div class="result-detail">
                    <span>Confidence Score</span>
                    <span id="resultConfidence" style="color: #22c55e;">-</span>
                </div>
                <div class="result-detail">
                    <span>Valuation Date</span>
                    <span id="resultDate">-</span>
                </div>
                <div class="result-detail">
                    <span>Certificate</span>
                    <span id="resultCert" style="color: #22c55e; font-weight: 600;">-</span>
                </div>
            </div>

            <button class="btn btn-secondary" onclick="window.location.href='dashboard.html'">
                ← Back to Dashboard
            </button>
        </div>
    </div>

            'KTM': ['Duke', 'RC', 'Adventure', 'KTM 390', 'KTM 250', 'KTM 125', 'KTM 690', 'SX-F', 'XC', 'EXC', 'Freeride', 'SMR', 'SM', 'Duke 200', 'RC 200'],
            
            'Aprilia': ['RS', 'Tuono', 'RSV4', 'SX', 'RX', 'SR', 'Atlantic', 'Scarabeo', 'Shiver', 'Mana', 'Caponord', 'Dorsoduro', 'RXV', 'SXV', 'Pegaso'],

            'Ducati': ['Panigale', 'Monster', 'Multistrada', 'Supersport', 'Diavel', 'Streetfighter', 'Scrambler', 'Hypermotard', 'X Diavel', 'Superleggera', 'Desmosedici', 'SportClassic', '999', '749', '848'],
            
            'Triumph': ['Bonneville', 'Thruxton', 'Rocket 3', 'Tiger', 'Trident', 'Speed Triple', 'Street Triple', 'Scrambler', 'Speedmaster', 'Thunderbird', 'Troph', 'Daytona', 'Sprint', 'T100', 'T120'],
            
            'Harley Davidson': ['Sportster', 'Softail', 'Touring', 'Street', 'V-Rod', 'Pan America', 'LiveWire', 'Dyna', 'Fat Boy', 'Heritage', 'Road King', 'Street Glide', 'Ultra Glide', 'Iron 883', 'Forty-Eight'],
            
            'MV Agusta': ['F4', 'Brutale', 'Dragster', 'Superveloce', 'Turismo Veloce', 'Rivale', 'Stradale', 'Oro', 'F3', 'F4 RC'],

            // ==================== TRICYCLES ====================
            'Piaggio': ['Ape', 'Auto', 'City', 'Ape City', 'Ape Classic', 'Ape Calessino', 'Mp3', 'Beverly', 'Liberty', 'Vespa', 'Ape 50', 'Ape TM', 'Ape Cross', 'Ape Ranger', 'Porter'],
            
            'TVS Tricycle': ['King', 'TVS Auto', 'TVS Ape', 'TVS XL', 'NTV', 'TVS Auto 4-Stroke', 'TVS Auto Diesel', 'TVS Auto CNG'],
            
            'Bajaj Tricycle': ['RE', 'Bajaj Auto', 'Bajaj RE', 'Bajaj Maxima', 'Compact', 'Qute', 'Tuk Tuk', 'RE 4S', 'RE Diesel', 'RE CNG'],
            
            'Other': ['Other']
        };

        // ─── ENGINE CAPACITIES BY VEHICLE TYPE ──────────────────────
        const ENGINE_CAPACITIES = {
            'Car': ['800', '1000', '1200', '1500', '1800', '2000', '2500', '3000', '3500', '4000', '5000', '6000'],
            'Bike': ['50', '100', '125', '150', '200', '250', '300', '400', '500', '600', '800', '1000', '1200', '1500', '1800'],
            'Tricycle': ['50', '100', '125', '150', '200', '250', '300', '400', '500', '600', '800']
        };

        // ─── BODY TYPES BY VEHICLE TYPE ──────────────────────────────
        const BODY_TYPES = {
            'Car': ['Sedan', 'SUV', 'Hatchback', 'Pickup', 'Van', 'Coupe', 'Convertible', 'Wagon', 'Other'],
            'Bike': ['Standard', 'Sport', 'Cruiser', 'Touring', 'Adventure', 'Scooter', 'Off-Road', 'Other'],
            'Tricycle': ['Passenger', 'Cargo', 'Auto', 'Other']
        };

        // ─── CONFIGURATION ──────────────────────────────────────────────
        const API_BASE = 'https://auto-v.onrender.com'; // Backend API URL
        
        // ─── INITIALIZE SUPABASE ──────────────────────────────────────
        if (!window.autoV || !window.autoV.supabase) {
            document.getElementById('statusBox').textContent = '❌ Error: Supabase not loaded. Please refresh.';
            document.getElementById('statusBox').className = 'status-box status-error';
            document.getElementById('statusBox').style.display = 'block';
            throw new Error('Supabase client not found.');
        }

        const client = window.autoV.supabase;

        // ─── DOM ELEMENTS ─────────────────────────────────────────────
        const vehicleTypeSelect = document.getElementById('vehicleType');
        const makeSelect = document.getElementById('make');
        const modelSelect = document.getElementById('model');
        const engineCapacitySelect = document.getElementById('engineCapacity');
        const bodyTypeSelect = document.getElementById('bodyType');
        const serviceFeeDisplay = document.getElementById('serviceFeeDisplay');
        const form = document.getElementById('instantForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusBox = document.getElementById('statusBox');
        const resultBox = document.getElementById('resultBox');

        // ─── FETCH SERVICE FEE FROM BACKEND ──────────────────────────
        async function fetchServiceFee() {
            try {
                const response = await fetch(`${API_BASE}/instant-check/service-fee`);
                if (!response.ok) throw new Error('Failed to fetch service fee');
                const data = await response.json();
                serviceFeeDisplay.textContent = `KES ${data.fee.toLocaleString()}`;
                return data.fee;
            } catch (error) {
                console.error('Error fetching service fee:', error);
                serviceFeeDisplay.textContent = 'KES 500'; // Fallback
                return 500;
            }
        }

        // ─── UPDATE MODEL DROPDOWN ──────────────────────────────────
        function updateModelDropdown() {
            const selectedMake = makeSelect.value;
            const models = MODEL_MAP[selectedMake] || ['Other'];
            
            modelSelect.innerHTML = '';
            
            const placeholder = document.createElement('option');
            placeholder.value = '';
            placeholder.textContent = '-- Select Model --';
            modelSelect.appendChild(placeholder);

            models.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m;
                opt.textContent = m;
                modelSelect.appendChild(opt);
            });
        }

        // ─── UPDATE ENGINE CAPACITY DROPDOWN ──────────────────────
        function updateEngineDropdown() {
            const type = vehicleTypeSelect.value;
            const capacities = ENGINE_CAPACITIES[type] || ['Other'];
            
            engineCapacitySelect.innerHTML = '';
            
            const placeholder = document.createElement('option');
            placeholder.value = '';
            placeholder.textContent = '-- Select Engine Capacity --';
            engineCapacitySelect.appendChild(placeholder);

            capacities.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = `${c}cc`;
                engineCapacitySelect.appendChild(opt);
            });
        }

        // ─── UPDATE BODY TYPE DROPDOWN ──────────────────────────────
        function updateBodyTypeDropdown() {
            const type = vehicleTypeSelect.value;
            const types = BODY_TYPES[type] || ['Other'];
            
            bodyTypeSelect.innerHTML = '';
            
            const placeholder = document.createElement('option');
            placeholder.value = '';
            placeholder.textContent = '-- Select Body Type --';
            bodyTypeSelect.appendChild(placeholder);

            types.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t;
                opt.textContent = t;
                bodyTypeSelect.appendChild(opt);
            });
        }

        // ─── HANDLE "OTHER" MAKE ──────────────────────────────────────
        function handleOtherMake() {
            if (makeSelect.value === 'Other') {
                const customMake = prompt('Please enter the vehicle make:');
                if (customMake && customMake.trim()) {
                    const opt = document.createElement('option');
                    opt.value = customMake.trim();
                    opt.textContent = customMake.trim();
                    makeSelect.appendChild(opt);
                    makeSelect.value = customMake.trim();
                    updateModelDropdown();
                } else {
                    // Reset to first option
                    makeSelect.selectedIndex = 0;
                    updateModelDropdown();
                }
            }
        }

        // ─── HANDLE "OTHER" MODEL ──────────────────────────────────────
        function handleOtherModel() {
            if (modelSelect.value === 'Other') {
                const customModel = prompt('Please enter the vehicle model:');
                if (customModel && customModel.trim()) {
                    const opt = document.createElement('option');
                    opt.value = customModel.trim();
                    opt.textContent = customModel.trim();
                    modelSelect.appendChild(opt);
                    modelSelect.value = customModel.trim();
                } else {
                    modelSelect.selectedIndex = 0;
                }
            }
        }

        // ─── EVENT LISTENERS ──────────────────────────────────────────
        vehicleTypeSelect.addEventListener('change', function() {
            // Auto-select first make in the corresponding category
            const type = this.value;
            let categoryLabel = 'Cars';
            if (type === 'Bike') categoryLabel = 'Bikes';
            else if (type === 'Tricycle') categoryLabel = 'Tricycles';
            
            const firstMake = makeSelect.querySelector(`optgroup[label="${categoryLabel}"] option`);
            if (firstMake) {
                makeSelect.value = firstMake.value;
                updateModelDropdown();
            }
            
            updateEngineDropdown();
            updateBodyTypeDropdown();
        });

        makeSelect.addEventListener('change', function() {
            if (this.value === 'Other') {
                handleOtherMake();
            } else {
                updateModelDropdown();
            }
        });

        modelSelect.addEventListener('change', function() {
            if (this.value === 'Other') {
                handleOtherModel();
            }
        });

        // ─── FORM SUBMISSION ──────────────────────────────────────────
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            // Collect all form data
            const formData = {
                vehicleType: vehicleTypeSelect.value,
                make: makeSelect.value,
                model: modelSelect.value,
                year: parseInt(document.getElementById('year').value),
                engineCapacity: parseInt(document.getElementById('engineCapacity').value),
                fuelType: document.getElementById('fuelType').value,
                transmission: document.getElementById('transmission').value,
                bodyType: document.getElementById('bodyType').value,
                bodyColor: document.getElementById('bodyColor').value,
                mileage: parseInt(document.getElementById('mileage').value),
                condition: document.getElementById('condition').value,
                accidentHistory: document.getElementById('accidentHistory').value,
                location: document.getElementById('location').value,
                previousOwners: parseInt(document.getElementById('previousOwners').value),
                usageType: document.getElementById('usageType').value,
                phone: document.getElementById('mpesaPhone').value.trim()
            };

            // Validate required fields
            const validations = [
                { field: formData.make, name: 'Make' },
                { field: formData.model, name: 'Model' },
                { field: formData.bodyType, name: 'Body Type' },
                { field: formData.engineCapacity, name: 'Engine Capacity' },
                { field: formData.year, name: 'Year' },
                { field: formData.mileage, name: 'Odometer' },
                { field: formData.phone, name: 'Phone Number' }
            ];

            for (const v of validations) {
                if (!v.field || v.field === '') {
                    alert(`Please select/enter a valid ${v.name}.`);
                    return;
                }
            }

            if (formData.phone.length < 10) {
                alert('Please enter a valid M-Pesa phone number (e.g., 0712345678).');
                return;
            }

            // Reset UI
            statusBox.style.display = 'none';
            resultBox.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span> Processing Valuation...';

            try {
                // 1. Check authentication
                const { data: { user } } = await client.auth.getUser();
                if (!user) {
                    statusBox.className = 'status-box status-error';
                    statusBox.textContent = '❌ Please login again.';
                    statusBox.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.textContent = '💳 Get Instant Value';
                    return;
                }

                // 2. Get session token
                const session = client.auth.session();
                const token = session?.access_token || '';

                // 3. Submit to backend
                const response = await fetch(`${API_BASE}/instant-check/valuate`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        user_id: user.id,
                        vehicle: {
                            type: formData.vehicleType,
                            make: formData.make,
                            model: formData.model,
                            year: formData.year,
                            engine_capacity: formData.engineCapacity,
                            fuel_type: formData.fuelType,
                            transmission: formData.transmission,
                            body_type: formData.bodyType,
                            body_color: formData.bodyColor,
                            mileage: formData.mileage,
                            condition: formData.condition,
                            accident_history: formData.accidentHistory,
                            location: formData.location,
                            previous_owners: formData.previousOwners,
                            usage_type: formData.usageType
                        },
                        phone: formData.phone
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || 'Valuation failed');
                }

                const result = await response.json();
                
                // 4. Display Result
                const certNumber = `AUTO-VAL-${Date.now().toString(36).toUpperCase()}-${Math.random().toString(36).substring(2, 6).toUpperCase()}`;

                statusBox.className = 'status-box status-success';
                statusBox.textContent = '✅ Valuation complete! Your result is ready below.';
                statusBox.style.display = 'block';

                // Populate results
                document.getElementById('resultMarketValue').textContent = `KES ${result.market_value.toLocaleString()}`;
                document.getElementById('resultVehicle').textContent = `${formData.make} ${formData.model}`;
                document.getElementById('resultYear').textContent = formData.year;
                document.getElementById('resultEngine').textContent = `${formData.engineCapacity}cc`;
                document.getElementById('resultColor').textContent = formData.bodyColor;
                document.getElementById('resultLocation').textContent = formData.location;
                document.getElementById('resultConfidence').textContent = `${result.confidence_score || 87}%`;
                document.getElementById('resultDate').textContent = new Date().toLocaleDateString('en-KE', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
                document.getElementById('resultCert').textContent = certNumber;

                resultBox.style.display = 'block';
                submitBtn.textContent = '✅ Valuation Complete';
                submitBtn.disabled = true;

                // Scroll to result
                resultBox.scrollIntoView({ behavior: 'smooth', block: 'center' });

            } catch (err) {
                console.error('Error:', err);
                statusBox.className = 'status-box status-error';
                statusBox.textContent = `❌ ${err.message || 'An error occurred. Please try again.'}`;
                statusBox.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = '💳 Get Instant Value';
            }
        });

        // ─── INITIALIZE ──────────────────────────────────────────────
        // Set default vehicle type
        vehicleTypeSelect.value = 'Car';
        
        // Populate dropdowns
        updateModelDropdown();
        updateEngineDropdown();
        updateBodyTypeDropdown();
        
        // Fetch service fee
        fetchServiceFee();

        console.log('🚗 AUTO-V Instant Value Check loaded successfully!');
    </script>
