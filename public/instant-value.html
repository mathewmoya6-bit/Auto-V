<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTO-V | Instant Value Check</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23eab308' rx='20'/%3E%3Ctext x='50' y='72' font-size='60' text-anchor='middle' fill='%23000'%3E🚗%3C/text%3E%3C/svg%3E">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="supabase.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: #0b1120; 
            color: white; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
        }
        
        .container {
            max-width: 600px;
            width: 100%;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 32px;
            position: relative;
        }
        
        .back-link {
            display: inline-block;
            color: #94a3b8;
            text-decoration: none;
            margin-bottom: 20px;
            font-size: 14px;
            transition: color 0.2s;
        }
        .back-link:hover { color: #eab308; }

        h1 {
            color: #eab308;
            font-size: 24px;
            margin-bottom: 6px;
        }
        
        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        
        .form-group { margin-bottom: 16px; }
        .full-width { grid-column: 1 / -1; }
        
        label {
            display: block;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        input, select {
            width: 100%;
            padding: 12px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            box-sizing: border-box;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #eab308;
        }

        .price-banner {
            background: #1e293b;
            border-left: 4px solid #22c55e;
            padding: 12px 16px;
            border-radius: 8px;
            margin: 20px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .price-banner span:first-child { color: #94a3b8; font-size: 14px; }
        .price-banner span:last-child { color: #22c55e; font-size: 22px; font-weight: bold; }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        
        .btn-primary {
            background: #eab308;
            color: black;
        }
        
        .btn-primary:hover {
            background: #facc15;
            transform: translateY(-2px);
        }

        .btn-primary:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #475569;
            color: white;
            margin-top: 10px;
        }
        
        .btn-secondary:hover { background: #5a6a7a; }

        .status-box {
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }
        .status-success {
            background: #14532d;
            color: #bbf7d0;
            border-left: 4px solid #22c55e;
        }
        .status-error {
            background: #7f1d1d;
            color: #fecaca;
            border-left: 4px solid #ef4444;
        }
        
        .result-box {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            display: none;
        }
        .result-value {
            font-size: 36px;
            color: #22c55e;
            font-weight: bold;
            text-align: center;
        }
        .result-detail {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #2d3a4e;
            font-size: 14px;
        }
        .result-detail:last-child { border-bottom: none; }
        .result-detail span:first-child { color: #94a3b8; }
        .result-detail span:last-child { color: #eab308; }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid #1e293b;
            border-top-color: #eab308;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 480px) {
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
        
        <h1>💡 Instant Value Check</h1>
        <p class="subtitle">AI-powered market estimate for Cars, Bikes, and Tricycles.</p>

        <form id="instantForm">
            <div class="form-grid">
                <!-- 1. Vehicle Identification -->
                <div class="form-group full-width">
                    <label>Vehicle Type</label>
                    <select id="vehicleType">
                        <option value="Car">🚗 Car</option>
                        <option value="Bike">🏍️ Motorcycle</option>
                        <option value="Tricycle">🛺 Tricycle</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Make</label>
                    <select id="make">
                        <optgroup label="Cars">
                            <option value="Toyota">Toyota</option>
                            <option value="Nissan">Nissan</option>
                            <option value="BMW">BMW</option>
                            <option value="Mercedes">Mercedes</option>
                            <option value="Honda">Honda</option>
                            <option value="Mazda">Mazda</option>
                            <option value="Volkswagen">Volkswagen</option>
                            <option value="Mitsubishi">Mitsubishi</option>
                            <option value="Subaru">Subaru</option>
                            <option value="Ford">Ford</option>
                            <option value="Chevrolet">Chevrolet</option>
                            <option value="Jeep">Jeep</option>
                            <option value="Land Rover">Land Rover</option>
                            <option value="Hyundai">Hyundai</option>
                            <option value="Kia">Kia</option>
                            <option value="Peugeot">Peugeot</option>
                            <option value="Suzuki Car">Suzuki</option>
                            <option value="Isuzu">Isuzu</option>
                            <option value="Daihatsu">Daihatsu</option>
                        </optgroup>
                        <optgroup label="Bikes">
                            <option value="Honda Bike">Honda</option>
                            <option value="Yamaha">Yamaha</option>
                            <option value="Suzuki Bike">Suzuki</option>
                            <option value="Kawasaki">Kawasaki</option>
                            <option value="TVS">TVS</option>
                            <option value="Bajaj">Bajaj</option>
                            <option value="Hero">Hero</option>
                            <option value="Royal Enfield">Royal Enfield</option>
                            <option value="KTM">KTM</option>
                            <option value="Aprilia">Aprilia</option>
                            <option value="BMW Motorrad">BMW Motorrad</option>
                            <option value="Ducati">Ducati</option>
                            <option value="Triumph">Triumph</option>
                            <option value="Harley Davidson">Harley Davidson</option>
                            <option value="MV Agusta">MV Agusta</option>
                        </optgroup>
                        <optgroup label="Tricycles">
                            <option value="Piaggio">Piaggio</option>
                            <option value="TVS Tricycle">TVS</option>
                            <option value="Bajaj Tricycle">Bajaj</option>
                        </optgroup>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Model</label>
                    <select id="model">
                        <option value="">-- Select Model --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Year of Manufacture</label>
                    <input type="number" id="year" placeholder="2020" min="1990" max="2026" required>
                </div>

                <div class="form-group">
                    <label>Fuel Type</label>
                    <select id="fuelType">
                        <option value="Petrol">Petrol</option>
                        <option value="Diesel">Diesel</option>
                        <option value="Hybrid">Hybrid</option>
                        <option value="Electric">Electric</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Transmission</label>
                    <select id="transmission">
                        <option value="Automatic">Automatic</option>
                        <option value="Manual">Manual</option>
                        <option value="CVT">CVT</option>
                    </select>
                </div>

                <!-- 2. Vehicle Usage -->
                <div class="form-group">
                    <label>Odometer (km)</label>
                    <input type="number" id="mileage" placeholder="50000" required>
                </div>

                <div class="form-group full-width">
                    <label>Number of Previous Owners</label>
                    <select id="previousOwners">
                        <option value="0">0 (Brand New)</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5+</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label>Usage Type</label>
                    <select id="usageType">
                        <option value="Personal">Personal</option>
                        <option value="Commercial">Commercial</option>
                    </select>
                </div>

                <!-- 3. Condition Assessment -->
                <div class="form-group full-width">
                    <label>Overall Condition</label>
                    <select id="condition">
                        <option value="Excellent">Excellent</option>
                        <option value="Good" selected>Good</option>
                        <option value="Fair">Fair</option>
                        <option value="Poor">Poor</option>
                    </select>
                </div>

                <!-- 4. Accident History -->
                <div class="form-group full-width">
                    <label>Accident History</label>
                    <select id="accidentHistory">
                        <option value="None">None</option>
                        <option value="Minor">Minor (Scratches/Small Dents)</option>
                        <option value="Major">Major (Structural Damage)</option>
                        <option value="WriteOff">Insurance Write-Off</option>
                    </select>
                </div>

                <!-- 6. Location -->
                <div class="form-group full-width">
                    <label>County / Location</label>
                    <select id="location">
                        <option value="Nairobi">Nairobi</option>
                        <option value="Mombasa">Mombasa</option>
                        <option value="Kisumu">Kisumu</option>
                        <option value="Nakuru">Nakuru</option>
                        <option value="Eldoret">Eldoret</option>
                        <option value="Thika">Thika</option>
                        <option value="Malindi">Malindi</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>

            <div class="price-banner">
                <span>Service Fee</span>
                <span>KES 500</span>
            </div>

            <div class="form-group">
                <label>M-Pesa Phone Number</label>
                <input type="tel" id="mpesaPhone" placeholder="0712345678" required>
            </div>

            <button type="submit" class="btn btn-primary" id="submitBtn">
                💳 Get Instant Value
            </button>
        </form>

        <div id="statusBox" class="status-box"></div>

        <div id="resultBox" class="result-box">
            <h3 style="color: #eab308; margin-bottom: 15px;">✅ AI Valuation Result</h3>
            <div class="result-value" id="resultMarketValue">KES 0</div>
            
            <div style="margin-top: 20px;">
                <div class="result-detail"><span>Vehicle</span><span id="resultVehicle">-</span></div>
                <div class="result-detail"><span>Year</span><span id="resultYear">-</span></div>
                <div class="result-detail"><span>Location</span><span id="resultLocation">-</span></div>
                <div class="result-detail"><span>Valuation Date</span><span id="resultDate">-</span></div>
                <div class="result-detail"><span>Certificate</span><span id="resultCert" style="color:#22c55e;">-</span></div>
            </div>

            <button class="btn btn-secondary" onclick="window.location.href='dashboard.html'">← Back to Dashboard</button>
        </div>
    </div>

    <script>
        // ─── Source of Truth ──────────────────────────────────────────
        if (!window.autoV || !window.autoV.supabase) {
            document.getElementById('statusBox').textContent = '❌ Error: Supabase not loaded. Please refresh.';
            document.getElementById('statusBox').className = 'status-box status-error';
            document.getElementById('statusBox').style.display = 'block';
            throw new Error('Supabase client not found.');
        }

        const client = window.autoV.supabase;
        const SERVICE_FEE = 500;
        const API_BASE = 'https://auto-v.onrender.com'; // Change to your Flask server URL

        // ─── ✅ FULL MAKE TO MODEL DATABASE ──────────────────────────
        const MODEL_MAP = {

            // CARS

            ],
            'Nissan': [
                'X-Trail', 'Patrol', 'Navara', 'Note', 'Juke', 'Qashqai', 
                'Pathfinder', 'Armada', 'Murano', '370Z', 'GTR', 'Skyline',

            ],

                'X5', 'X3', 'X1', 'X7', '3 Series', '5 Series', '7 Series',

            ],
            'Mercedes': [

                'A-Class', 'B-Class', 'CLA', 'GLA', 'GLB', 'V-Class', 'Sprinter'
            ],
            'Honda': [
                'CR-V', 'Accord', 'Fit', 'Civic', 'HR-V', 'City',

            ],
            'Mazda': [
                'CX-5', 'Demio', 'Atenza', 'CX-3', 'CX-9', 'BT-50', 
                'Mazda 3', 'Mazda 6', 'RX-8'
            ],
            'Volkswagen': [
                'Golf', 'Polo', 'Tiguan', 'Passat', 'Jetta', 'Touareg', 
                'Amarok', 'Beetle', 'CC', 'Eos'
            ],
            'Mitsubishi': [
                'Pajero', 'Lancer', 'ASX', 'Outlander', 'Eclipse Cross', 
                'Triton', 'Galant', 'L200', 'Montero'
            ],
            'Subaru': [
                'Forester', 'Outback', 'Legacy', 'Impreza', 'WRX', 
                'XV', 'Tribeca', 'Levorg'
            ],
            'Ford': [
                'Ranger', 'Mustang', 'Everest', 'Focus', 'Fiesta', 
                'Fusion', 'Edge', 'Explorer', 'Transit', 'Kuga', 'Raptor'
            ],
            'Chevrolet': [
                'Silverado', 'Tahoe', 'Suburban', 'Traverse', 'Equinox',

            ],
            'Jeep': [

            ],
            'Land Rover': [

            ],
            'Hyundai': [

            ],

            // ==========================
            // BIKES / MOTORCYCLES
            // ==========================
            'Honda Bike': [
                'CBR', 'CB500', 'Africa Twin', 'CBX', 'CRF', 'XR', 
                'Shadow', 'Rebel', 'NC750', 'Gold Wing'
            ],
            'Yamaha': [
                'R1', 'R6', 'MT-07', 'Tenere', 'YZF', 'FZ', 'Tracer', 
                'XSR', 'V-Max', 'Bolt', 'NMAX', 'TMAX'
            ],
            'Suzuki Bike': [
                'GSX-R', 'V-Strom', 'Hayabusa', 'GSX', 'DL', 
                'Burgman', 'Intruder', 'Svartpilen'
            ],
            'Kawasaki': [

                'Concours', 'KX'
            ],
            'TVS': [

            'Bajaj': [

            'Hero': [

                'Xtreme', 'Karizma', 'Hunk', 'Glamour', 'Xpulse'

            'Royal Enfield': [

                'Meteor 350', 'Bullet', 'Scram 411', 'Shotgun'

            'KTM': [

                'KTM 125', 'KTM 690', 'SX-F', 'XC'

            'Aprilia': [
                'RS', 'Tuono', 'RSV4', 'SX', 'RX', 'SR', 'Atlantic'
            ],
            'BMW Motorrad': [
                'G 310', 'F 750', 'R 1250', 'S 1000', 'K 1600', 
                'R nineT', 'C 600', 'CE 04'
            ],
            'Ducati': [
                'Panigale', 'Monster', 'Multistrada', 'Supersport', 
                'Diavel', 'Streetfighter', 'Scrambler'
            ],
            'Triumph': [
                'Bonneville', 'Thruxton', 'Rocket 3', 'Tiger', 
                'Trident', 'Speed Triple', 'Street Triple'
            ],
            'Harley Davidson': [
                'Sportster', 'Softail', 'Touring', 'Street', 'V-Rod', 
                'Pan America', 'LiveWire'
            ],
            'MV Agusta': [
                'F4', 'Brutale', 'Dragster', 'Superveloce', 'Turismo Veloce'
            ],

            // ==========================
            // TRICYCLES
            // ==========================
            'Piaggio': [
                'Ape', 'Auto', 'City', 'Ape City', 'Ape Classic', 
                'Ape Calessino', 'Mp3', 'Beverly'
            ],
            'TVS Tricycle': [
                'King', 'TVS Auto', 'TVS Ape', 'TVS XL', 'NTV'
            ],
            'Bajaj Tricycle': [
                'RE', 'Bajaj Auto', 'Bajaj RE', 'Bajaj Maxima', 
                'Compact', 'Qute', 'Tuk Tuk'
            ],

            // Fallback
            'Other': ['Other']
        };

        // ─── DOM Elements ─────────────────────────────────────────────
        const vehicleTypeSelect = document.getElementById('vehicleType');
        const makeSelect = document.getElementById('make');
        const modelSelect = document.getElementById('model');

        // ─── Update Models when Make changes ──────────────────────────
        function updateModelDropdown() {
            const selectedMake = makeSelect.value;
            const models = MODEL_MAP[selectedMake] || ['Other'];
            
            // Clear current options
            modelSelect.innerHTML = '';
            
            // Add default placeholder
            const placeholder = document.createElement('option');
            placeholder.value = '';
            placeholder.textContent = '-- Select Model --';
            modelSelect.appendChild(placeholder);

            // Add models
            models.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m;
                opt.textContent = m;
                modelSelect.appendChild(opt);
            });
        }

        // ─── Event Listeners ──────────────────────────────────────────
        vehicleTypeSelect.addEventListener('change', function() {
            // When vehicle type changes, reset the Make dropdown to the first option of that group
            const firstMake = makeSelect.querySelector('optgroup[label="Cars"] option') ||
                              makeSelect.querySelector('optgroup[label="Bikes"] option') ||
                              makeSelect.querySelector('optgroup[label="Tricycles"] option');
            
            if (firstMake) {
                makeSelect.value = firstMake.value;
                updateModelDropdown();
            }
        });

        makeSelect.addEventListener('change', updateModelDropdown);

        // ─── Initialize ──────────────────────────────────────────────
        // Set the initial Model list based on the default Make
        updateModelDropdown();

        // ─── Form Submission ──────────────────────────────────────────
        document.getElementById('instantForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const vehicleType = vehicleTypeSelect.value;
            const make = makeSelect.value;
            const model = modelSelect.value;
            const year = parseInt(document.getElementById('year').value);
            const fuelType = document.getElementById('fuelType').value;
            const transmission = document.getElementById('transmission').value;
            const mileage = parseInt(document.getElementById('mileage').value);
            const condition = document.getElementById('condition').value;
            const accidentHistory = document.getElementById('accidentHistory').value;
            const location = document.getElementById('location').value;
            const previousOwners = parseInt(document.getElementById('previousOwners').value);
            const usageType = document.getElementById('usageType').value;
            const phone = document.getElementById('mpesaPhone').value.trim();

            if (!model) {
                alert('Please select a valid model.');
                return;
            }

            const statusBox = document.getElementById('statusBox');
            const resultBox = document.getElementById('resultBox');
            const btn = document.getElementById('submitBtn');

            // Reset UI
            statusBox.style.display = 'none';
            resultBox.style.display = 'none';
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Processing...';

            try {
                // 1. Authenticate
                const { data: { user } } = await client.auth.getUser();
                if (!user) {
                    statusBox.className = 'status-box status-error';
                    statusBox.textContent = '❌ Please login again.';
                    statusBox.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = '💳 Get Instant Value';
                    return;
                }

                // 2. Call the Python AI Valuation Engine
                const response = await fetch(`${API_BASE}/instant-check/valuate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        make, model, year, fuel_type: fuelType,
                        transmission, mileage, condition,
                        accident_history: accidentHistory, location,
                        previous_owners: previousOwners, usage_type: usageType,
                        vehicle_type: vehicleType
                    })
                });

                if (!response.ok) {
                    throw new Error('AI Valuation Engine error');
                }

                const result = await response.json();
                
                // 3. Save the Request to Supabase (Record keeping)
                await client
                    .from('service_requests')
                    .insert({
                        user_id: user.id,
                        service_type: 'instant-value-check',
                        amount: SERVICE_FEE,
                        phone: phone,
                        vehicle_make: make,
                        vehicle_model: model,
                        vehicle_year: year,
                        vehicle_mileage: mileage,
                        fuel_type: fuelType,
                        transmission: transmission,
                        vehicle_condition: condition,
                        accident_history: accidentHistory,
                        location: location,
                        result: result,
                        payment_status: 'paid', // Payment handled separately or simulated
                        status: 'completed'
                    });

                // 4. Display Result
                const certNumber = `AUTO-VAL-${Date.now().toString(36).toUpperCase()}-${Math.random().toString(36).substring(2, 6).toUpperCase()}`;

                statusBox.className = 'status-box status-success';
                statusBox.textContent = '✅ AI Valuation complete!';
                statusBox.style.display = 'block';

                document.getElementById('resultMarketValue').textContent = `KES ${result.value.toLocaleString()}`;
                document.getElementById('resultVehicle').textContent = `${make} ${model}`;
                document.getElementById('resultYear').textContent = year;
                document.getElementById('resultLocation').textContent = location;
                document.getElementById('resultDate').textContent = new Date().toLocaleDateString('en-KE');
                document.getElementById('resultCert').textContent = certNumber;

                resultBox.style.display = 'block';
                btn.textContent = '✅ Completed';
                btn.disabled = true;

            } catch (err) {
                statusBox.className = 'status-box status-error';
                statusBox.textContent = '❌ Error: ' + err.message;
                statusBox.style.display = 'block';
                btn.disabled = false;
                btn.textContent = '💳 Get Instant Value';
            }
        });
    </script>

</body>
</html>
