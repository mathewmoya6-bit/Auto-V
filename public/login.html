<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>AUTO-V | Login</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23eab308' rx='20'/%3E%3Ctext x='50' y='72' font-size='60' text-anchor='middle' fill='%23000'%3E🚗%3C/text%3E%3C/svg%3E">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0a0c15 0%, #0f172a 50%, #1e1b4b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(234,179,8,0.08) 0%, transparent 70%);
            animation: rotate 40s linear infinite;
            pointer-events: none;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .login-container {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 48px 40px;
            width: 100%;
            max-width: 460px;
            border: 1px solid rgba(234, 179, 8, 0.3);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 1;
        }
        .logo { text-align: center; margin-bottom: 32px; }
        .logo h1 {
            font-size: 48px;
            background: linear-gradient(135deg, #eab308, #facc15);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 800;
        }
        .logo p { color: #94a3b8; font-size: 14px; margin-top: 8px; }
        .form-group { margin-bottom: 24px; }
        label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input {
            width: 100%;
            padding: 14px 18px;
            background: #0a0f1c;
            border: 2px solid #2d3a4e;
            border-radius: 16px;
            color: white;
            font-size: 15px;
            transition: all 0.3s;
            font-family: inherit;
        }
        input:focus {
            outline: none;
            border-color: #eab308;
            box-shadow: 0 0 0 4px rgba(234, 179, 8, 0.15);
        }
        input::placeholder { color: #475569; }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #eab308, #facc15);
            color: #0a0c15;
            border: none;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 16px;
            font-family: inherit;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(234, 179, 8, 0.3);
        }
        button:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .message {
            padding: 14px 18px;
            border-radius: 16px;
            margin-bottom: 24px;
            display: none;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            animation: slideDown 0.3s ease;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .error-message { background: #7f1d1d; color: #fecaca; border-left: 4px solid #ef4444; }
        .success-message { background: #14532d; color: #bbf7d0; border-left: 4px solid #22c55e; }
        .info-message { background: #1e293b; color: #eab308; border-left: 4px solid #eab308; }
        .signup-link {
            text-align: center;
            margin-top: 28px;
            color: #94a3b8;
            font-size: 14px;
        }
        .signup-link a {
            color: #eab308;
            cursor: pointer;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.2s;
        }
        .signup-link a:hover {
            text-decoration: underline;
            color: #facc15;
        }
        .mpesa-badge {
            text-align: center;
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid #1e293b;
            font-size: 11px;
            color: #64748b;
        }
        .mpesa-badge strong { color: #22c55e; font-size: 13px; }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid #fff;
            border-radius: 50%;
            border-top-color: #eab308;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 480px) {
            .login-container { padding: 32px 24px; margin: 16px; }
            .logo h1 { font-size: 36px; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>🚗 AUTO-V</h1>
            <p>Africa's Leading Vehicle Intelligence Platform</p>
        </div>

        <div id="messageBox" class="message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label>📧 Email Address</label>
                <input type="email" id="email" placeholder="your@email.com" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label>🔒 Password</label>
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
            </div>
            <button type="submit" id="loginBtn">Login</button>
        </form>

        <div class="signup-link">
            Don't have an account? <a id="signupBtn">Create Account</a>
        </div>

        <div class="mpesa-badge">
            💳 M-Pesa Paybill: <strong>4095377</strong> | Account: <strong>AUTO-V</strong>
        </div>
    </div>

    <!-- Signup Modal -->
    <div id="signupModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center;">
        <div style="background: #0f172a; border-radius: 24px; padding: 32px; max-width: 400px; width: 90%; border: 2px solid #eab308;">
            <h2 style="color: #eab308; margin-bottom: 20px;">📝 Create Account</h2>
            <form id="signupForm">
                <div class="form-group"><label>Full Name</label><input type="text" id="signupName" autocomplete="name" placeholder="John Doe"></div>
                <div class="form-group"><label>Email</label><input type="email" id="signupEmail" autocomplete="email" placeholder="your@email.com" required></div>
                <div class="form-group"><label>Phone</label><input type="tel" id="signupPhone" autocomplete="tel" placeholder="+254 700 000 000"></div>
                <div class="form-group"><label>Password (min 6 chars)</label><input type="password" id="signupPassword" autocomplete="new-password" placeholder="••••••••" required></div>
                <div class="form-group"><label>Confirm Password</label><input type="password" id="signupConfirmPassword" autocomplete="new-password" placeholder="••••••••" required></div>
                <button type="submit" style="width:100%; margin-top:10px;">Sign Up</button>
                <button type="button" id="closeSignupBtn" style="background: #334155; margin-top:10px;">Cancel</button>
            </form>
        </div>
    </div>

    <script>
        // ============================================================
        // AUTO-V LOGIN - SIMPLIFIED WORKING VERSION
        // ============================================================

        const SUPABASE_URL = 'https://tsvejnzxrxrrecgquxbq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzdmVqbnp4cnhycmVjZ3F1eGJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExODczNjgsImV4cCI6MjA5Njc2MzM2OH0.PCEppwafuPatBoWh4OnhzgHv6fA9uF5-bWW9mmf2VoQ';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ─── DOM Elements ─────────────────────────────────────────────
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const signupBtn = document.getElementById('signupBtn');
        const messageBox = document.getElementById('messageBox');

        function showMessage(text, type = 'error') {
            messageBox.textContent = text;
            messageBox.className = `message ${type}-message`;
            messageBox.style.display = 'block';
            setTimeout(() => { messageBox.style.display = 'none'; }, 5000);
        }

        function clearMessage() { messageBox.style.display = 'none'; }

        function isValidEmail(email) {
            return /^[^\s@]+@([^\s@.,]+\.)+[^\s@.,]{2,}$/.test(email);
        }

        // ─── SIMPLIFIED: Check if user has profile ──────────────────
        async function getUserProfile(userId) {
            try {
                const { data, error } = await supabase
                    .from('user_profiles')
                    .select('*')
                    .eq('id', userId)
                    .maybeSingle();
                
                if (error) {
                    console.log('Profile fetch error:', error);
                    return null;
                }
                return data;
            } catch (e) {
                console.log('Profile error:', e);
                return null;
            }
        }

        // ─── SIMPLIFIED: Create or update profile ──────────────────
        async function createOrUpdateProfile(userId, email, name) {
            try {
                // Check if profile exists
                const existing = await getUserProfile(userId);
                
                if (existing) {
                    // Update existing
                    const { error } = await supabase
                        .from('user_profiles')
                        .update({
                            login_count: (existing.login_count || 0) + 1,
                            last_login: new Date().toISOString(),
                            updated_at: new Date().toISOString()
                        })
                        .eq('id', userId);
                    
                    if (error) {
                        console.error('Update error:', error);
                    } else {
                        console.log('✅ Profile updated');
                    }
                    return existing;
                } else {
                    // Create new
                    const { error } = await supabase
                        .from('user_profiles')
                        .insert({
                            id: userId,
                            email: email,
                            full_name: name || email.split('@')[0],
                            first_login: true,
                            has_vehicle: false,
                            login_count: 1,
                            last_login: new Date().toISOString(),
                            created_at: new Date().toISOString(),
                            updated_at: new Date().toISOString()
                        });
                    
                    if (error) {
                        console.error('Insert error:', error);
                        return null;
                    }
                    console.log('✅ New profile created');
                    return { first_login: true, has_vehicle: false };
                }
            } catch (e) {
                console.error('Profile error:', e);
                return null;
            }
        }

        // ─── HANDLE LOGIN ────────────────────────────────────────────
        async function handleLogin(e) {
            e.preventDefault();
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            clearMessage();

            if (!email || !password) {
                showMessage('Please enter both email and password', 'error');
                return;
            }

            if (!isValidEmail(email)) {
                showMessage('Please enter a valid email address', 'error');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner"></span> Logging in...';

            try {
                // ─── Sign in ──────────────────────────────────────
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });

                if (error) {
                    showMessage(error.message || 'Login failed', 'error');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = 'Login';
                    return;
                }

                const user = data.user;
                console.log('👤 Logged in:', user.email);

                // ─── Get/Create Profile ───────────────────────────
                const name = user.user_metadata?.full_name || email.split('@')[0];
                const profile = await createOrUpdateProfile(user.id, user.email, name);

                // ─── DECIDE WHERE TO GO ──────────────────────────
                // NEW USER: first_login = true OR has_vehicle = false
                const isNew = !profile || profile.first_login === true || profile.has_vehicle === false;
                
                console.log('🎯 Redirect decision:', {
                    isNew,
                    profile: profile ? {
                        first_login: profile.first_login,
                        has_vehicle: profile.has_vehicle,
                        login_count: profile.login_count
                    } : 'no profile'
                });

                if (isNew) {
                    showMessage('👋 Welcome! Redirecting to onboarding...', 'success');
                    setTimeout(() => {
                        window.location.href = "customer-portal.html";
                    }, 800);
                } else {
                    showMessage('✅ Welcome back! Redirecting to dashboard...', 'success');
                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 800);
                }

            } catch (err) {
                console.error('Unexpected error:', err);
                showMessage('Network error. Please try again.', 'error');
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'Login';
            }
        }

        // ─── HANDLE SIGNUP ───────────────────────────────────────────
        async function handleSignup(e) {
            e.preventDefault();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('signupConfirmPassword').value;
            const name = document.getElementById('signupName').value.trim();
            const phone = document.getElementById('signupPhone').value.trim();

            if (!email || !password) {
                showMessage('Please enter email and password', 'error');
                return;
            }

            if (!isValidEmail(email)) {
                showMessage('Please enter a valid email address', 'error');
                return;
            }

            if (password.length < 6) {
                showMessage('Password must be at least 6 characters', 'error');
                return;
            }

            if (password !== confirmPassword) {
                showMessage('Passwords do not match', 'error');
                return;
            }

            const submitBtn = document.querySelector('#signupForm button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span> Creating...';

            try {
                const { data, error } = await supabase.auth.signUp({
                    email,
                    password,
                    options: {
                        data: {
                            full_name: name || email.split('@')[0],
                            phone: phone || ''
                        }
                    }
                });

                if (error) {
                    showMessage(error.message || 'Signup failed', 'error');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalText;
                    return;
                }

                if (data.user) {
                    // Create profile
                    await supabase.from('user_profiles').insert({
                        id: data.user.id,
                        email: email,
                        full_name: name || email.split('@')[0],
                        phone: phone || '',
                        first_login: true,
                        has_vehicle: false,
                        login_count: 0,
                        created_at: new Date().toISOString(),
                        updated_at: new Date().toISOString()
                    });

                    showMessage('✅ Account created! Please check your email to verify.', 'success');
                    document.getElementById('signupModal').style.display = 'none';

                    // Try auto-login
                    const { data: loginData } = await supabase.auth.signInWithPassword({ email, password });
                    if (loginData?.user) {
                        setTimeout(() => {
                            window.location.href = "customer-portal.html";
                        }, 1000);
                    }
                }

            } catch (err) {
                console.error('Signup error:', err);
                showMessage('Network error. Please try again.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalText;
            }
        }

        // ─── CHECK EXISTING SESSION ──────────────────────────────────
        async function checkExistingSession() {
            try {
                const { data: { session } } = await supabase.auth.getSession();
                if (session) {
                    console.log('🔐 Session exists');
                    const profile = await getUserProfile(session.user.id);
                    
                    const isNew = !profile || profile.first_login === true || profile.has_vehicle === false;
                    
                    if (isNew) {
                        window.location.href = "customer-portal.html";
                    } else {
                        window.location.href = "dashboard.html";
                    }
                }
            } catch (err) {
                console.log('No active session');
            }
        }

        // ─── EVENT LISTENERS ─────────────────────────────────────────
        document.getElementById('loginForm').addEventListener('submit', handleLogin);
        document.getElementById('signupForm').addEventListener('submit', handleSignup);

        signupBtn.addEventListener('click', () => {
            document.getElementById('signupModal').style.display = 'flex';
        });

        document.getElementById('closeSignupBtn').addEventListener('click', () => {
            document.getElementById('signupModal').style.display = 'none';
        });

        document.getElementById('signupModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                document.getElementById('signupModal').style.display = 'none';
            }
        });

        emailInput.addEventListener('input', clearMessage);
        passwordInput.addEventListener('input', clearMessage);

        // ─── START ──────────────────────────────────────────────────
        checkExistingSession();
        emailInput.focus();

        console.log('🚀 AUTO-V Login page loaded');
        console.log('📌 New users → customer-portal.html | Existing → dashboard.html');
    </script>
</body>
</html>
