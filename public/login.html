<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>AUTO-V | Login</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23eab308' rx='20'/%3E%3Ctext x='50' y='72' font-size='60' text-anchor='middle' fill='%23000'%3E🚗%3C/text%3E%3C/svg%3E">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* ─── RESET & BASE ─── */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #0a0c15;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(234, 179, 8, 0.07) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(234, 179, 8, 0.05) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(34, 197, 94, 0.04) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .glow-orb {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(234, 179, 8, 0.06), transparent 70%);
            top: -200px;
            right: -200px;
            pointer-events: none;
            animation: floatGlow 20s ease-in-out infinite alternate;
            z-index: 0;
        }

        .glow-orb-bottom {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(34, 197, 94, 0.04), transparent 70%);
            bottom: -150px;
            left: -150px;
            pointer-events: none;
            animation: floatGlow 25s ease-in-out infinite alternate-reverse;
            z-index: 0;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 30px) scale(1.2); }
        }

        .auth-container {
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 48px 40px 36px;
            width: 100%;
            max-width: 440px;
            border: 1px solid rgba(234, 179, 8, 0.15);
            box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.03);
            position: relative;
            z-index: 1;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .auth-container:hover {
            box-shadow: 0 30px 70px -12px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .logo { text-align: center; margin-bottom: 32px; }

        .logo-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 8px;
            filter: drop-shadow(0 4px 12px rgba(234, 179, 8, 0.2));
        }

        .logo h1 {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #eab308, #facc15);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .logo .subtitle { color: #94a3b8; font-size: 14px; font-weight: 400; margin-top: 4px; }

        .message {
            padding: 14px 18px;
            border-radius: 14px;
            margin-bottom: 24px;
            display: none;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            animation: slideDown 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .error-message {
            background: rgba(127, 29, 29, 0.8);
            color: #fecaca;
            border-left: 4px solid #ef4444;
            backdrop-filter: blur(4px);
        }

        .success-message {
            background: rgba(20, 83, 45, 0.8);
            color: #bbf7d0;
            border-left: 4px solid #22c55e;
            backdrop-filter: blur(4px);
        }

        .info-message {
            background: rgba(30, 41, 59, 0.8);
            color: #fcd34d;
            border-left: 4px solid #eab308;
            backdrop-filter: blur(4px);
        }

        .form-group { margin-bottom: 20px; }

        label {
            display: block;
            margin-bottom: 6px;
            color: #94a3b8;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .input-wrapper { position: relative; }

        .input-wrapper input {
            width: 100%;
            padding: 14px 18px;
            background: #0a0f1c;
            border: 2px solid #1e293b;
            border-radius: 14px;
            color: #f1f5f9;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: #eab308;
            box-shadow: 0 0 0 4px rgba(234, 179, 8, 0.1);
            background: #0f172a;
        }

        .input-wrapper input::placeholder { color: #475569; font-weight: 400; }

        .input-wrapper input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 1000px #0a0f1c inset !important;
            -webkit-text-fill-color: #f1f5f9 !important;
            border-color: #2d3a4e;
        }

        .auth-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #eab308, #facc15);
            color: #0a0c15;
            border: none;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            margin-top: 8px;
            font-family: inherit;
            position: relative;
            overflow: hidden;
        }

        .auth-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 40%, rgba(255, 255, 255, 0.15) 100%);
            pointer-events: none;
        }

        .auth-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px -8px rgba(234, 179, 8, 0.35);
        }

        .auth-btn:active:not(:disabled) { transform: translateY(0px) scale(0.98); }

        .auth-btn:disabled {
            background: #334155;
            color: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .auth-btn .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(10, 12, 21, 0.2);
            border-radius: 50%;
            border-top-color: #0a0c15;
            animation: spin 0.6s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .footer-links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #1e293b;
            flex-wrap: wrap;
            gap: 12px;
        }

        .footer-links a {
            color: #64748b;
            text-decoration: none;
            font-size: 13px;
            transition: color 0.2s;
            cursor: pointer;
        }
        .footer-links a:hover { color: #eab308; }

        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 11px;
            color: #475569;
            margin-top: 14px;
        }

        .security-badge svg { width: 14px; height: 14px; fill: #22c55e; }

        .forgot-password {
            text-align: right;
            margin-top: -10px;
            margin-bottom: 10px;
        }

        .forgot-password a {
            color: #64748b;
            font-size: 12px;
            text-decoration: none;
            transition: color 0.2s;
            cursor: pointer;
        }
        .forgot-password a:hover { color: #eab308; }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 24px;
            border-radius: 8px;
            z-index: 9999;
            font-weight: 500;
            animation: slideIn 0.3s ease;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            font-family: 'Inter', sans-serif;
        }
        .toast-success { background: #22c55e; color: #000; }
        .toast-error { background: #ef4444; color: #fff; }
        .toast-warning { background: #eab308; color: #000; }
        .toast-info { background: #3b82f6; color: #fff; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(100px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .password-hint {
            font-size: 11px;
            color: #64748b;
            margin-top: 4px;
        }

        .password-hint .valid { color: #22c55e; }
        .password-hint .invalid { color: #ef4444; }

        .tab-switch {
            display: flex;
            gap: 4px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 24px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: #eab308;
            color: #0a0c15;
        }

        .tab-btn:hover:not(.active) {
            background: rgba(255,255,255,0.05);
        }

        @media (max-width: 480px) {
            .auth-container { padding: 32px 20px 28px; border-radius: 24px; margin: 12px; }
            .logo h1 { font-size: 26px; }
            .logo-icon { font-size: 38px; }
            .input-wrapper input { padding: 13px 16px; font-size: 14px; }
            .auth-btn { padding: 14px; font-size: 15px; }
            .footer-links { flex-direction: column; text-align: center; }
            .form-row { grid-template-columns: 1fr; }
        }

        @media (max-width: 380px) {
            .auth-container { padding: 24px 16px 20px; }
            .logo h1 { font-size: 22px; }
        }
    </style>
</head>
<body>

    <div class="glow-orb"></div>
    <div class="glow-orb-bottom"></div>

    <div class="auth-container" role="main" aria-label="Authentication">

        <div class="logo">
            <span class="logo-icon">🚗</span>
            <h1>AUTO‑V</h1>
            <p class="subtitle" id="authSubtitle">Sign in to your account</p>
        </div>

        <div id="messageBox" class="message" role="alert" aria-live="polite"></div>

        <!-- Tab Switch -->
        <div class="tab-switch">
            <button class="tab-btn active" data-tab="login" id="loginTab">Sign In</button>
            <button class="tab-btn" data-tab="register" id="registerTab">Create Account</button>
        </div>

        <!-- Login Form -->
        <form id="loginForm" autocomplete="off" novalidate>
            <div class="form-group">
                <label for="email">📧 Email Address</label>
                <div class="input-wrapper">
                    <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">🔒 Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
                </div>
            </div>

            <div class="forgot-password">
                <a id="forgotPasswordLink">Forgot password?</a>
            </div>

            <button type="submit" class="auth-btn" id="loginBtn">
                Sign In
            </button>
        </form>

        <!-- Registration Form -->
        <form id="registerForm" autocomplete="off" novalidate style="display:none;">
            <div class="form-group">
                <label for="regEmail">📧 Email Address</label>
                <div class="input-wrapper">
                    <input type="email" id="regEmail" placeholder="you@example.com" autocomplete="email" required>
                </div>
            </div>

            <div class="form-group">
                <label for="regFullName">👤 Full Name</label>
                <div class="input-wrapper">
                    <input type="text" id="regFullName" placeholder="John Doe" autocomplete="name" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="regPhone">📱 Phone</label>
                    <div class="input-wrapper">
                        <input type="tel" id="regPhone" placeholder="+254700000000" autocomplete="tel">
                    </div>
                </div>
                <div class="form-group">
                    <label for="regCompany">🏢 Company</label>
                    <div class="input-wrapper">
                        <input type="text" id="regCompany" placeholder="Company name (optional)">
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="regPassword">🔒 Password</label>
                <div class="input-wrapper">
                    <input type="password" id="regPassword" placeholder="Min 8 characters" autocomplete="new-password" required>
                </div>
                <div class="password-hint" id="passwordHint">
                    <span class="invalid">✗</span> At least 8 characters
                    <span class="invalid">✗</span> Uppercase & lowercase
                    <span class="invalid">✗</span> At least one number
                </div>
            </div>

            <div class="form-group">
                <label for="regConfirmPassword">🔒 Confirm Password</label>
                <div class="input-wrapper">
                    <input type="password" id="regConfirmPassword" placeholder="Confirm your password" autocomplete="new-password" required>
                </div>
            </div>

            <button type="submit" class="auth-btn" id="registerBtn">
                Create Account
            </button>
        </form>

        <div class="footer-links">
            <a id="switchToLogin">← Back to Login</a>
            <a id="switchToRegister">Create Account →</a>
        </div>

        <div class="security-badge">
            <svg viewBox="0 0 24 24"><path d="M12 1C8.676 1 5.5 2.5 3.5 4.5 2 6 1 8.5 1 11c0 6 4.5 11 11 12 6.5-1 11-6 11-12 0-2.5-1-5-2.5-6.5C18.5 2.5 15.324 1 12 1zm0 19c-4.5-1-8-4.5-9-9 0-2 1-4 2-5 1.5-1.5 4-2.5 7-2.5s5.5 1 7 2.5c1 1 2 3 2 5-1 4.5-4.5 8-9 9zm0-14c-1.5 0-2.5 1-2.5 2.5S10.5 11 12 11s2.5-1 2.5-2.5S13.5 6 12 6zm0 8c-2 0-3.5 1.5-3.5 3.5h7c0-2-1.5-3.5-3.5-3.5z"/></svg>
            <span>256‑bit SSL · Secure</span>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════
        // AUTO-V AUTHENTICATION — Login + Registration
        // ═══════════════════════════════════════════════════════════════

        (function() {
            'use strict';

            // ─── CONFIG ──────────────────────────────────────────────────
            const API_BASE = 'https://auto-v.onrender.com/api/v1';
            const DASHBOARD_URL = '/dashboard.html';
            const ADMIN_DASHBOARD = '/admin-dashboard.html';

            // ─── DOM REFS ───────────────────────────────────────────────
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const loginTab = document.getElementById('loginTab');
            const registerTab = document.getElementById('registerTab');
            const switchToLogin = document.getElementById('switchToLogin');
            const switchToRegister = document.getElementById('switchToRegister');
            const forgotPasswordLink = document.getElementById('forgotPasswordLink');
            const authSubtitle = document.getElementById('authSubtitle');

            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');

            const regEmail = document.getElementById('regEmail');
            const regFullName = document.getElementById('regFullName');
            const regPhone = document.getElementById('regPhone');
            const regCompany = document.getElementById('regCompany');
            const regPassword = document.getElementById('regPassword');
            const regConfirmPassword = document.getElementById('regConfirmPassword');
            const registerBtn = document.getElementById('registerBtn');
            const passwordHint = document.getElementById('passwordHint');

            const messageBox = document.getElementById('messageBox');

            // ─── STATE ──────────────────────────────────────────────────
            let currentTab = 'login';
            let isSubmitting = false;
            let abortController = null;

            // ─── MESSAGE FUNCTIONS ─────────────────────────────────────
            window.showToast = function(msg, type = 'success') {
                const existing = document.querySelector('.toast');
                if (existing) existing.remove();
                const toast = document.createElement('div');
                toast.className = `toast toast-${type}`;
                toast.textContent = msg;
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 4000);
            };

            function showMessage(text, type = 'error') {
                messageBox.textContent = text;
                messageBox.className = `message ${type}-message`;
                messageBox.style.display = 'block';
                clearTimeout(window._msgTimer);
                window._msgTimer = setTimeout(() => {
                    messageBox.style.display = 'none';
                }, 8000);
            }

            function clearMessage() {
                messageBox.style.display = 'none';
                clearTimeout(window._msgTimer);
            }

            // ─── VALIDATION ─────────────────────────────────────────────
            function isValidEmail(email) {
                return /^[^\s@]+@([^\s@.,]+\.)+[^\s@.,]{2,}$/.test(email);
            }

            function validatePassword(password) {
                const hasMinLength = password.length >= 8;
                const hasUpper = /[A-Z]/.test(password);
                const hasLower = /[a-z]/.test(password);
                const hasNumber = /\d/.test(password);
                return { valid: hasMinLength && hasUpper && hasLower && hasNumber, hasMinLength, hasUpper, hasLower, hasNumber };
            }

            function updatePasswordHint(password) {
                const validation = validatePassword(password);
                const hints = passwordHint.querySelectorAll('span');
                const checks = [
                    { el: hints[0], valid: validation.hasMinLength },
                    { el: hints[1], valid: validation.hasUpper && validation.hasLower },
                    { el: hints[2], valid: validation.hasNumber }
                ];
                checks.forEach(({el, valid}) => {
                    el.className = valid ? 'valid' : 'invalid';
                    el.textContent = valid ? '✓' : '✗';
                });
            }

            // ─── API CALLS ─────────────────────────────────────────────
            async function apiCall(endpoint, options = {}) {
                // Cancel any pending request
                if (abortController) {
                    abortController.abort();
                }
                abortController = new AbortController();
                
                const url = `${API_BASE}${endpoint}`;
                const timeout = 30000; // 30 seconds timeout
                
                try {
                    const response = await Promise.race([
                        fetch(url, {
                            ...options,
                            headers: {
                                'Content-Type': 'application/json',
                                'Accept': 'application/json',
                                ...(options.headers || {})
                            },
                            signal: abortController.signal
                        }),
                        new Promise((_, reject) => 
                            setTimeout(() => reject(new Error('Request timeout')), timeout)
                        )
                    ]);

                    // Check if response is JSON
                    const contentType = response.headers.get('content-type');
                    if (!contentType || !contentType.includes('application/json')) {
                        throw new Error(`Server returned ${contentType || 'unknown'} format. Expected JSON.`);
                    }

                    const data = await response.json();

                    if (!response.ok) {
                        const errorMsg = data.detail || data.message || `HTTP ${response.status}`;
                        throw new Error(errorMsg);
                    }

                    return data;
                } catch (error) {
                    if (error.name === 'AbortError') {
                        throw new Error('Request cancelled');
                    }
                    console.error(`❌ API call failed: ${endpoint}`, error);
                    throw error;
                } finally {
                    abortController = null;
                }
            }

            // ─── TAB SWITCHING ──────────────────────────────────────────
            window.switchTab = function(tab) {
                currentTab = tab;
                clearMessage();

                if (tab === 'login') {
                    loginForm.style.display = 'block';
                    registerForm.style.display = 'none';
                    loginTab.classList.add('active');
                    registerTab.classList.remove('active');
                    authSubtitle.textContent = 'Sign in to your account';
                    switchToLogin.style.display = 'none';
                    switchToRegister.style.display = 'inline';
                } else {
                    loginForm.style.display = 'none';
                    registerForm.style.display = 'block';
                    registerTab.classList.add('active');
                    loginTab.classList.remove('active');
                    authSubtitle.textContent = 'Create your account';
                    switchToLogin.style.display = 'inline';
                    switchToRegister.style.display = 'none';
                }
            };

            // ─── SET LOADING STATE ─────────────────────────────────────
            function setLoading(btn, state, text) {
                btn.disabled = state;
                if (state) {
                    btn.innerHTML = '<span class="spinner"></span> ' + text;
                } else {
                    btn.innerHTML = text;
                }
                isSubmitting = state;
            }

            // ─── HANDLE LOGIN ──────────────────────────────────────────
            async function handleLogin(e) {
                e.preventDefault();
                clearMessage();

                if (isSubmitting) return;

                const email = emailInput.value.trim();
                const password = passwordInput.value;

                if (!email || !password) {
                    showMessage('Please enter both email and password.', 'error');
                    return;
                }

                if (!isValidEmail(email)) {
                    showMessage('Please enter a valid email address.', 'error');
                    return;
                }

                setLoading(loginBtn, true, 'Signing in...');

                try {
                    const response = await apiCall('/auth/login', {
                        method: 'POST',
                        body: JSON.stringify({ email, password })
                    });

                    // Store token (handle both formats)
                    if (response.access_token) {
                        localStorage.setItem('access_token', response.access_token);
                    }
                    if (response.refresh_token) {
                        localStorage.setItem('refresh_token', response.refresh_token);
                    }

                    // Store user info (handle both formats)
                    const userData = response.user || response;
                    if (userData && userData.id) {
                        localStorage.setItem('autoV_user', JSON.stringify({
                            id: userData.id,
                            email: userData.email || email,
                            role: userData.role || 'user',
                            full_name: userData.full_name || email.split('@')[0]
                        }));
                    }

                    showMessage('✅ Login successful! Redirecting...', 'success');
                    window.showToast('✅ Welcome back!', 'success');

                    const isAdmin = userData?.role === 'admin' || userData?.role === 'super_admin';

                    setTimeout(() => {
                        window.location.href = isAdmin ? ADMIN_DASHBOARD : DASHBOARD_URL;
                    }, 1000);

                } catch (error) {
                    console.error('Login error:', error);
                    const msg = error.message || 'Login failed';
                    if (msg.includes('401') || msg.includes('Invalid credentials') || msg.includes('invalid')) {
                        showMessage('❌ Invalid email or password. Please try again.', 'error');
                    } else if (msg.includes('403') || msg.includes('disabled')) {
                        showMessage('⛔ Account is deactivated. Contact support.', 'error');
                    } else if (msg.includes('verify') || msg.includes('confirmed')) {
                        showMessage('📧 Please verify your email before logging in.', 'info');
                    } else if (msg.includes('timeout')) {
                        showMessage('⏳ Request timed out. Please check your connection.', 'error');
                    } else {
                        showMessage(`❌ ${msg}`, 'error');
                    }
                    setLoading(loginBtn, false, 'Sign In');
                }
            }

            // ─── HANDLE REGISTRATION ───────────────────────────────────
            async function handleRegister(e) {
                e.preventDefault();
                clearMessage();

                if (isSubmitting) return;

                const email = regEmail.value.trim();
                const fullName = regFullName.value.trim();
                const phone = regPhone.value.trim();
                const company = regCompany.value.trim();
                const password = regPassword.value;
                const confirm = regConfirmPassword.value;

                // Validation
                if (!email || !fullName || !password || !confirm) {
                    showMessage('Please fill in all required fields.', 'error');
                    return;
                }

                if (!isValidEmail(email)) {
                    showMessage('Please enter a valid email address.', 'error');
                    return;
                }

                const validation = validatePassword(password);
                if (!validation.valid) {
                    showMessage('Password must be at least 8 characters with uppercase, lowercase, and a number.', 'error');
                    return;
                }

                if (password !== confirm) {
                    showMessage('Passwords do not match.', 'error');
                    return;
                }

                setLoading(registerBtn, true, 'Creating account...');

                try {
                    const response = await apiCall('/auth/register', {
                        method: 'POST',
                        body: JSON.stringify({
                            email,
                            password,
                            full_name: fullName,
                            phone: phone || null,
                            company_name: company || null
                        })
                    });

                    showMessage('✅ Account created successfully! Please login.', 'success');
                    window.showToast('✅ Account created! Please login.', 'success');

                    // Switch to login tab after 2 seconds
                    setTimeout(() => {
                        window.switchTab('login');
                        emailInput.value = email;
                        passwordInput.value = '';
                        setLoading(registerBtn, false, 'Create Account');
                    }, 2000);

                } catch (error) {
                    console.error('Registration error:', error);
                    const msg = error.message || 'Registration failed';
                    if (msg.includes('already exists') || msg.includes('409')) {
                        showMessage('❌ User with this email already exists. Please login.', 'error');
                    } else if (msg.includes('timeout')) {
                        showMessage('⏳ Request timed out. Please check your connection.', 'error');
                    } else {
                        showMessage(`❌ ${msg}`, 'error');
                    }
                    setLoading(registerBtn, false, 'Create Account');
                }
            }

            // ─── CHECK EXISTING SESSION ────────────────────────────────
            async function checkExistingSession() {
                try {
                    const token = localStorage.getItem('access_token');
                    if (!token) return;

                    const response = await apiCall('/auth/me', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });

                    const userData = response || {};
                    if (userData && userData.id) {
                        localStorage.setItem('autoV_user', JSON.stringify({
                            id: userData.id,
                            email: userData.email,
                            role: userData.role || 'user',
                            full_name: userData.full_name || userData.email?.split('@')[0] || 'User'
                        }));

                        const isAdmin = userData.role === 'admin' || userData.role === 'super_admin';
                        window.location.href = isAdmin ? ADMIN_DASHBOARD : DASHBOARD_URL;
                    }
                } catch (error) {
                    console.log('Session expired or invalid');
                    localStorage.removeItem('access_token');
                    localStorage.removeItem('refresh_token');
                    localStorage.removeItem('autoV_user');
                }
            }

            // ─── EVENT LISTENERS ──────────────────────────────────────
            loginForm.addEventListener('submit', handleLogin);
            registerForm.addEventListener('submit', handleRegister);

            loginTab.addEventListener('click', () => window.switchTab('login'));
            registerTab.addEventListener('click', () => window.switchTab('register'));
            switchToLogin.addEventListener('click', () => window.switchTab('login'));
            switchToRegister.addEventListener('click', () => window.switchTab('register'));
            
            forgotPasswordLink.addEventListener('click', function(e) {
                e.preventDefault();
                window.showToast('Contact support to reset your password', 'info');
            });

            // Password validation on input
            regPassword.addEventListener('input', function() {
                updatePasswordHint(this.value);
            });

            // ─── INIT ──────────────────────────────────────────────────
            async function init() {
                // Check if user is already logged in
                await checkExistingSession();

                // Set initial tab
                window.switchTab('login');

                // Focus email field
                setTimeout(() => emailInput.focus(), 200);

                console.log('🚀 AUTO-V Authentication (Login + Register)');
                console.log(`📌 API Base: ${API_BASE}`);
                console.log(`📌 Dashboard: ${DASHBOARD_URL}`);
                console.log(`📌 Admin Dashboard: ${ADMIN_DASHBOARD}`);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>
</body>
</html>
