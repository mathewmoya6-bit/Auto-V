<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>AUTO-V | Login</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23eab308' rx='20'/%3E%3Ctext x='50' y='72' font-size='60' text-anchor='middle' fill='%23000'%3E🚗%3C/text%3E%3C/svg%3E">
    
    <!-- Import API Client -->
    <script src="js/api-client.js"></script>
    <script src="js/error-handler.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ─── RESET & BASE ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #0a0c15;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* ─── AMBIENT BACKGROUND ─── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(234, 179, 8, 0.07) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(234, 179, 8, 0.05) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(34, 197, 94, 0.04) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .glow-orb {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(234, 179, 8, 0.06), transparent 70%);
            top: -200px;
            right: -200px;
            pointer-events: none;
            animation: floatGlow 20s ease-in-out infinite alternate;
            z-index: 0;
        }

        .glow-orb-bottom {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(34, 197, 94, 0.04), transparent 70%);
            bottom: -150px;
            left: -150px;
            pointer-events: none;
            animation: floatGlow 25s ease-in-out infinite alternate-reverse;
            z-index: 0;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 30px) scale(1.2); }
        }

        .login-container {
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 48px 40px 36px;
            width: 100%;
            max-width: 440px;
            border: 1px solid rgba(234, 179, 8, 0.15);
            box-shadow:
                0 25px 60px -12px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.03);
            position: relative;
            z-index: 1;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-container:hover {
            box-shadow:
                0 30px 70px -12px rgba(0, 0, 0, 0.7),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .logo { text-align: center; margin-bottom: 32px; }

        .logo-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 8px;
            filter: drop-shadow(0 4px 12px rgba(234, 179, 8, 0.2));
        }

        .logo h1 {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #eab308, #facc15);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .logo .subtitle { color: #94a3b8; font-size: 14px; font-weight: 400; margin-top: 4px; }

        .message {
            padding: 14px 18px;
            border-radius: 14px;
            margin-bottom: 24px;
            display: none;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            animation: slideDown 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .error-message {
            background: rgba(127, 29, 29, 0.8);
            color: #fecaca;
            border-left: 4px solid #ef4444;
            backdrop-filter: blur(4px);
        }

        .success-message {
            background: rgba(20, 83, 45, 0.8);
            color: #bbf7d0;
            border-left: 4px solid #22c55e;
            backdrop-filter: blur(4px);
        }

        .info-message {
            background: rgba(30, 41, 59, 0.8);
            color: #fcd34d;
            border-left: 4px solid #eab308;
            backdrop-filter: blur(4px);
        }

        .form-group { margin-bottom: 20px; }

        label {
            display: block;
            margin-bottom: 6px;
            color: #94a3b8;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .input-wrapper { position: relative; }

        .input-wrapper input {
            width: 100%;
            padding: 14px 18px;
            background: #0a0f1c;
            border: 2px solid #1e293b;
            border-radius: 14px;
            color: #f1f5f9;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: #eab308;
            box-shadow: 0 0 0 4px rgba(234, 179, 8, 0.1);
            background: #0f172a;
        }

        .input-wrapper input::placeholder { color: #475569; font-weight: 400; }

        .input-wrapper input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 1000px #0a0f1c inset !important;
            -webkit-text-fill-color: #f1f5f9 !important;
            border-color: #2d3a4e;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #eab308, #facc15);
            color: #0a0c15;
            border: none;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            margin-top: 8px;
            font-family: inherit;
            position: relative;
            overflow: hidden;
        }

        .login-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 40%, rgba(255, 255, 255, 0.15) 100%);
            pointer-events: none;
        }

        .login-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px -8px rgba(234, 179, 8, 0.35);
        }

        .login-btn:active:not(:disabled) { transform: translateY(0px) scale(0.98); }

        .login-btn:disabled {
            background: #334155;
            color: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .login-btn .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(10, 12, 21, 0.2);
            border-radius: 50%;
            border-top-color: #0a0c15;
            animation: spin 0.6s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .footer-links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #1e293b;
            flex-wrap: wrap;
            gap: 12px;
        }

        .footer-links a {
            color: #64748b;
            text-decoration: none;
            font-size: 13px;
            transition: color 0.2s;
        }
        .footer-links a:hover { color: #eab308; }

        .social-login {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 16px;
        }

        .social-btn {
            flex: 1;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #1e293b;
            background: transparent;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
        }

        .social-btn:hover {
            background: #1e293b;
            border-color: #eab308;
            color: #fff;
        }

        .social-btn.google:hover { border-color: #ea4335; color: #ea4335; }
        .social-btn.github:hover { border-color: #6e7681; color: #6e7681; }

        .mpesa-info {
            text-align: center;
            padding-top: 18px;
            font-size: 11px;
            color: #475569;
            line-height: 1.7;
        }

        .mpesa-info strong { color: #22c55e; font-size: 13px; }
        .mpesa-info .highlight { color: #eab308; }

        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 11px;
            color: #475569;
            margin-top: 14px;
        }

        .security-badge svg { width: 14px; height: 14px; fill: #22c55e; }

        .forgot-password {
            text-align: right;
            margin-top: -10px;
            margin-bottom: 10px;
        }

        .forgot-password a {
            color: #64748b;
            font-size: 12px;
            text-decoration: none;
            transition: color 0.2s;
        }
        .forgot-password a:hover { color: #eab308; }

        @media (max-width: 480px) {
            .login-container { padding: 32px 20px 28px; border-radius: 24px; margin: 12px; }
            .logo h1 { font-size: 26px; }
            .logo-icon { font-size: 38px; }
            .input-wrapper input { padding: 13px 16px; font-size: 14px; }
            .login-btn { padding: 14px; font-size: 15px; }
            .footer-links { flex-direction: column; text-align: center; }
            .social-login { flex-direction: column; }
        }

        @media (max-width: 380px) {
            .login-container { padding: 24px 16px 20px; }
            .logo h1 { font-size: 22px; }
        }
    </style>
</head>
<body>

    <div class="glow-orb"></div>
    <div class="glow-orb-bottom"></div>

    <div class="login-container" role="main" aria-label="Login">

        <div class="logo">
            <span class="logo-icon">🚗</span>
            <h1>AUTO‑V</h1>
            <p class="subtitle">Sign in to your account</p>
        </div>

        <div id="messageBox" class="message" role="alert" aria-live="polite"></div>

        <form id="loginForm" autocomplete="off" novalidate>
            <div class="form-group">
                <label for="email">📧 Email Address</label>
                <div class="input-wrapper">
                    <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">🔒 Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
                </div>
            </div>

            <div class="forgot-password">
                <a href="forgot-password.html">Forgot password?</a>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                Sign In
            </button>
        </form>

        <div class="social-login">
            <button class="social-btn google" id="googleLogin">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Google
            </button>
            <button class="social-btn github" id="githubLogin">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.15 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.62.24 2.85.12 3.15.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
                GitHub
            </button>
        </div>

        <div class="footer-links">
            <a href="register.html">Create Account →</a>
            <a href="admin-login.html">🔒 Admin Login</a>
        </div>

        <div class="mpesa-info">
            💳 M‑Pesa Paybill: <strong>4095377</strong> &nbsp;|&nbsp; Account: <strong>AUTO‑V</strong><br>
            <span style="font-size:10px;">Valuations: <span class="highlight">KES 2,500</span> &nbsp;·&nbsp; Inspections: <span class="highlight">KES 3,500</span></span>
        </div>

        <div class="security-badge">
            <svg viewBox="0 0 24 24"><path d="M12 1C8.676 1 5.5 2.5 3.5 4.5 2 6 1 8.5 1 11c0 6 4.5 11 11 12 6.5-1 11-6 11-12 0-2.5-1-5-2.5-6.5C18.5 2.5 15.324 1 12 1zm0 19c-4.5-1-8-4.5-9-9 0-2 1-4 2-5 1.5-1.5 4-2.5 7-2.5s5.5 1 7 2.5c1 1 2 3 2 5-1 4.5-4.5 8-9 9zm0-14c-1.5 0-2.5 1-2.5 2.5S10.5 11 12 11s2.5-1 2.5-2.5S13.5 6 12 6zm0 8c-2 0-3.5 1.5-3.5 3.5h7c0-2-1.5-3.5-3.5-3.5z"/></svg>
            <span>256‑bit SSL · Secure Login</span>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════
        // AUTO-V USER LOGIN — FastAPI Backend Integration
        // ═══════════════════════════════════════════════════════════════

        (function() {
            'use strict';

            // ─── CONFIG ──────────────────────────────────────────────────
            const DASHBOARD_URL = 'dashboard.html';
            const ADMIN_DASHBOARD = 'admin-dashboard.html';

            // ─── DOM REFS ───────────────────────────────────────────────
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            const messageBox = document.getElementById('messageBox');
            const loginForm = document.getElementById('loginForm');

            // ─── API CLIENT CHECK ──────────────────────────────────────
            if (typeof api === 'undefined') {
                showMessage('⚠️ API client not loaded. Please refresh the page.', 'error');
                loginBtn.disabled = true;
                console.error('API client not found. Ensure js/api-client.js is loaded.');
            }

            // ─── MESSAGE FUNCTIONS ─────────────────────────────────────
            function showMessage(text, type = 'error') {
                messageBox.textContent = text;
                messageBox.className = 'message ' + type + '-message';
                messageBox.style.display = 'block';
                clearTimeout(window._msgTimer);
                window._msgTimer = setTimeout(() => {
                    messageBox.style.display = 'none';
                }, 5000);
            }

            function clearMessage() {
                messageBox.style.display = 'none';
                clearTimeout(window._msgTimer);
            }

            // ─── VALIDATION ─────────────────────────────────────────────
            function isValidEmail(email) {
                return /^[^\s@]+@([^\s@.,]+\.)+[^\s@.,]{2,}$/.test(email);
            }

            function setLoading(state) {
                loginBtn.disabled = state;
                loginBtn.innerHTML = state ?
                    '<span class="spinner"></span> Signing in...' :
                    'Sign In';
            }

            // ─── CHECK EXISTING SESSION ────────────────────────────────
            async function checkExistingSession() {
                try {
                    const token = localStorage.getItem('access_token');
                    if (!token) return;

                    // Verify token is still valid
                    const user = await api.get('/auth/me');
                    
                    // Check if user is admin
                    if (user.role === 'admin' || user.role === 'super_admin') {
                        console.log('✅ Admin session valid — redirecting to admin');
                        window.location.href = ADMIN_DASHBOARD;
                    } else {
                        console.log('✅ User session valid — redirecting to dashboard');
                        window.location.href = DASHBOARD_URL;
                    }
                } catch (error) {
                    // Token expired or invalid
                    console.log('Session expired or invalid');
                    localStorage.removeItem('access_token');
                }
            }

            // ─── LOGIN HANDLER ──────────────────────────────────────────
            async function handleLogin(e) {
                e.preventDefault();
                clearMessage();

                if (typeof api === 'undefined') {
                    showMessage('⚠️ API service unavailable. Please refresh the page.', 'error');
                    return;
                }

                const email = emailInput.value.trim();
                const password = passwordInput.value;

                // ─── Validation ─────────────────────────────────────────
                if (!email || !password) {
                    showMessage('Please enter both email and password.', 'error');
                    if (!email) emailInput.focus();
                    else passwordInput.focus();
                    return;
                }

                if (!isValidEmail(email)) {
                    showMessage('Please enter a valid email address.', 'error');
                    emailInput.focus();
                    return;
                }

                setLoading(true);

                try {
                    // ─── Call FastAPI Login Endpoint ────────────────────
                    const response = await api.post('/auth/login', {
                        email: email,
                        password: password
                    });

                    // ─── Store Token ─────────────────────────────────────
                    if (response.access_token) {
                        api.setToken(response.access_token);
                        localStorage.setItem('access_token', response.access_token);
                    }

                    // ─── Get User Info ──────────────────────────────────
                    const user = await api.get('/auth/me');

                    // Store user info
                    localStorage.setItem('autoV_user', JSON.stringify({
                        id: user.id,
                        email: user.email,
                        role: user.role || 'user',
                        full_name: user.full_name || user.email.split('@')[0],
                        verifiedAt: new Date().toISOString()
                    }));

                    // ─── Redirect based on role ─────────────────────────
                    const isAdmin = user.role === 'admin' || user.role === 'super_admin';
                    
                    showMessage('✅ Login successful! Redirecting...', 'success');
                    
                    setTimeout(() => {
                        if (isAdmin) {
                            window.location.href = ADMIN_DASHBOARD;
                        } else {
                            window.location.href = DASHBOARD_URL;
                        }
                    }, 1000);

                } catch (error) {
                    console.error('Login error:', error);
                    
                    // ─── Handle specific error cases ─────────────────────
                    if (error.message.includes('401') || error.message.includes('Invalid credentials')) {
                        showMessage('❌ Invalid email or password. Please try again.', 'error');
                    } else if (error.message.includes('403')) {
                        showMessage('⛔ Account suspended. Please contact support.', 'error');
                    } else if (error.message.includes('429')) {
                        showMessage('⏳ Too many login attempts. Please wait a moment.', 'error');
                    } else if (error.message.includes('Network') || error.message.includes('Failed to fetch')) {
                        showMessage('🌐 Network error. Please check your connection.', 'error');
                    } else if (error.message.includes('not confirmed') || error.message.includes('verify')) {
                        showMessage('📧 Please verify your email before logging in.', 'info');
                    } else {
                        showMessage('❌ Login failed: ' + error.message, 'error');
                    }
                    
                    setLoading(false);
                } finally {
                    // Only reset if not redirecting
                    if (!loginBtn.textContent.includes('Redirecting')) {
                        setLoading(false);
                    }
                }
            }

            // ─── SOCIAL LOGIN ───────────────────────────────────────────
            async function handleSocialLogin(provider) {
                try {
                    showMessage(`🔑 Redirecting to ${provider}...`, 'info');
                    
                    // Get social login URL from backend
                    const response = await api.get(`/auth/${provider}/url`);
                    
                    if (response.url) {
                        // Redirect to OAuth provider
                        window.location.href = response.url;
                    } else {
                        throw new Error('No redirect URL received');
                    }
                } catch (error) {
                    console.error(`${provider} login error:`, error);
                    showMessage(`❌ ${provider} login failed. Please try again.`, 'error');
                }
            }

            // ─── EVENT LISTENERS ──────────────────────────────────────
            loginForm.addEventListener('submit', handleLogin);
            emailInput.addEventListener('focus', clearMessage);
            passwordInput.addEventListener('focus', clearMessage);

            // Social login buttons
            document.getElementById('googleLogin')?.addEventListener('click', () => handleSocialLogin('google'));
            document.getElementById('githubLogin')?.addEventListener('click', () => handleSocialLogin('github'));

            // Enter key on password field
            passwordInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    loginForm.dispatchEvent(new Event('submit'));
                }
            });

            // ─── CHECK FOR EXISTING SESSION ON LOAD ────────────────────
            checkExistingSession();

            // ─── FOCUS EMAIL ────────────────────────────────────────────
            setTimeout(() => emailInput.focus(), 150);

            console.log('🚀 AUTO-V User Login (FastAPI Backend)');
            console.log('📌 Dashboard:', DASHBOARD_URL);
            console.log('📌 Admin Dashboard:', ADMIN_DASHBOARD);

        })();
    </script>
</body>
</html>
