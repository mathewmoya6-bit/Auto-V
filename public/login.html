<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>AUTO-V | Login - Vehicle Intelligence Platform</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23eab308' rx='20'/%3E%3Ctext x='50' y='72' font-size='60' text-anchor='middle' fill='%23000'%3E🚗%3C/text%3E%3C/svg%3E">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0a0c15 0%, #0f172a 50%, #1e1b4b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        /* Animated background */
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(234,179,8,0.08) 0%, transparent 70%);
            animation: rotate 40s linear infinite;
            pointer-events: none;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .login-container {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 48px 40px;
            width: 100%;
            max-width: 460px;
            border: 1px solid rgba(234, 179, 8, 0.3);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 1;
            transition: all 0.3s ease;
        }
        
        .logo { text-align: center; margin-bottom: 32px; }
        .logo h1 {
            font-size: 48px;
            background: linear-gradient(135deg, #eab308, #facc15);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 800;
        }
        .logo p {
            color: #94a3b8;
            font-size: 14px;
            margin-top: 8px;
        }
        
        .form-group { margin-bottom: 24px; }
        label { 
            display: block; 
            margin-bottom: 8px; 
            color: #cbd5e1; 
            font-weight: 600; 
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input {
            width: 100%;
            padding: 14px 18px;
            background: #0a0f1c;
            border: 2px solid #2d3a4e;
            border-radius: 16px;
            color: white;
            font-size: 15px;
            transition: all 0.3s;
            font-family: inherit;
        }
        input:focus {
            outline: none;
            border-color: #eab308;
            box-shadow: 0 0 0 4px rgba(234, 179, 8, 0.15);
        }
        input::placeholder {
            color: #475569;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #eab308, #facc15);
            color: #0a0c15;
            border: none;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 16px;
            font-family: inherit;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(234, 179, 8, 0.3);
        }
        button:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .message {
            padding: 14px 18px;
            border-radius: 16px;
            margin-bottom: 24px;
            display: none;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            animation: slideDown 0.3s ease;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .error-message { 
            background: #7f1d1d; 
            color: #fecaca; 
            border-left: 4px solid #ef4444;
        }
        .success-message { 
            background: #14532d; 
            color: #bbf7d0; 
            border-left: 4px solid #22c55e;
        }
        .info-message { 
            background: #1e293b; 
            color: #eab308; 
            border-left: 4px solid #eab308;
        }
        
        .signup-link { 
            text-align: center; 
            margin-top: 28px; 
            color: #94a3b8; 
            font-size: 14px; 
        }
        .signup-link a { 
            color: #eab308; 
            cursor: pointer; 
            text-decoration: none; 
            font-weight: 700;
            transition: all 0.2s;
        }
        .signup-link a:hover { 
            text-decoration: underline;
            color: #facc15;
        }
        
        .mpesa-badge {
            text-align: center;
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid #1e293b;
            font-size: 11px;
            color: #64748b;
        }
        .mpesa-badge strong {
            color: #22c55e;
            font-size: 13px;
        }
        
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid #fff;
            border-radius: 50%;
            border-top-color: #eab308;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .toggle-password {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #64748b;
            font-size: 12px;
        }
        .password-wrapper {
            position: relative;
        }
        
        @media (max-width: 480px) {
            .login-container { padding: 32px 24px; margin: 16px; }
            .logo h1 { font-size: 36px; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>🚗 AUTO-V</h1>
            <p>Africa's Leading Vehicle Intelligence Platform</p>
        </div>
        
        <div id="messageBox" class="message"></div>
        
        <div class="form-group">
            <label>📧 Email Address</label>
            <input type="email" id="email" placeholder="your@email.com" autocomplete="email">
        </div>
        
        <div class="form-group">
            <label>🔒 Password</label>
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
        </div>
        
        <button id="loginBtn">Login</button>
        
        <div class="signup-link">
            Don't have an account? <a id="signupBtn">Create Account</a>
        </div>
        
        <div class="mpesa-badge">
            💳 M-Pesa Paybill: <strong>4095377</strong> | Account: <strong>AUTO-V</strong><br>
            <span style="font-size: 10px;">Valuations: KES 2,500 | Inspections: KES 3,500</span>
        </div>
    </div>

    <script>
        (function() {
            // Check if already initialized
            if (window.autoVLoginInitialized) return;
            window.autoVLoginInitialized = true;
            
            // Supabase Configuration
            const SUPABASE_URL = "https://tsvejnzxrxrrecgquxbq.supabase.co";
            const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzdmVqbnp4cnhycmVjZ3F1eGJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExODczNjgsImV4cCI6MjA5Njc2MzM2OH0.PCEppwafuPatBoWh4OnhzgHv6fA9uF5-bWW9mmf2VoQ";
            
            // Create Supabase client
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            
            // DOM Elements
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            const signupBtn = document.getElementById('signupBtn');
            const messageBox = document.getElementById('messageBox');

            // Show message helper
            function showMessage(text, type = 'error') {
                messageBox.textContent = text;
                messageBox.className = `message ${type}-message`;
                messageBox.style.display = 'block';
                
                // Auto hide after 5 seconds
                setTimeout(() => {
                    if (messageBox.style.display === 'block') {
                        messageBox.style.display = 'none';
                    }
                }, 5000);
            }
            
            // Clear message
            function clearMessage() {
                messageBox.style.display = 'none';
            }

            // Validate email format
            function isValidEmail(email) {
                const emailRegex = /^[^\s@]+@([^\s@.,]+\.)+[^\s@.,]{2,}$/;
                return emailRegex.test(email);
            }

            // Handle Login
            async function handleLogin() {
                const email = emailInput.value.trim();
                const password = passwordInput.value;

                // Clear previous message
                clearMessage();

                // Validation
                if (!email || !password) {
                    showMessage('Please enter both email and password', 'error');
                    emailInput.focus();
                    return;
                }

                if (!isValidEmail(email)) {
                    showMessage('Please enter a valid email address', 'error');
                    emailInput.focus();
                    return;
                }

                if (password.length < 6) {
                    showMessage('Password must be at least 6 characters', 'error');
                    passwordInput.focus();
                    return;
                }

                // Disable button and show loading
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<span class="spinner"></span> Logging in...';

                try {
                    const { data, error } = await supabase.auth.signInWithPassword({ 
                        email, 
                        password 
                    });

                    if (error) {
                        console.error('Login error:', error);
                        
                        if (error.message === 'Invalid login credentials') {
                            showMessage('❌ Invalid email or password. Please try again.', 'error');
                        } else if (error.message.includes('Email not confirmed')) {
                            showMessage('📧 Please verify your email address. Check your inbox (including spam folder).', 'info');
                        } else if (error.message.includes('rate limit')) {
                            showMessage('⏳ Too many attempts. Please wait a moment and try again.', 'error');
                        } else {
                            showMessage(error.message || 'Login failed. Please try again.', 'error');
                        }
                        
                        loginBtn.disabled = false;
                        loginBtn.innerHTML = 'Login';
                    } else {
                        showMessage('✅ Login successful! Redirecting to dashboard...', 'success');
                        
                        // Store session info
                        if (data.session) {
                            localStorage.setItem('autoV_lastLogin', new Date().toISOString());
                        }
                        
                        setTimeout(() => {
                            window.location.href = "dashboard.html";
                        }, 1500);
                    }
                } catch (err) {
                    console.error('Unexpected error:', err);
                    showMessage('🌐 Network error. Please check your connection and try again.', 'error');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = 'Login';
                }
            }

            // Handle Signup with improved UX
            async function handleSignup() {
                // Create a modal-like prompt using a custom dialog
                const email = prompt('Enter your email address:');
                
                if (!email) return;
                
                if (!isValidEmail(email)) {
                    showMessage('Please enter a valid email address', 'error');
                    return;
                }
                
                const password = prompt('Create a password (minimum 6 characters):');
                
                if (!password) return;
                
                if (password.length < 6) {
                    showMessage('Password must be at least 6 characters', 'error');
                    return;
                }
                
                const confirmPassword = prompt('Confirm your password:');
                
                if (password !== confirmPassword) {
                    showMessage('Passwords do not match', 'error');
                    return;
                }
                
                const fullName = prompt('Enter your full name (optional):') || '';
                const phone = prompt('Enter your phone number (optional):') || '';

                // Disable button and show loading
                signupBtn.disabled = true;
                signupBtn.innerHTML = '<span class="spinner"></span> Creating account...';

                try {
                    const { data, error } = await supabase.auth.signUp({ 
                        email, 
                        password,
                        options: {
                            data: {
                                full_name: fullName,
                                phone: phone
                            },
                            emailRedirectTo: window.location.origin + '/dashboard.html'
                        }
                    });

                    if (error) {
                        if (error.message.includes('User already registered')) {
                            showMessage('📧 User already registered. Please login instead.', 'info');
                        } else if (error.message.includes('password')) {
                            showMessage('Password must be at least 6 characters', 'error');
                        } else {
                            showMessage(error.message || 'Signup failed. Please try again.', 'error');
                        }
                    } else if (data.user) {
                        // Create user profile
                        try {
                            await supabase.from('user_profiles').insert({
                                id: data.user.id,
                                email: email,
                                full_name: fullName,
                                phone: phone,
                                created_at: new Date().toISOString()
                            });
                        } catch (profileErr) {
                            console.log('Profile creation skipped or already exists');
                        }
                        
                        showMessage('✅ Account created successfully! Please check your email to verify your account before logging in.', 'success');
                        
                        // Pre-fill email field
                        emailInput.value = email;
                    } else {
                        showMessage('Signup successful! Please check your email to verify your account.', 'success');
                    }
                } catch (err) {
                    console.error('Signup error:', err);
                    showMessage('Network error. Please try again.', 'error');
                } finally {
                    signupBtn.disabled = false;
                    signupBtn.innerHTML = 'Create Account';
                }
            }

            // Handle Enter key press
            function handleEnterPress(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleLogin();
                }
            }

            // Check if already logged in
            async function checkSession() {
                try {
                    const { data: { session }, error } = await supabase.auth.getSession();
                    
                    if (error) {
                        console.error('Session check error:', error);
                        return;
                    }
                    
                    if (session) {
                        console.log('Active session found, redirecting to dashboard');
                        // Optional: Add a small delay to show message
                        showMessage('Already logged in! Redirecting...', 'success');
                        setTimeout(() => {
                            window.location.href = "dashboard.html";
                        }, 1000);
                    } else {
                        console.log('No active session, staying on login page');
                    }
                } catch (err) {
                    console.error('Session check error:', err);
                }
            }

            // Event listeners
            loginBtn.addEventListener('click', handleLogin);
            signupBtn.addEventListener('click', handleSignup);
            
            // Enter key support
            emailInput.addEventListener('keypress', handleEnterPress);
            passwordInput.addEventListener('keypress', handleEnterPress);
            
            // Clear message on input
            emailInput.addEventListener('input', clearMessage);
            passwordInput.addEventListener('input', clearMessage);
            
            // Focus on email input on load
            emailInput.focus();

            // Check existing session on page load
            checkSession();
        })();
    </script>
</body>
</html>
