<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>AUTO-V | Login - Vehicle Intelligence Platform</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23eab308' rx='20'/%3E%3Ctext x='50' y='72' font-size='60' text-anchor='middle' fill='%23000'%3E🚗%3C/text%3E%3C/svg%3E">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0a0c15 0%, #0f172a 50%, #1e1b4b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(234,179,8,0.08) 0%, transparent 70%);
            animation: rotate 40s linear infinite;
            pointer-events: none;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .login-container {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 48px 40px;
            width: 100%;
            max-width: 460px;
            border: 1px solid rgba(234, 179, 8, 0.3);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 1;
            transition: all 0.3s ease;
        }
        
        .logo { text-align: center; margin-bottom: 32px; }
        .logo h1 {
            font-size: 48px;
            background: linear-gradient(135deg, #eab308, #facc15);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 800;
        }
        .logo p {
            color: #94a3b8;
            font-size: 14px;
            margin-top: 8px;
        }
        
        .form-group { margin-bottom: 24px; }
        label { 
            display: block; 
            margin-bottom: 8px; 
            color: #cbd5e1; 
            font-weight: 600; 
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input {
            width: 100%;
            padding: 14px 18px;
            background: #0a0f1c;
            border: 2px solid #2d3a4e;
            border-radius: 16px;
            color: white;
            font-size: 15px;
            transition: all 0.3s;
            font-family: inherit;
        }
        input:focus {
            outline: none;
            border-color: #eab308;
            box-shadow: 0 0 0 4px rgba(234, 179, 8, 0.15);
        }
        input::placeholder {
            color: #475569;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #eab308, #facc15);
            color: #0a0c15;
            border: none;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 16px;
            font-family: inherit;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(234, 179, 8, 0.3);
        }
        button:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .message {
            padding: 14px 18px;
            border-radius: 16px;
            margin-bottom: 24px;
            display: none;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            animation: slideDown 0.3s ease;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .error-message { 
            background: #7f1d1d; 
            color: #fecaca; 
            border-left: 4px solid #ef4444;
        }
        .success-message { 
            background: #14532d; 
            color: #bbf7d0; 
            border-left: 4px solid #22c55e;
        }
        .info-message { 
            background: #1e293b; 
            color: #eab308; 
            border-left: 4px solid #eab308;
        }
        
        .signup-link { 
            text-align: center; 
            margin-top: 28px; 
            color: #94a3b8; 
            font-size: 14px; 
        }
        .signup-link a { 
            color: #eab308; 
            cursor: pointer; 
            text-decoration: none; 
            font-weight: 700;
            transition: all 0.2s;
        }
        .signup-link a:hover { 
            text-decoration: underline;
            color: #facc15;
        }
        
        .mpesa-badge {
            text-align: center;
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid #1e293b;
            font-size: 11px;
            color: #64748b;
        }
        .mpesa-badge strong {
            color: #22c55e;
            font-size: 13px;
        }
        
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid #fff;
            border-radius: 50%;
            border-top-color: #eab308;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 480px) {
            .login-container { padding: 32px 24px; margin: 16px; }
            .logo h1 { font-size: 36px; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>🚗 AUTO-V</h1>
            <p>Africa's Leading Vehicle Intelligence Platform</p>
        </div>
        
        <div id="messageBox" class="message"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label>📧 Email Address</label>
                <input type="email" id="email" placeholder="your@email.com" autocomplete="email" required>
            </div>
            
            <div class="form-group">
                <label>🔒 Password</label>
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
            </div>
            
            <button type="submit" id="loginBtn">Login</button>
        </form>
        
        <div class="signup-link">
            Don't have an account? <a id="signupBtn">Create Account</a>
        </div>
        
        <div class="mpesa-badge">
            💳 M-Pesa Paybill: <strong>4095377</strong> | Account: <strong>AUTO-V</strong><br>
            <span style="font-size: 10px;">Valuations: KES 2,500 | Inspections: KES 3,500</span>
        </div>
    </div>

    <!-- Signup Modal (Hidden by default) -->
    <div id="signupModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center;">
        <div style="background: #0f172a; border-radius: 24px; padding: 32px; max-width: 400px; width: 90%; border: 2px solid #eab308;">
            <h2 style="color: #eab308; margin-bottom: 20px;">📝 Create Account</h2>
            <form id="signupForm">
                <div class="form-group"><label>Email</label><input type="email" id="signupEmail" autocomplete="email" required></div>
                <div class="form-group"><label>Password (min 6 chars)</label><input type="password" id="signupPassword" autocomplete="new-password" required></div>
                <div class="form-group"><label>Confirm Password</label><input type="password" id="signupConfirmPassword" autocomplete="new-password" required></div>
                <div class="form-group"><label>Full Name</label><input type="text" id="signupName" autocomplete="name"></div>
                <div class="form-group"><label>Phone</label><input type="tel" id="signupPhone" autocomplete="tel"></div>
                <button type="submit" style="width:100%; margin-top:10px;">Sign Up</button>
                <button type="button" id="closeSignupBtn" style="background: #334155; margin-top:10px;">Cancel</button>
            </form>
        </div>
    </div>

    <script>
        // ============================================
        // LOGIN PAGE - REDIRECTS TO DASHBOARD
        // ============================================
        (function() {
            if (window.autoVLoginInitialized) return;
            window.autoVLoginInitialized = true;
            
            const SUPABASE_URL = "https://tsvejnzxrxrrecgquxbq.supabase.co";
            const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzdmVqbnp4cnhycmVjZ3F1eGJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExODczNjgsImV4cCI6MjA5Njc2MzM2OH0.PCEppwafuPatBoWh4OnhzgHv6fA9uF5-bWW9mmf2VoQ";
            
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            const signupBtn = document.getElementById('signupBtn');
            const messageBox = document.getElementById('messageBox');
            const signupModal = document.getElementById('signupModal');
            
            function showMessage(text, type = 'error') {
                messageBox.textContent = text;
                messageBox.className = `message ${type}-message`;
                messageBox.style.display = 'block';
                setTimeout(() => {
                    messageBox.style.display = 'none';
                }, 5000);
            }
            
            function clearMessage() {
                messageBox.style.display = 'none';
            }
            
            function isValidEmail(email) {
                const emailRegex = /^[^\s@]+@([^\s@.,]+\.)+[^\s@.,]{2,}$/;
                return emailRegex.test(email);
            }
            
            // ============================================
            // LOGIN HANDLER - Redirects to Dashboard
            // ============================================
            async function handleLogin(e) {
                e.preventDefault();
                const email = emailInput.value.trim();
                const password = passwordInput.value;
                
                clearMessage();
                
                if (!email || !password) {
                    showMessage('Please enter both email and password', 'error');
                    emailInput.focus();
                    return;
                }
                
                if (!isValidEmail(email)) {
                    showMessage('Please enter a valid email address', 'error');
                    emailInput.focus();
                    return;
                }
                
                if (password.length < 6) {
                    showMessage('Password must be at least 6 characters', 'error');
                    passwordInput.focus();
                    return;
                }
                
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<span class="spinner"></span> Logging in...';
                
                try {
                    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                    
                    if (error) {
                        console.error('Login error:', error);
                        if (error.message === 'Invalid login credentials') {
                            showMessage('❌ Invalid email or password. Please try again.', 'error');
                        } else if (error.message.includes('Email not confirmed')) {
                            showMessage('📧 Please verify your email address. Check your inbox (including spam folder).', 'info');
                        } else {
                            showMessage(error.message || 'Login failed. Please try again.', 'error');
                        }
                        loginBtn.disabled = false;
                        loginBtn.innerHTML = 'Login';
                    } else {
                        // Store user info
                        localStorage.setItem('autoV_user', JSON.stringify({
                            id: data.user.id,
                            email: data.user.email
                        }));
                        
                        showMessage('✅ Login successful! Redirecting to dashboard...', 'success');
                        
                        // REDIRECT TO DASHBOARD
                        setTimeout(() => {
                            window.location.href = "dashboard.html";
                        }, 1500);
                    }
                } catch (err) {
                    console.error('Unexpected error:', err);
                    showMessage('🌐 Network error. Please check your connection and try again.', 'error');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = 'Login';
                }
            }
            
            // ============================================
            // SIGNUP HANDLER
            // ============================================
            async function handleSignup(e) {
                e.preventDefault();
                const email = document.getElementById('signupEmail').value.trim();
                const password = document.getElementById('signupPassword').value;
                const confirmPassword = document.getElementById('signupConfirmPassword').value;
                const name = document.getElementById('signupName').value;
                const phone = document.getElementById('signupPhone').value;
                
                if (!email || !password) {
                    showMessage('Please enter email and password', 'error');
                    return;
                }
                
                if (!isValidEmail(email)) {
                    showMessage('Please enter a valid email address', 'error');
                    return;
                }
                
                if (password.length < 6) {
                    showMessage('Password must be at least 6 characters', 'error');
                    return;
                }
                
                if (password !== confirmPassword) {
                    showMessage('Passwords do not match', 'error');
                    return;
                }
                
                const signupSubmitBtn = document.querySelector('#signupForm button[type="submit"]');
                const originalText = signupSubmitBtn.innerHTML;
                signupSubmitBtn.disabled = true;
                signupSubmitBtn.innerHTML = '<span class="spinner"></span> Creating account...';
                
                try {
                    const { data, error } = await supabase.auth.signUp({ 
                        email, 
                        password,
                        options: {
                            data: { full_name: name, phone: phone }
                        }
                    });
                    
                    if (error) {
                        if (error.message.includes('User already registered')) {
                            showMessage('📧 User already registered. Please login instead.', 'info');
                        } else {
                            showMessage(error.message || 'Signup failed. Please try again.', 'error');
                        }
                    } else if (data.user) {
                        // Create user profile
                        try {
                            await supabase.from('user_profiles').upsert({
                                id: data.user.id,
                                email: email,
                                full_name: name,
                                phone: phone,
                                created_at: new Date().toISOString()
                            });
                        } catch (profileErr) {
                            console.log('Profile creation skipped or already exists');
                        }
                        
                        showMessage('✅ Account created successfully! Please check your email to verify.', 'success');
                        signupModal.style.display = 'none';
                        emailInput.value = email;
                        
                        // Reset signup form
                        document.getElementById('signupEmail').value = '';
                        document.getElementById('signupPassword').value = '';
                        document.getElementById('signupConfirmPassword').value = '';
                        document.getElementById('signupName').value = '';
                        document.getElementById('signupPhone').value = '';
                    }
                } catch (err) {
                    console.error('Signup error:', err);
                    showMessage('Network error. Please try again.', 'error');
                } finally {
                    signupSubmitBtn.disabled = false;
                    signupSubmitBtn.innerHTML = originalText;
                }
            }
            
            // Check if already logged in
            async function checkSession() {
                try {
                    const { data: { session }, error } = await supabase.auth.getSession();
                    
                    if (error) {
                        console.error('Session check error:', error);
                        return;
                    }
                    
                    if (session) {
                        console.log('Active session found, redirecting to dashboard');
                        showMessage('Already logged in! Redirecting...', 'success');
                        setTimeout(() => {
                            window.location.href = "dashboard.html";
                        }, 1000);
                    }
                } catch (err) {
                    console.error('Session check error:', err);
                }
            }
            
            // Event listeners
            document.getElementById('loginForm').addEventListener('submit', handleLogin);
            document.getElementById('signupForm').addEventListener('submit', handleSignup);
            
            signupBtn.addEventListener('click', () => {
                signupModal.style.display = 'flex';
            });
            
            document.getElementById('closeSignupBtn').addEventListener('click', () => {
                signupModal.style.display = 'none';
            });
            
            // Close modal when clicking outside
            signupModal.addEventListener('click', (e) => {
                if (e.target === signupModal) {
                    signupModal.style.display = 'none';
                }
            });
            
            // Enter key support
            emailInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleLogin(e); });
            passwordInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleLogin(e); });
            
            // Clear message on input
            emailInput.addEventListener('input', clearMessage);
            passwordInput.addEventListener('input', clearMessage);
            
            // Focus on email input on load
            emailInput.focus();
            
            // Check existing session on page load
            checkSession();
        })();
    </script>
</body>
</html>
