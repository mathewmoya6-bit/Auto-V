<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>AUTO-V | Payment</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23eab308' rx='20'/%3E%3Ctext x='50' y='72' font-size='60' text-anchor='middle' fill='%23000'%3E🚗%3C/text%3E%3C/svg%3E">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #0a0c15;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .payment-container {
            background: #0f172a;
            border-radius: 32px;
            padding: 48px 40px;
            max-width: 500px;
            width: 100%;
            border: 1px solid rgba(234, 179, 8, 0.3);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .logo { text-align: center; margin-bottom: 32px; }
        .logo h1 {
            font-size: 36px;
            background: linear-gradient(135deg, #eab308, #facc15);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 800;
        }
        .logo p { color: #94a3b8; font-size: 14px; }
        h2 { color: #eab308; margin-bottom: 24px; font-size: 20px; border-left: 4px solid #eab308; padding-left: 15px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #94a3b8; font-size: 13px; font-weight: 600; }
        label.required:after { content: " *"; color: #ef4444; }
        input {
            width: 100%;
            padding: 14px 18px;
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 12px;
            color: white;
            font-size: 15px;
            transition: all 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #eab308;
            box-shadow: 0 0 0 4px rgba(234, 179, 8, 0.15);
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-success {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #fff;
        }
        .btn-success:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -5px rgba(34, 197, 94, 0.3); }
        .btn-secondary {
            background: #334155;
            color: #fff;
            margin-top: 10px;
        }
        .btn-secondary:hover { background: #475569; }
        .btn:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
        }
        .payment-summary {
            background: #1e293b;
            border-radius: 16px;
            padding: 20px;
            margin: 24px 0;
        }
        .payment-summary .row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #2d3a4e;
        }
        .payment-summary .row:last-child { border-bottom: none; }
        .payment-summary .label { color: #94a3b8; }
        .payment-summary .value { font-weight: 700; color: #eab308; }
        .payment-summary .amount { font-size: 28px; color: #22c55e; }
        .mpesa-info {
            background: #1e293b;
            border-radius: 12px;
            padding: 15px;
            margin: 20px 0;
            text-align: center;
        }
        .mpesa-info strong { color: #eab308; }
        .error, .success {
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 15px;
            display: none;
        }
        .error { background: #7f1d1d; color: #fecaca; border-left: 4px solid #ef4444; }
        .success { background: #14532d; color: #bbf7d0; border-left: 4px solid #22c55e; }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #fff;
            border-radius: 50%;
            border-top-color: #eab308;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .back-link { text-align: center; margin-top: 20px; }
        .back-link a { color: #eab308; text-decoration: none; font-size: 14px; }
        .back-link a:hover { text-decoration: underline; }
        @media (max-width: 480px) {
            .payment-container { padding: 32px 24px; }
        }
    </style>
</head>
<body>
    <div class="payment-container">
        <div class="logo">
            <h1>🚗 AUTO-V</h1>
            <p>Secure Payment</p>
        </div>

        <div id="errorMsg" class="error"></div>
        <div id="successMsg" class="success"></div>

        <h2>💳 Complete Payment</h2>

        <div class="payment-summary">
            <div class="row"><span class="label">Service</span><span class="value" id="summaryService">-</span></div>
            <div class="row"><span class="label">Purpose</span><span class="value" id="summaryPurpose">-</span></div>
            <div class="row"><span class="label">Customer</span><span class="value" id="summaryCustomer">-</span></div>
            <div class="row" style="border-bottom: none; padding-top:15px;">
                <span class="label">Total Amount</span>
                <span class="amount" id="summaryAmount">KES 0</span>
            </div>
        </div>

        <div class="mpesa-info">
            💳 M-Pesa Paybill: <strong>4095377</strong> | Account: <strong>AUTO-V</strong>
        </div>

        <form id="paymentForm">
            <div class="form-group">
                <label class="required">M-Pesa Phone Number</label>
                <input type="tel" id="mpesaPhone" placeholder="0712345678" autocomplete="tel" required>
            </div>
            <button type="submit" class="btn btn-success" id="payBtn">💳 Pay Now</button>
        </form>

        <button type="button" class="btn btn-secondary" id="backBtn">← Back to Purpose</button>

        <div class="back-link">
            <a href="dashboard.html">← Back to Dashboard</a>
        </div>
    </div>

    <script>
        (function() {
            const SUPABASE_URL = "https://tsvejnzxrxrrecgquxbq.supabase.co";
            const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzdmVqbnp4cnhycmVjZ3F1eGJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExODczNjgsImV4cCI6MjA5Njc2MzM2OH0.PCEppwafuPatBoWh4OnhzgHv6fA9uF5-bWW9mmf2VoQ";
            
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            // Get order data from URL params
            const urlParams = new URLSearchParams(window.location.search);
            const service = urlParams.get('service');
            const purpose = urlParams.get('purpose');
            const customerName = urlParams.get('customer') || 'Customer';
            const amount = urlParams.get('amount') || '0';

            // Display order summary
            document.getElementById('summaryService').textContent = service === 'valuation' ? 'Valuation' : 'Inspection';
            document.getElementById('summaryPurpose').textContent = purpose || 'Not specified';
            document.getElementById('summaryCustomer').textContent = customerName;
            document.getElementById('summaryAmount').textContent = `KES ${parseInt(amount).toLocaleString()}`;

            function showMessage(msg, type = 'success') {
                const errorDiv = document.getElementById('errorMsg');
                const successDiv = document.getElementById('successMsg');
                errorDiv.style.display = 'none';
                successDiv.style.display = 'none';
                if (type === 'error') {
                    errorDiv.textContent = msg;
                    errorDiv.style.display = 'block';
                    setTimeout(() => errorDiv.style.display = 'none', 5000);
                } else {
                    successDiv.textContent = msg;
                    successDiv.style.display = 'block';
                    setTimeout(() => successDiv.style.display = 'none', 3000);
                }
            }

            // Payment Handler
            async function processPayment(e) {
                e.preventDefault();
                const mpesaPhone = document.getElementById('mpesaPhone').value;
                
                if (!mpesaPhone || mpesaPhone.length < 10) {
                    showMessage('Please enter a valid M-Pesa phone number', 'error');
                    return;
                }

                const payBtn = document.getElementById('payBtn');
                const originalText = payBtn.innerHTML;
                payBtn.disabled = true;
                payBtn.innerHTML = '<span class="spinner"></span> Processing Payment...';

                try {
                    // Simulate M-Pesa STK Push
                    await new Promise(resolve => setTimeout(resolve, 2500));

                    showMessage('✅ Payment successful! Redirecting to valuation engine...', 'success');

                    // Redirect to valuation engine with data
                    setTimeout(() => {
                        window.location.href = `valuation-engine.html?service=${service}&purpose=${purpose}&amount=${amount}&customer=${encodeURIComponent(customerName)}`;
                    }, 1500);

                } catch (err) {
                    showMessage('Payment failed. Please try again.', 'error');
                    payBtn.disabled = false;
                    payBtn.innerHTML = originalText;
                }
            }

            // Back button
            document.getElementById('backBtn').addEventListener('click', () => {
                window.location.href = `pages/customer-portal.html?step=4`;
            });

            document.getElementById('paymentForm').addEventListener('submit', processPayment);

            // Check if user is logged in
            async function checkAuth() {
                const { data: { user } } = await supabase.auth.getUser();
                if (!user) {
                    window.location.href = "login.html";
                }
            }
            checkAuth();
        })();
    </script>
</body>
</html>
