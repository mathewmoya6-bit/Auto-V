<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTO-V | Vehicle Marketplace</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="supabase.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:#0a0c15; color:#fff; }
        .header { background:#0f172a; border-bottom:2px solid #eab308; padding:16px 24px; display:flex; justify-content:space-between; align-items:center; }
        .logo { font-size:24px; font-weight:bold; color:#eab308; }
        .container { max-width:1400px; margin:0 auto; padding:24px; }
        .marketplace-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:24px; }
        .vehicle-card { background:#0f172a; border-radius:16px; padding:24px; border:1px solid #1e293b; transition:all 0.3s; }
        .vehicle-card:hover { border-color:#eab308; transform:translateY(-4px); }
        .vehicle-price { font-size:28px; font-weight:800; color:#22c55e; margin:12px 0; }
        .vehicle-score { display:inline-block; background:#1e293b; padding:4px 12px; border-radius:12px; font-size:12px; }
        .btn { background:#eab308; color:#000; padding:8px 20px; border:none; border-radius:40px; cursor:pointer; font-weight:bold; }
        .btn:hover { background:#facc15; }
        .badge-verified { background:#22c55e; color:#000; padding:2px 10px; border-radius:12px; font-size:10px; font-weight:bold; }
    </style>
</head>
<body>
    <div class="header"><div class="logo">🏪 AUTO-V Marketplace</div></div>
    <div class="container">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; flex-wrap:wrap; gap:16px;">
            <h2 style="color:#eab308;">Verified Vehicles</h2>
            <span style="color:#94a3b8;"> vehicles available</span>
        </div>
        <div class="marketplace-grid" id="marketplaceGrid"></div>
    </div>
    <script>
        (async function() {
            const { data: vehicles } = await autoV.supabase
                .from('vehicles')
                .select('*')
                .limit(20);
            
            const grid = document.getElementById('marketplaceGrid');
            if (!vehicles || vehicles.length === 0) {
                grid.innerHTML = '<div style="text-align:center;padding:60px;color:#64748b;">No vehicles listed yet</div>';
                return;
            }
            
            grid.innerHTML = vehicles.map(v => 
                <div class="vehicle-card">
                    <div style="display:flex; justify-content:space-between; align-items:start;">
                        <span style="font-size:24px;">🚗</span>
                        <span class="badge-verified">✓ Verified</span>
                    </div>
                    <h3 style="margin:12px 0 4px 0;"> </h3>
                    <div style="color:#94a3b8; font-size:14px;"> •  km</div>
                    <div class="vehicle-price">KES </div>
                    <div style="display:flex; gap:8px; margin:12px 0;">
                        <span class="vehicle-score">⭐ AUTO-V Score: %</span>
                        <span class="vehicle-score"></span>
                    </div>
                    <button class="btn" onclick="alert('View details for ')">View Details →</button>
                </div>
            ).join('');
        })();
    </script>
</body>
</html>
