<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>AUTO-V | Secure Payment</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23eab308' rx='20'/%3E%3Ctext x='50' y='72' font-size='60' text-anchor='middle' fill='%23000'%3E🚗%3C/text%3E%3C/svg%3E">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #0a0c15;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .payment-container {
            background: #0f172a;
            border-radius: 32px;
            padding: 48px 40px;
            max-width: 520px;
            width: 100%;
            border: 1px solid rgba(234, 179, 8, 0.25);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            transition: all 0.3s;
        }
        .payment-container:hover { border-color: rgba(234, 179, 8, 0.4); }
        .logo { text-align: center; margin-bottom: 32px; }
        .logo h1 {
            font-size: 36px;
            background: linear-gradient(135deg, #eab308, #facc15);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .logo p { color: #94a3b8; font-size: 14px; margin-top: 4px; }
        h2 {
            color: #eab308;
            margin-bottom: 24px;
            font-size: 20px;
            border-left: 4px solid #eab308;
            padding-left: 15px;
        }
        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            margin-bottom: 8px;
            color: #94a3b8;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        label.required:after { content: " *"; color: #ef4444; }
        input {
            width: 100%;
            padding: 14px 18px;
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #eab308;
            box-shadow: 0 0 0 4px rgba(234, 179, 8, 0.15);
        }
        input::placeholder { color: #64748b; }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-success {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #fff;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.2);
        }
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(34, 197, 94, 0.4);
        }
        .btn-success:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn-secondary {
            background: #334155;
            color: #fff;
            margin-top: 12px;
        }
        .btn-secondary:hover { background: #475569; transform: translateY(-1px); }
        .payment-summary {
            background: #1e293b;
            border-radius: 16px;
            padding: 20px;
            margin: 24px 0;
        }
        .payment-summary .row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #2d3a4e;
        }
        .payment-summary .row:last-child {
            border-bottom: none;
            padding-top: 14px;
            margin-top: 4px;
        }
        .payment-summary .label { color: #94a3b8; font-size: 13px; }
        .payment-summary .value { font-weight: 600; color: #eab308; text-align: right; max-width: 60%; word-break: break-word; }
        .payment-summary .amount { font-size: 28px; color: #22c55e; font-weight: 800; }
        .mpesa-info {
            background: #1e293b;
            border-radius: 12px;
            padding: 16px;
            margin: 20px 0;
            text-align: center;
            border: 1px dashed #334155;
        }
        .mpesa-info strong { color: #eab308; }
        .mpesa-info .paybill { font-size: 22px; font-weight: 800; color: #22c55e; }
        .error, .success {
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 15px;
            display: none;
            font-weight: 500;
        }
        .error { background: #7f1d1d; color: #fecaca; border-left: 4px solid #ef4444; }
        .success { background: #14532d; color: #bbf7d0; border-left: 4px solid #22c55e; }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #fff;
            border-radius: 50%;
            border-top-color: #eab308;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .back-link {
            text-align: center;
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .back-link a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 13px;
            transition: color 0.2s;
        }
        .back-link a:hover { color: #eab308; }
        .secure-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: #22c55e;
            font-size: 12px;
            margin-top: 16px;
        }
        .engine-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
            background: #eab308;
            color: #000;
        }
        @media (max-width: 480px) {
            .payment-container { padding: 32px 20px; }
            .payment-summary .row { flex-wrap: wrap; gap: 4px; }
            .payment-summary .value { max-width: 100%; text-align: left; }
        }
    </style>
</head>
<body>
    <div class="payment-container">
        <div class="logo">
            <h1>🚗 AUTO-V</h1>
            <p>Secure Payment Gateway</p>
        </div>

        <div id="errorMsg" class="error"></div>
        <div id="successMsg" class="success"></div>

        <h2>💳 Complete Payment</h2>

        <div class="payment-summary">
            <div class="row">
                <span class="label">Service</span>
                <span class="value" id="summaryService">-</span>
            </div>
            <div class="row">
                <span class="label">Purpose</span>
                <span class="value" id="summaryPurpose">-</span>
            </div>
            <div class="row">
                <span class="label">Customer</span>
                <span class="value" id="summaryCustomer">-</span>
            </div>
            <div class="row" style="border-bottom: none; padding-top: 14px; margin-top: 4px;">
                <span class="label" style="font-weight: 600;">Total Amount</span>
                <span class="amount" id="summaryAmount">KES 0</span>
            </div>
        </div>

        <div class="mpesa-info">
            <div style="font-size:13px; color:#94a3b8;">💳 Pay via M-Pesa</div>
            <div style="margin-top:6px;">
                <span style="font-size:13px; color:#94a3b8;">Paybill:</span>
                <span class="paybill">4095377</span>
            </div>
            <div style="font-size:13px; color:#94a3b8; margin-top:4px;">
                Account: <strong>AUTO-V</strong>
            </div>
        </div>

        <form id="paymentForm">
            <div class="form-group">
                <label class="required">M-Pesa Phone Number</label>
                <input type="tel" id="mpesaPhone" placeholder="0712345678" autocomplete="tel" required>
                <div style="font-size:11px; color:#64748b; margin-top:6px;">Enter the phone number registered with M-Pesa</div>
            </div>
            <button type="submit" class="btn btn-success" id="payBtn">
                💳 Pay Now
            </button>
        </form>

        <div class="back-link">
            <a href="#" id="backBtn">← Back to Service Selection</a>
            <a href="dashboard.html">📊 Dashboard</a>
        </div>

        <div class="secure-badge">
            <span>🔒</span> Secured by Supabase &amp; M-Pesa
        </div>
    </div>

    <script>
        // ============================================================
        // AUTO-V SECURE PAYMENT – Redirects to Engine with Parameters
        // ============================================================
        (function() {
            const SUPABASE_URL = "https://tsvejnzxrxrrecgquxbq.supabase.co";
            const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzdmVqbnp4cnhycmVjZ3F1eGJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExODczNjgsImV4cCI6MjA5Njc2MzM2OH0.PCEppwafuPatBoWh4OnhzgHv6fA9uF5-bWW9mmf2VoQ";
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            // ─── Get URL Parameters ──────────────────────────────
            const urlParams = new URLSearchParams(window.location.search);
            const service = urlParams.get('service') || 'valuation';
            const purpose = urlParams.get('purpose') || 'Market Value';
            const amount = parseInt(urlParams.get('amount')) || 2500;
            const customer = decodeURIComponent(urlParams.get('customer') || 'Customer');
            const email = decodeURIComponent(urlParams.get('email') || '');
            const phone = decodeURIComponent(urlParams.get('phone') || '');
            const ref = urlParams.get('ref') || '';

            // ─── Engine Page Mapping ──────────────────────────────
            const engineMap = {
                'valuation': 'valuation.html',
                'inspection': 'inspection.html',
                'mileage': 'mileage.html'
            };
            const enginePage = engineMap[service] || 'valuation.html';

            // ─── Service Labels ────────────────────────────────────
            const serviceLabels = {
                'valuation': '💰 Vehicle Valuation',
                'inspection': '🔍 Vehicle Inspection',
                'mileage': '📊 Mileage Claim'
            };

            // ─── Display Summary ──────────────────────────────────
            document.getElementById('summaryService').textContent = serviceLabels[service] || service;
            document.getElementById('summaryPurpose').textContent = purpose;
            document.getElementById('summaryCustomer').textContent = customer;
            document.getElementById('summaryAmount').textContent = `KES ${amount.toLocaleString()}`;

            // ─── Helpers ──────────────────────────────────────────
            function showMessage(msg, type = 'success') {
                const errorDiv = document.getElementById('errorMsg');
                const successDiv = document.getElementById('successMsg');
                errorDiv.style.display = 'none';
                successDiv.style.display = 'none';
                const el = type === 'error' ? errorDiv : successDiv;
                el.textContent = msg;
                el.style.display = 'block';
                setTimeout(() => el.style.display = 'none', 5000);
            }

            function showLoading(show) {
                const btn = document.getElementById('payBtn');
                if (show) {
                    btn.disabled = true;
                    btn.innerHTML = '<span class="spinner"></span> Processing Payment...';
                } else {
                    btn.disabled = false;
                    btn.innerHTML = '💳 Pay Now';
                }
            }

            // ─── Build Redirect URL ───────────────────────────────
            function buildEngineUrl() {
                const params = new URLSearchParams();
                params.set('service', service);
                params.set('purpose', purpose);
                params.set('amount', amount);
                params.set('customer', customer);
                if (email) params.set('email', email);
                if (phone) params.set('phone', phone);
                if (ref) params.set('ref', ref);
                return `${enginePage}?${params.toString()}`;
            }

            // ─── Save Payment Record ──────────────────────────────
            async function savePayment(userId) {
                const { data, error } = await supabase.from('payments').insert({
                    user_id: userId,
                    service_type: service,
                    amount: amount,
                    payment_method: 'mpesa',
                    status: 'pending',
                    reference: ref || `PAY-${Date.now()}`,
                    created_at: new Date().toISOString()
                }).select().single();
                if (error) throw error;
                return data;
            }

            // ─── Payment Handler ──────────────────────────────────
            async function processPayment(e) {
                e.preventDefault();

                const mpesaPhone = document.getElementById('mpesaPhone').value.trim();
                if (!mpesaPhone || mpesaPhone.length < 10) {
                    showMessage('Please enter a valid M-Pesa phone number (e.g., 0712345678)', 'error');
                    return;
                }

                showLoading(true);

                try {
                    // 1. Verify user is logged in
                    const { data: { user } } = await supabase.auth.getUser();
                    if (!user) {
                        showMessage('Please log in first. Redirecting...', 'error');
                        setTimeout(() => window.location.href = 'login.html', 1500);
                        showLoading(false);
                        return;
                    }

                    // 2. Save payment record
                    const payment = await savePayment(user.id);

                    // 3. Simulate M-Pesa STK Push (in production, call your backend API)
                    await new Promise(resolve => setTimeout(resolve, 2000));

                    // 4. Update payment status to completed
                    await supabase.from('payments')
                        .update({ status: 'completed', completed_at: new Date().toISOString() })
                        .eq('id', payment.id);

                    // 5. Show success and redirect
                    showMessage('✅ Payment successful! Redirecting to engine...', 'success');

                    const redirectUrl = buildEngineUrl();
                    console.log('🚀 Redirecting to:', redirectUrl);

                    setTimeout(() => {
                        window.location.href = redirectUrl;
                    }, 1500);

                } catch (error) {
                    console.error('Payment error:', error);
                    showMessage('Payment failed: ' + error.message, 'error');
                    showLoading(false);
                }
            }

            // ─── Back Button ──────────────────────────────────────
            document.getElementById('backBtn').addEventListener('click', function(e) {
                e.preventDefault();
                // Determine where to go back based on service
                if (service === 'valuation') window.location.href = 'pages/customer-portal.html?step=3';
                else if (service === 'inspection') window.location.href = 'inspection.html';
                else if (service === 'mileage') window.location.href = 'mileage.html';
                else window.location.href = 'dashboard.html';
            });

            // ─── Form Submit ──────────────────────────────────────
            document.getElementById('paymentForm').addEventListener('submit', processPayment);

            // ─── Auth Check ──────────────────────────────────────
            async function checkAuth() {
                const { data: { user } } = await supabase.auth.getUser();
                if (!user) {
                    // Redirect to login with return URL
                    const returnUrl = encodeURIComponent(window.location.pathname + window.location.search);
                    window.location.href = `login.html?redirect=${returnUrl}`;
                }
            }
            checkAuth();

            // ─── Enter key support ──────────────────────────────
            document.getElementById('mpesaPhone').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    document.getElementById('paymentForm').dispatchEvent(new Event('submit'));
                }
            });
        })();
    </script>
</body>
</html>
