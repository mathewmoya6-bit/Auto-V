<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTO-V | Customer Portal</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23eab308' rx='20'/%3E%3Ctext x='50' y='72' font-size='60' text-anchor='middle' fill='%23000'%3E🚗%3C/text%3E%3C/svg%3E">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="supabase.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #0b1120; color: white; min-height: 100vh; }
        header { display: flex; justify-content: space-between; padding: 15px 30px; background: #111827; border-bottom: 2px solid #eab308; }
        .logo { font-size: 24px; color: #eab308; font-weight: bold; }
        .container { max-width: 800px; margin: auto; padding: 24px; }
        .card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
        .step { display: none; animation: fadeIn 0.3s ease; }
        .step.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .progress-bar { display: flex; margin-bottom: 20px; background: #1e293b; border-radius: 40px; padding: 5px; }
        .progress-step { flex: 1; text-align: center; padding: 10px; border-radius: 40px; color: #94a3b8; font-size: 12px; font-weight: 600; }
        .progress-step.active { background: #eab308; color: #000; }
        .progress-step.completed { background: #22c55e; color: #000; }
        .form-group { margin-bottom: 15px; }
        label { display: block; color: #94a3b8; margin-bottom: 5px; font-weight: 600; }
        input, select { width: 100%; padding: 12px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: white; }
        input:focus { border-color: #eab308; outline: none; }
        .btn { padding: 12px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        .btn-primary { background: #eab308; color: black; }
        .btn-secondary { background: #475569; color: white; }
        .btn-success { background: #22c55e; color: white; }
        .btn-success:disabled { background: #555; cursor: not-allowed; }
        .nav-buttons { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; }
        .status-box { padding: 15px; border-radius: 8px; margin-bottom: 15px; display: none; }
        .status-success { background: #14532d; color: #bbf7d0; border-left: 4px solid #22c55e; }
        .status-error { background: #7f1d1d; color: #fecaca; border-left: 4px solid #ef4444; }
        .service-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .service-card { background: #1e293b; padding: 15px; border-radius: 8px; text-align: center; cursor: pointer; border: 2px solid transparent; transition: 0.3s; }
        .service-card:hover, .service-card.selected { border-color: #eab308; background: #2d3a4e; }
        .service-icon { font-size: 36px; display: block; margin-bottom: 5px; }
        .purpose-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
        .purpose-item { padding: 10px; background: #0f172a; border-radius: 8px; cursor: pointer; text-align: center; transition: 0.2s; }
        .purpose-item:hover, .purpose-item.selected { background: #eab308; color: #000; }
        .payment-summary { background: #1e293b; border-radius: 12px; padding: 15px; margin: 15px 0; }
        .payment-summary .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #2d3a4e; }
        .payment-summary .row:last-child { border-bottom: none; }
        .result-box { background: #1e293b; padding: 20px; border-radius: 12px; margin-top: 20px; display: none; }
        .result-value { font-size: 32px; color: #22c55e; font-weight: bold; text-align: center; }
        .logout-btn { background: #dc2626; color: white; padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <div class="logo">🚗 AUTO-V Portal</div>
        <button class="logout-btn" onclick="window.autoV.logout()">Logout</button>
    </header>

    <div class="container">
        <div class="progress-bar">
            <div class="progress-step active" id="step1Prog">1. Client</div>
            <div class="progress-step" id="step2Prog">2. Service</div>
            <div class="progress-step" id="step3Prog">3. Purpose</div>
            <div class="progress-step" id="step4Prog">4. Payment</div>
        </div>

        <!-- STEP 1: CLIENT DETAILS -->
        <div id="step1" class="card step active">
            <h2>👤 Client Details</h2>
            <form id="clientForm">
                <div class="form-group"><label>Full Name</label><input type="text" id="custName" required></div>
                <div class="form-group"><label>Email</label><input type="email" id="custEmail" required></div>
                <div class="form-group"><label>Phone Number</label><input type="tel" id="custPhone" required></div>
                <div class="nav-buttons">
                    <button type="button" class="btn btn-secondary" onclick="window.location.href='dashboard.html'">← Dashboard</button>
                    <button type="submit" class="btn btn-primary">Next →</button>
                </div>
            </form>
        </div>

        <!-- STEP 2: CHOOSE SERVICE -->
        <div id="step2" class="card step">
            <h2>🔧 Choose Service</h2>
            <div class="service-cards" id="serviceCards"></div>
            <div id="selectedServiceMsg" style="text-align:center;margin-top:10px;color:#eab308;font-weight:500;"></div>
            <div class="nav-buttons"><button class="btn btn-secondary" onclick="showStep(1)">← Back</button><button class="btn btn-primary" onclick="confirmService()">Next →</button></div>
        </div>

        <!-- STEP 3: PURPOSE -->
        <div id="step3" class="card step">
            <h2>🎯 Service Purpose</h2>
            <div class="purpose-list" id="purposeList"></div>
            <div class="nav-buttons"><button class="btn btn-secondary" onclick="showStep(2)">← Back</button><button class="btn btn-primary" onclick="confirmPurpose()">Next →</button></div>
        </div>

        <!-- STEP 4: PAYMENT -->
        <div id="step4" class="card step">
            <h2>💳 Payment</h2>
            <div id="statusMessage" class="status-box"></div>
            <div class="payment-summary">
                <div class="row"><span class="label">Service</span><span class="value" id="summaryService">-</span></div>
                <div class="row"><span class="label">Purpose</span><span class="value" id="summaryPurpose">-</span></div>
                <div class="row"><span class="label">Amount</span><span class="value" id="summaryAmount" style="font-size:24px;color:#22c55e;font-weight:bold;">KES 0</span></div>
            </div>
            <form id="paymentForm">
                <div class="form-group"><label>M-Pesa Phone Number</label><input type="tel" id="mpesaPhone" placeholder="0712345678" required></div>
                <div class="nav-buttons"><button class="btn btn-secondary" onclick="showStep(3)">← Back</button><button type="submit" class="btn btn-success" id="payBtn">💳 Pay Now</button></div>
            </form>
        </div>

        <div class="result-box" id="resultBox">
            <h3 style="color:#eab308;margin-bottom:15px;">Service Result</h3>
            <div id="resultContent"></div>
        </div>
    </div>

    <script>
        // Use window.autoV directly
        const { supabase } = window.autoV;
        
        // State
        let selectedService = null;
        let selectedPurpose = null;
        let serviceFee = 0;
        let clientDetails = {};

        const SERVICE_FEES = {
            'valuation': 2500,
            'instant-value-check': 500,
            'inspection': 3500,
            'assessment': 3000,
            'mileage-rate': 1500,
            'fleet': 4000
        };

        const SERVICE_PAGES = {
            'valuation': 'valuation.html',
            'instant-value-check': 'valuation.html',
            'inspection': 'inspection.html',
            'assessment': 'assessment.html',
            'mileage-rate': 'mileage.html',
            'fleet': 'fleet.html'
        };

        const SERVICE_PURPOSES = {
            'valuation': ["Insurance Valuation", "Bank Loan", "Legal Proceedings", "Market Value Certificate"],
            'instant-value-check': ["Quick Market Estimate", "Selling Price Guide", "Buying Price Check"],
            'inspection': ["Pre-Purchase Inspection", "Mechanical Check", "Roadworthiness Test"],
            'assessment': ["Accident Damage", "Insurance Claim", "Repair Cost Estimate"],
            'mileage-rate': ["Travel Reimbursement", "Running Cost Analysis", "Fleet Budgeting"],
            'fleet': ["Full Fleet Valuation", "Fleet Condition Audit", "Asset Management"]
        };

        function showStep(step) {
            ['step1', 'step2', 'step3', 'step4'].forEach(id => document.getElementById(id).classList.remove('active'));
            ['step1Prog', 'step2Prog', 'step3Prog', 'step4Prog'].forEach(id => document.getElementById(id).classList.remove('active', 'completed'));
            
            document.getElementById(`step${step}`).classList.add('active');
            for(let i=1; i<step; i++) document.getElementById(`step${i}Prog`).classList.add('completed');
            document.getElementById(`step${step}Prog`).classList.add('active');
        }

        // Step 1: Client Details
        document.getElementById('clientForm').onsubmit = function(e) {
            e.preventDefault();
            clientDetails = {
                name: document.getElementById('custName').value,
                email: document.getElementById('custEmail').value,
                phone: document.getElementById('custPhone').value
            };
            renderServices();
            showStep(2);
        };

        function renderServices() {
            const container = document.getElementById('serviceCards');
            container.innerHTML = Object.keys(SERVICE_FEES).map(key => `
                <div class="service-card" onclick="selectService('${key}')">
                    <span class="service-icon">${getIcon(key)}</span>
                    <h4>${formatName(key)}</h4>
                    <small style="color:#22c55e;">KES ${SERVICE_FEES[key].toLocaleString()}</small>
                </div>
            `).join('');
        }

        function selectService(key) {
            document.querySelectorAll('.service-card').forEach(c => c.classList.remove('selected'));
            document.querySelector(`.service-card[onclick="selectService('${key}')"]`).classList.add('selected');
            selectedService = key;
            serviceFee = SERVICE_FEES[key];
            document.getElementById('selectedServiceMsg').textContent = `✅ Selected: ${formatName(key)}`;
        }

        function confirmService() {
            if (!selectedService) return alert('Please select a service.');
            renderPurposes();
            showStep(3);
        }

        function renderPurposes() {
            const container = document.getElementById('purposeList');
            const purposes = SERVICE_PURPOSES[selectedService] || ["General Purpose"];
            container.innerHTML = purposes.map(p => `
                <div class="purpose-item" onclick="selectPurpose('${p}')">${p}</div>
            `).join('');
        }

        function selectPurpose(p) {
            document.querySelectorAll('.purpose-item').forEach(i => i.classList.remove('selected'));
            document.querySelector(`.purpose-item[onclick="selectPurpose('${p}')"]`).classList.add('selected');
            selectedPurpose = p;
        }

        function confirmPurpose() {
            if (!selectedPurpose) return alert('Please select a purpose.');
            document.getElementById('summaryService').textContent = formatName(selectedService);
            document.getElementById('summaryPurpose').textContent = selectedPurpose;
            document.getElementById('summaryAmount').textContent = `KES ${serviceFee.toLocaleString()}`;
            showStep(4);
        }

        // Step 4: Payment
        document.getElementById('paymentForm').onsubmit = async function(e) {
            e.preventDefault();
            
            const phone = document.getElementById('mpesaPhone').value.trim();
            const btn = document.getElementById('payBtn');
            const statusBox = document.getElementById('statusMessage');

            btn.disabled = true;
            btn.textContent = 'Processing...';
            statusBox.style.display = 'none';

            try {
                const { data: { user } } = await supabase.auth.getUser();
                if (!user) {
                    alert('Please login again.');
                    window.location.href = 'login.html';
                    return;
                }

                // Create service request in Supabase
                const { data: request, error } = await supabase
                    .from('service_requests')
                    .insert({
                        user_id: user.id,
                        service_type: selectedService,
                        purpose: selectedPurpose,
                        amount: serviceFee,
                        phone: phone,
                        client_name: clientDetails.name,
                        client_email: clientDetails.email,
                        payment_status: 'pending',
                        status: 'awaiting_payment'
                    })
                    .select()
                    .single();

                if (error) throw error;

                // Simulate successful payment (In production, call your M-Pesa API here)
                setTimeout(async () => {
                    // Update status to paid
                    await supabase
                        .from('service_requests')
                        .update({ payment_status: 'paid', status: 'completed' })
                        .eq('id', request.id);

                    statusBox.className = 'status-box status-success';
                    statusBox.textContent = '✅ Payment successful! Redirecting to service...';
                    statusBox.style.display = 'block';

                    btn.textContent = '✅ Completed';
                    btn.disabled = true;

                    // Redirect to the specific service page
                    setTimeout(() => {
                        const page = SERVICE_PAGES[selectedService] || 'valuation.html';
                        window.location.href = page;
                    }, 2000);

                }, 3000);

            } catch (err) {
                statusBox.className = 'status-box status-error';
                statusBox.textContent = '❌ Error: ' + err.message;
                statusBox.style.display = 'block';
                btn.disabled = false;
                btn.textContent = '💳 Pay Now';
            }
        };

        // Helpers
        function formatName(key) {
            return key.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
        }

        function getIcon(key) {
            const icons = { 'valuation': '💰', 'instant-value-check': '💡', 'inspection': '🔍', 'assessment': '⚠️', 'mileage-rate': '📏', 'fleet': '🚛' };
            return icons[key] || '📄';
        }

        // Initialize
        async function init() {
            const user = await window.autoV.requireAuth();
            if (!user) return;

            const role = await window.autoV.getUserRole(user.id);
            
            // Filter services by role
            const ALLOWED_SERVICES = {
                'individual': ['valuation', 'instant-value-check'],
                'corporate': ['valuation', 'instant-value-check'],
                'valuer': ['valuation', 'instant-value-check', 'inspection', 'assessment', 'mileage-rate', 'fleet']
            };

            const allowed = ALLOWED_SERVICES[role] || [];
            Object.keys(SERVICE_FEES).forEach(key => {
                if (!allowed.includes(key)) delete SERVICE_FEES[key];
            });

            // Pre-fill client details
            const { data: profile } = await supabase.from('user_profiles').select('full_name, phone').eq('id', user.id).single();
            if (profile) {
                document.getElementById('custName').value = profile.full_name || '';
                document.getElementById('custPhone').value = profile.phone || '';
                document.getElementById('custEmail').value = user.email;
            }

            showStep(1);
        }

        init();
    </script>
</body>
</html>
