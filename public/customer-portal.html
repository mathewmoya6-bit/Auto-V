                console.log('✅ autoV ready, initializing...');

                return;
            }
            if (retries <= 0) {
                console.error('❌ window.autoV failed to initialize');
                alert('Configuration error. Please refresh the page.');
                return;
            }

            // ─── FEES ──────────────────────────────────────────────────
            let instantFee = 500;

            // ─── STATE ─────────────────────────────────────────────────

            // ─── HELPERS ──────────────────────────────────────────────
            function showMessage(msg, type = 'success') {
                const errorDiv = document.getElementById('errorMsg');
                const successDiv = document.getElementById('successMsg');
                errorDiv.style.display = 'none';
                successDiv.style.display = 'none';
                if (type === 'error') {
                    errorDiv.textContent = msg;
                    errorDiv.style.display = 'block';
                    setTimeout(() => errorDiv.style.display = 'none', 5000);
                } else {
                    successDiv.textContent = msg;
                    successDiv.style.display = 'block';
                    setTimeout(() => successDiv.style.display = 'none', 3000);
                }
            }

            function formatKES(amount) {
                return new Intl.NumberFormat('en-KE', { style: 'currency', currency: 'KES', minimumFractionDigits: 0 }).format(amount || 0);
            }

            function setPaymentStatus(status, message = '') {
                const el = document.getElementById('paymentStatus');
                el.className = 'payment-status ' + status;
                el.textContent = message || status.charAt(0).toUpperCase() + status.slice(1);
                el.style.display = 'block';
                document.getElementById('paymentRetry').style.display = (status === 'failed' || status === 'timeout') ? 'block' : 'none';
                currentPaymentStatus = status;
            }

            function showStep(step) {
                for (let i = 1; i <= 7; i++) {
                    const el = document.getElementById(`step${i}`);
                    if (el) el.classList.remove('active');
                    const prog = document.getElementById(`step${i}Prog`);
                    if (prog) {
                        prog.classList.remove('active', 'completed');
                        if (i < step) prog.classList.add('completed');
                        if (i === step) prog.classList.add('active');
                    }
                }
                document.getElementById(`step${step}`).classList.add('active');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            function formatPhoneForMpesa(phone) {
                let cleaned = phone.replace(/\D/g, '');
                if (cleaned.startsWith('0')) cleaned = '254' + cleaned.substring(1);
                else if (cleaned.startsWith('+')) cleaned = cleaned.substring(1);
                if (!cleaned.startsWith('254')) {
                    if (cleaned.length === 9) cleaned = '254' + cleaned;
                    else if (cleaned.length === 10 && cleaned.startsWith('7')) cleaned = '254' + cleaned;
                    else throw new Error('Invalid phone number format');
                }
                return cleaned;
            }

            function validateRegistration(reg) {
                return /^[K][A-Z]{2}\s?\d{3}[A-Z]$/.test(reg.toUpperCase().trim());
            }

            function validateFileSize(file, maxMB = 5) {
                if (file && file.size > maxMB * 1024 * 1024) {
                    throw new Error(`File ${file.name} exceeds ${maxMB}MB limit`);
                }
                return true;
            }

            // ─── PRICE CALCULATION ────────────────────────────────────
            function getPrice(service, purpose) {
                if (!service) return 0;
                if (purposePrices[service] && purpose) {
                    const price = purposePrices[service][purpose];
                    if (price) return price;
                }
                switch (service) {
                    case 'instant': return instantFee;
                    case 'mileage': return mileageFee;
                    case 'fleet': return fleetFee;
                    case 'verification': return verificationFee;
                    default: return 0;
                }
            }

            // ─── RENDER PURPOSE-SPECIFIC FIELDS ──────────────────────
            function renderPurposeFields(service, purpose) {
                const container = document.getElementById('purposeFields');
                const containerDiv = document.getElementById('purposeFieldsContainer');
                const fields = purposeFields[service]?.[purpose] || [];

                container.innerHTML = '';
                if (fields.length === 0) {
                    containerDiv.style.display = 'none';
                    return;
                }
                containerDiv.style.display = 'block';

                fields.forEach((field) => {
                    const div = document.createElement('div');
                    div.className = 'form-group';
                    const label = document.createElement('label');
                    label.textContent = field.label;
                    if (field.required) label.classList.add('required');
                    let input;
                    switch (field.type) {
                        case 'select':
                            input = document.createElement('select');
                            input.id = `field_${field.key}`;
                            field.options.forEach(opt => {
                                const option = document.createElement('option');
                                option.value = opt;
                                option.textContent = opt;
                                input.appendChild(option);
                            });
                            break;
                        case 'textarea':
                            input = document.createElement('textarea');
                            input.id = `field_${field.key}`;
                            input.rows = 2;
                            break;
                        default:
                            input = document.createElement('input');
                            input.id = `field_${field.key}`;
                            input.type = field.type || 'text';
                            if (field.type === 'number') input.step = 'any';
                    }
                    if (field.required) input.required = true;
                    div.appendChild(label);
                    div.appendChild(input);
                    container.appendChild(div);
                });
            }

            // ─── UPDATE SUMMARY ──────────────────────────────────────
            function updateSummary() {
                const price = getPrice(selectedService, selectedPurpose);
                let serviceName = '';
                if (selectedService === 'instant') serviceName = 'Instant Value Check';
                else if (selectedService === 'valuation') serviceName = 'Valuation';
                else if (selectedService === 'inspection') serviceName = 'Inspection';
                else if (selectedService === 'assessment') serviceName = 'Assessment';
                else if (selectedService === 'mileage') serviceName = 'Mileage Rate';
                else if (selectedService === 'fleet') serviceName = 'Fleet Services';
                else if (selectedService === 'verification') serviceName = 'Report Verification';
                document.getElementById('summaryService').textContent = serviceName || '-';
                document.getElementById('summaryPurpose').textContent = selectedPurpose || 'Not selected';
                document.getElementById('summaryAmount').textContent = `KES ${Number(price || 0).toLocaleString()}`;
            }

            // ─── FEE LOADING ──────────────────────────────────────────
            async function loadFees() {
                try {
                    const { data, error } = await supabase
                        .from('system_settings')
                        .select('setting_key, setting_value')
                        .ilike('setting_key', '%_fee');

                    if (error) throw error;
                    const map = {};
                    data.forEach(row => map[row.setting_key] = row.setting_value);

                    instantFee = parseInt(map.instant_fee) || 500;
                    mileageFee = parseInt(map.mileage_fee) || 1500;
                    fleetFee = parseInt(map.fleet_fee) || 4000;
                    verificationFee = parseInt(map.verification_fee) || 1000;

                    for (const service of ['valuation', 'inspection', 'assessment']) {
                        for (const purpose of Object.keys(purposePrices[service] || {})) {
                            const key = `${service}_${purpose.toLowerCase().replace(/[^a-z0-9]/g, '_')}_fee`;
                            if (map[key]) {
                                purposePrices[service][purpose] = parseInt(map[key]);
                            }
                        }
                    }

                } catch (e) { console.warn('Error loading fees:', e); }

                document.getElementById('instantPriceDisplay').textContent = `KES ${Number(instantFee || 0).toLocaleString()}`;
                document.getElementById('valuationPriceDisplay').textContent = 'KES 2,500 – 4,000';
                document.getElementById('inspectionPriceDisplay').textContent = 'KES 2,000 – 3,500';
                document.getElementById('assessmentPriceDisplay').textContent = 'KES 3,000 – 4,000';
                document.getElementById('mileagePriceDisplay').textContent = `KES ${Number(mileageFee || 0).toLocaleString()}`;
                document.getElementById('fleetPriceDisplay').textContent = `KES ${Number(fleetFee || 0).toLocaleString()}`;
                document.getElementById('verificationPriceDisplay').textContent = `KES ${Number(verificationFee || 0).toLocaleString()}`;

                if (selectedService && selectedPurpose) {
                    updateSummary();
                }
            }

            // ─── REAL-TIME FEE UPDATES ──────────────────────────────
            function subscribeToFeeChanges() {
                console.log('🔄 Subscribing to fee changes...');

                const channel = supabase
                    .channel('system_settings_changes')
                    .on(
                        'postgres_changes',
                        {
                            event: 'UPDATE',
                            schema: 'public',
                            table: 'system_settings'
                        },
                        (payload) => {
                            console.log('📢 Received change:', payload);
                            if (payload.new.setting_key && payload.new.setting_key.includes('_fee')) {
                                console.log('🔄 Fee updated, reloading all fees...');
                                loadFees();
                                const badge = document.getElementById('feeUpdateBadge');
                                if (badge) {
                                    badge.classList.add('show');
                                    setTimeout(() => badge.classList.remove('show'), 3000);
                                }
                            }
                        }
                    )
                    .subscribe((status) => {
                        console.log('📡 Realtime status:', status);
                    });

                return channel;
            }

            // ─── UPDATE PURPOSE LIST ────────────────────────────────
            function updatePurposeList(service) {
                const container = document.getElementById('purposeList');
                const purposes = purposeOptions[service] || purposeOptions.instant;
                container.innerHTML = purposes.map(p =>
                    `<div class="purpose-item" data-purpose="${p}">${p}</div>`
                ).join('');
                document.querySelectorAll('.purpose-item').forEach(item => {
                    item.onclick = () => {
                        document.querySelectorAll('.purpose-item').forEach(i => i.classList.remove('selected'));
                        item.classList.add('selected');
                        selectedPurpose = item.dataset.purpose;
                        renderPurposeFields(selectedService, selectedPurpose);
                        updateSummary();
                    };
                });
                if (selectedPurpose && purposes.includes(selectedPurpose)) {
                    const selectedEl = container.querySelector(`[data-purpose="${selectedPurpose}"]`);
                    if (selectedEl) selectedEl.classList.add('selected');
                    renderPurposeFields(service, selectedPurpose);
                } else {
                    selectedPurpose = null;
                    document.getElementById('purposeFieldsContainer').style.display = 'none';
                }
                updateSummary();
            }

            // ─── USER PROFILE ─────────────────────────────────────────
            async function upsertUserProfile(userId, email, name, phone) {
                try {
                    const { error } = await supabase
                        .from('user_profiles')
                        .upsert({
                            id: userId,
                            email: email,
                            full_name: name || email.split('@')[0],
                            phone: phone || '',
                            first_login: true,
                            has_vehicle: false,
                            login_count: 1,
                            updated_at: new Date().toISOString()
                        }, { onConflict: 'id' });

                    if (error) {
                        console.warn('Error upserting user profile:', error.message);
                    }
                } catch (err) {
                    console.warn('Error in upsertUserProfile:', err);
                }
            }

            async function checkFirstTimeUser(userId) {
                try {
                    const { data, error } = await supabase
                        .from('user_profiles')
                        .select('first_login, has_vehicle, login_count, full_name, phone')
                        .eq('id', userId)
                        .single();

                    if (error) {
                        console.warn('User profile query failed, treating as first-time user:', error.message);
                        return true;
                    }

                    if (!data) return true;
                    if (!data.full_name || !data.phone) return true;
                    return !(data.first_login === false && data.has_vehicle === true && data.login_count >= 2);
                } catch (err) {
                    console.warn('Error checking user profile, treating as first-time user:', err);
                    return true;
                }
            }

            async function isProfileComplete(userId) {
                try {
                    const { data, error } = await supabase
                        .from('user_profiles')
                        .select('full_name, phone')
                        .eq('id', userId)
                        .single();

                    if (error) {
                        console.warn('Profile completeness query failed, assuming incomplete:', error.message);
                        return false;
                    }

                    return !!(data && data.full_name && data.phone);
                } catch (err) {
                    console.warn('Error checking profile completeness:', err);
                    return false;
                }
            }

            // ─── TOKEN HELPERS ─────────────────────────────────────────
            async function getValidToken() {
                const { data: { session }, error } = await supabase.auth.getSession();
                if (error || !session) return null;
                return session.access_token;
            }

            async function fetchWithAuth(url, options = {}) {
                const token = await getValidToken();
                if (!token) {
                    window.location.href = "login.html";
                    throw new Error('No active session');
                }
                const headers = {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`,
                    ...options.headers
                };
                const response = await fetch(url, { ...options, headers });
                if (response.status === 401) {
                    const { data: { session }, error } = await supabase.auth.refreshSession();
                    if (error || !session) {
                        window.location.href = "login.html";
                        throw new Error('Session expired');
                    }
                    const newToken = session.access_token;
                    headers['Authorization'] = `Bearer ${newToken}`;
                    return fetch(url, { ...options, headers });
                }
                return response;
            }

            // ─── LOGIN / SIGNUP ──────────────────────────────────────
            async function handleLogin(e) {
                e.preventDefault();
                const email = document.getElementById('loginEmail').value;
                const password = document.getElementById('loginPassword').value;
                if (!email || !password) { showMessage('Please enter email and password', 'error'); return; }
                const loginBtn = document.querySelector('#loginForm button[type="submit"]');
                const originalText = loginBtn.innerHTML;
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<span class="spinner"></span> Logging in...';
                try {
                    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                    if (error) { showMessage(error.message, 'error'); loginBtn.disabled = false; loginBtn.innerHTML = originalText; return; }
                    currentUser = data.user;
                    const userName = currentUser.user_metadata?.full_name || currentUser.email.split('@')[0];
                    await upsertUserProfile(currentUser.id, currentUser.email, userName, currentUser.user_metadata?.phone || '');
                    isFirstTimeUser = await checkFirstTimeUser(currentUser.id);
                    const complete = await isProfileComplete(currentUser.id);
                    if (isFirstTimeUser || !complete) {
                        document.getElementById('welcomeBanner').style.display = 'block';
                        showMessage('👋 Welcome! Let\'s get you started.', 'success');
                        document.getElementById('custEmail').value = currentUser.email;
                        if (currentUser.user_metadata?.full_name) document.getElementById('custName').value = currentUser.user_metadata.full_name;
                        if (currentUser.user_metadata?.phone) document.getElementById('custPhone').value = currentUser.user_metadata.phone;
                        showStep(2);
                    } else {
                        showMessage('✅ Welcome back! Redirecting to dashboard...', 'success');
                        setTimeout(() => window.location.href = "dashboard.html", 1500);
                    }
                } catch (err) { showMessage('Network error. Please try again.', 'error'); }
                finally { loginBtn.disabled = false; loginBtn.innerHTML = originalText; }
            }

            async function handleSignup(e) {
                e.preventDefault();
                const email = document.getElementById('signupEmail').value;
                const password = document.getElementById('signupPassword').value;
                const name = document.getElementById('signupName').value;
                const phone = document.getElementById('signupPhone').value;
                if (!email || !password) { showMessage('Please enter email and password', 'error'); return; }
                if (password.length < 6) { showMessage('Password must be at least 6 characters', 'error'); return; }
                const signupBtn = document.querySelector('#signupForm button[type="submit"]');
                const originalText = signupBtn.innerHTML;
                signupBtn.disabled = true;
                signupBtn.innerHTML = '<span class="spinner"></span> Creating account...';
                try {
                    const { data, error } = await supabase.auth.signUp({
                        email, password,
                        options: { data: { full_name: name, phone: phone } }
                    });
                    if (error) {
                        if (error.message.includes('User already registered')) showMessage('User already exists. Please login.', 'error');
                        else showMessage(error.message, 'error');
                        signupBtn.disabled = false;
                        signupBtn.innerHTML = originalText;
                        return;
                    }
                    if (data.user) {
                        await upsertUserProfile(data.user.id, email, name || email.split('@')[0], phone || '');
                        const { data: loginData, error: loginError } = await supabase.auth.signInWithPassword({ email, password });
                        if (!loginError && loginData.user) {
                            currentUser = loginData.user;
                            localStorage.setItem('autoV_user', JSON.stringify({
                                id: currentUser.id,
                                email: currentUser.email,
                                name: name || email.split('@')[0]
                            }));
                            document.getElementById('custEmail').value = email;
                            if (name) document.getElementById('custName').value = name;
                            if (phone) document.getElementById('custPhone').value = phone;
                            document.getElementById('welcomeBanner').style.display = 'block';
                            showMessage('✅ Account created!', 'success');
                            showStep(2);
                        }
                    }
                } catch (err) { showMessage('Network error. Please try again.', 'error'); }
                finally { signupBtn.disabled = false; signupBtn.innerHTML = originalText; }
            }

            // ─── VEHICLE LOOKUP ──────────────────────────────────────
            async function lookupVehicle() {
                const reg = document.getElementById('vehicleReg').value.trim().toUpperCase();
                if (!reg) { showMessage('Enter a registration number first', 'error'); return; }
                const btn = document.getElementById('lookupVehicleBtn');
                const originalText = btn.textContent;
                btn.disabled = true;
                btn.textContent = '⏳ ...';
                try {
                    const response = await fetchWithAuth(`${API_BASE}/vehicle/lookup/${encodeURIComponent(reg)}`);
                    if (!response.ok) { const err = await response.json(); throw new Error(err.message || 'Lookup failed'); }
                    const data = await response.json();
                    if (data.make) document.getElementById('vehicleMake').value = data.make;
                    if (data.model) document.getElementById('vehicleModel').value = data.model;
                    if (data.year) document.getElementById('vehicleYear').value = data.year;
                    if (data.vin) document.getElementById('vehicleVin').value = data.vin;
                    showMessage('Vehicle details auto-filled!', 'success');
                } catch (err) { showMessage('Lookup error: ' + err.message, 'error'); }
                finally { btn.disabled = false; btn.textContent = originalText; }
            }

            // ─── PAYMENT ──────────────────────────────────────────────
            async function initiatePayment() {
                if (paymentInProgress) return;
                paymentInProgress = true;

                let mpesaPhone;
                try { mpesaPhone = formatPhoneForMpesa(document.getElementById('mpesaPhone').value.trim()); }
                catch (e) { showMessage('Invalid phone number. Enter a valid Kenyan number.', 'error'); paymentInProgress = false; return; }

                if (!selectedService) { showMessage('Select service first', 'error'); paymentInProgress = false; return; }
                if (!selectedPurpose) { showMessage('Select purpose first', 'error'); paymentInProgress = false; return; }

                const payBtn = document.getElementById('payBtn');
                const originalText = payBtn.innerHTML;
                payBtn.disabled = true;
                payBtn.innerHTML = '<span class="spinner"></span> Initiating Payment...';
                setPaymentStatus('pending', '⏳ Initiating payment...');
                document.getElementById('paymentRetry').style.display = 'none';

                try {
                    const token = await getValidToken();
                    if (!token) throw new Error('No active session. Please login again.');

                    const price = getPrice(selectedService, selectedPurpose);

                    const initResponse = await fetchWithAuth(`${API_BASE}/mpesa/initiate`, {
                        method: 'POST',
                        body: JSON.stringify({
                            phone: mpesaPhone,
                            amount: price,
                            service: selectedService,
                            purpose: selectedPurpose
                        })
                    });

                    if (!initResponse.ok) {
                        const err = await initResponse.json();
                        console.error('Payment initiation error:', err);
                        throw new Error(err.error || 'STK Push initiation failed');
                    }

                    const initData = await initResponse.json();
                    console.log('Payment initiated:', initData);

                    currentPaymentId = initData.payment_id;
                    setPaymentStatus('processing', '📲 STK Push sent to your phone. Please confirm.');

                    payBtn.innerHTML = '<span class="spinner"></span> Waiting for confirmation...';
                    let attempts = 0, networkFailures = 0;
                    const maxAttempts = 60, maxNetworkFailures = 10;
                    if (pollInterval) clearInterval(pollInterval);
                    pollInterval = setInterval(async () => {
                        attempts++;
                        try {
                            const statusResponse = await fetchWithAuth(`${API_BASE}/mpesa/status/${currentPaymentId}`);
                            if (!statusResponse.ok) {
                                if (statusResponse.status === 404) {
                                    if (attempts >= maxAttempts) {
                                        clearInterval(pollInterval);
                                        pollInterval = null;
                                        setPaymentStatus('timeout', '⏰ Payment timed out. Please retry.');
                                        showMessage('Payment took too long. Please try again.', 'error');
                                        payBtn.disabled = false;
                                        payBtn.innerHTML = originalText;
                                        paymentInProgress = false;
                                    }
                                    return;
                                }
                                throw new Error('Status check failed');
                            }
                            const statusData = await statusResponse.json();
                            if (statusData.status === 'completed') {
                                clearInterval(pollInterval);
                                pollInterval = null;
                                setPaymentStatus('completed', '✅ Payment confirmed!');
                                currentPaymentStatus = 'completed';
                                payBtn.innerHTML = '✅ Payment Complete';
                                showMessage('Payment successful! Proceed to vehicle data entry.', 'success');
                                let serviceTitle = selectedService.charAt(0).toUpperCase() + selectedService.slice(1);
                                document.querySelector('#step6 h2').textContent = `🚗 ${serviceTitle} Data Entry`;
                                showStep(6);
                                payBtn.disabled = false;
                                paymentInProgress = false;
                            } else if (statusData.status === 'failed') {
                                clearInterval(pollInterval);
                                pollInterval = null;
                                setPaymentStatus('failed', '❌ Payment failed. Please try again.');
                                currentPaymentStatus = 'failed';
                                showMessage('Payment failed. Please try again.', 'error');
                                payBtn.disabled = false;
                                payBtn.innerHTML = originalText;
                                paymentInProgress = false;
                            }
                            if (attempts >= maxAttempts) {
                                clearInterval(pollInterval);
                                pollInterval = null;
                                setPaymentStatus('timeout', '⏰ Payment timed out. Please retry.');
                                currentPaymentStatus = 'timeout';
                                showMessage('Payment timed out. Please try again.', 'error');
                                payBtn.disabled = false;
                                payBtn.innerHTML = originalText;
                                paymentInProgress = false;
                            }
                        } catch (err) {
                            networkFailures++;
                            console.warn('Polling error:', err);
                            if (networkFailures >= maxNetworkFailures) {
                                clearInterval(pollInterval);
                                pollInterval = null;
                                setPaymentStatus('failed', 'Network error. Please retry.');
                                currentPaymentStatus = 'failed';
                                showMessage('Network error. Please retry.', 'error');
                                payBtn.disabled = false;
                                payBtn.innerHTML = originalText;
                                paymentInProgress = false;
                            }
                        }
                    }, 2000);

                } catch (err) {
                    console.error('Payment error:', err);
                    setPaymentStatus('failed', '❌ ' + err.message);
                    currentPaymentStatus = 'failed';
                    showMessage('Payment failed: ' + err.message, 'error');
                    payBtn.disabled = false;
                    payBtn.innerHTML = originalText;
                    paymentInProgress = false;
                }
            }

            // ─── RETRY PAYMENT ────────────────────────────────────────
            document.getElementById('retryPaymentBtn')?.addEventListener('click', async () => {
                currentPaymentStatus = null;
                document.getElementById('paymentStatus').style.display = 'none';
                document.getElementById('paymentRetry').style.display = 'none';
                await initiatePayment();
            });

            // ─── SUBMIT VEHICLE REQUEST ──────────────────────────────
            async function submitVehicleRequest(e) {
                e.preventDefault();
                if (currentPaymentStatus !== 'completed') {
                    showMessage('Please complete payment first.', 'error');
                    showStep(5);
                    return;
                }

                const reg = document.getElementById('vehicleReg').value.trim().toUpperCase();
                if (!validateRegistration(reg)) {
                    showMessage('Registration number must be in Kenyan format (e.g., KCA 123A)', 'error');
                    return;
                }
                const make = document.getElementById('vehicleMake').value.trim();
                const model = document.getElementById('vehicleModel').value.trim();
                const year = parseInt(document.getElementById('vehicleYear').value);
                const odometer = parseInt(document.getElementById('vehicleOdometer').value);
                const condition = document.getElementById('vehicleCondition').value;
                const accident = document.getElementById('vehicleAccident').value;
                const vin = document.getElementById('vehicleVin').value.trim();
                const transmission = document.getElementById('vehicleTransmission').value;
                const fuel = document.getElementById('vehicleFuel').value;
                const location = document.getElementById('vehicleLocation').value;

                const customerType = document.getElementById('customerType').value;
                const fullName = document.getElementById('custName').value.trim();
                const idNumber = document.getElementById('custId').value.trim();
                const phone = document.getElementById('custPhone').value.trim();
                const email = document.getElementById('custEmail').value.trim();
                const companyName = document.getElementById('companyName').value.trim();
                const businessReg = document.getElementById('businessReg').value.trim();
                const contactPerson = document.getElementById('contactPerson').value.trim();

                if (!fullName || !idNumber || !phone || !email) {
                    showMessage('Please fill all required client details', 'error');
                    return;
                }
                if (customerType === 'corporate' && !companyName) {
                    showMessage('Please enter the company name', 'error');
                    return;
                }

                if (!make || !model || !year) { showMessage('Fill all required vehicle details', 'error'); return; }
                if (isNaN(odometer) || odometer < 0 || odometer > 2000000) {
                    showMessage('Odometer must be between 0 and 2,000,000 km', 'error');
                    return;
                }

                const fields = purposeFields[selectedService]?.[selectedPurpose] || [];
                const purposeData = {};
                let hasMissing = false;
                fields.forEach(f => {
                    const el = document.getElementById(`field_${f.key}`);
                    if (el) {
                        const val = el.value.trim();
                        purposeData[f.key] = val;
                        if (f.required && !val) {
                            hasMissing = true;
                            el.style.borderColor = '#ef4444';
                            const errMsg = el.parentNode.querySelector('.field-error');
                            if (!errMsg) {
                                const msg = document.createElement('span');
                                msg.className = 'field-error';
                                msg.style.cssText = 'display:block;color:#ef4444;font-size:11px;margin-top:4px;';
                                msg.textContent = 'This field is required';
                                el.parentNode.appendChild(msg);
                            }
                        } else {
                            el.style.borderColor = '';
                            const errMsg = el.parentNode.querySelector('.field-error');
                            if (errMsg) errMsg.remove();
                        }
                    }
                });
                if (hasMissing) {
                    showMessage('Please fill all required purpose-specific fields.', 'error');
                    document.getElementById('purposeFieldsContainer').scrollIntoView({ behavior: 'smooth', block: 'center' });
                    return;
                }

                const fileInputs = ['frontPhoto', 'rearPhoto', 'interiorPhoto', 'odometerPhoto', 'logbookPhoto'];
                for (const id of fileInputs) {
                    const file = document.getElementById(id).files[0];
                    if (file) { try { validateFileSize(file, 5); } catch (e) { showMessage(e.message, 'error'); return; } }
                }

                const submitBtn = document.getElementById('submitVehicleBtn');
                const originalText = submitBtn.innerHTML;
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="spinner"></span> Submitting...';

                try {
                    const token = await getValidToken();
                    if (!token) throw new Error('No active session. Please login again.');
                    const formData = new FormData();
                    fileInputs.forEach(id => { const file = document.getElementById(id).files[0]; if (file) formData.append(id, file); });
                    formData.append('registration', reg);
                    formData.append('make', make);
                    formData.append('model', model);
                    formData.append('year', year);
                    formData.append('odometer', odometer);
                    formData.append('condition', condition);
                    formData.append('accident', accident);
                    formData.append('vin', vin);
                    formData.append('transmission', transmission);
                    formData.append('fuel', fuel);
                    formData.append('location', location);
                    formData.append('service', selectedService);
                    formData.append('purpose', selectedPurpose);
                    formData.append('customer_type', customerType);
                    formData.append('customer_name', fullName);
                    formData.append('customer_id', idNumber);
                    formData.append('customer_phone', phone);
                    formData.append('customer_email', email);
                    formData.append('company_name', companyName);
                    formData.append('business_reg', businessReg);
                    formData.append('contact_person', contactPerson);
                    formData.append('payment_id', currentPaymentId);
                    formData.append('amount', getPrice(selectedService, selectedPurpose));
                    if (Object.keys(purposeData).length > 0) {
                        formData.append('purpose_data', JSON.stringify(purposeData));
                    }

                    const response = await fetch(`${API_BASE}/service-requests`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` },
                        body: formData
                    });

                    if (!response.ok) { const err = await response.json(); throw new Error(err.message || 'Submission failed'); }
                    const result = await response.json();
                    currentRequestId = result.request_id;

                    let serviceName = selectedService.charAt(0).toUpperCase() + selectedService.slice(1);

                    let resultsHTML = '';
                    if (selectedService === 'instant') {
                        resultsHTML = `
                            <div style="margin-bottom:20px;">
                                <span class="badge" style="background:#22c55e;color:#000;padding:4px 16px;border-radius:30px;font-weight:600;">💡 Instant Estimate</span>
                            </div>
                            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0;">
                                <div style="background:#1e293b;border-radius:12px;padding:12px;">
                                    <span style="color:#94a3b8;font-size:12px;">Low Market Value</span>
                                    <div style="font-size:24px;font-weight:700;color:#eab308;">KES ${Number(result.low_value || 0).toLocaleString()}</div>
                                </div>
                                <div style="background:#1e293b;border-radius:12px;padding:12px;border:2px solid #eab308;">
                                    <span style="color:#94a3b8;font-size:12px;">Average Market Value</span>
                                    <div style="font-size:28px;font-weight:800;color:#22c55e;">KES ${Number(result.average_value || 0).toLocaleString()}</div>
                                </div>
                                <div style="background:#1e293b;border-radius:12px;padding:12px;">
                                    <span style="color:#94a3b8;font-size:12px;">High Market Value</span>
                                    <div style="font-size:24px;font-weight:700;color:#f59e0b;">KES ${Number(result.high_value || 0).toLocaleString()}</div>
                                </div>
                                <div style="background:#1e293b;border-radius:12px;padding:12px;">
                                    <span style="color:#94a3b8;font-size:12px;">Confidence Score</span>
                                    <div style="font-size:20px;font-weight:700;color:#3b82f6;">${result.confidence || '92%'}</div>
                                </div>
                            </div>
                            <p style="color:#eab308;font-size:14px;font-weight:600;">📍 Market Region: ${result.region || 'Nairobi, Kenya'}</p>
                            <p style="color:#94a3b8;font-size:13px;">📅 Based on current ${new Date().getFullYear()} market data</p>
                            <div class="disclaimer-box">
                                ⚠️ <strong>Disclaimer:</strong> This is an automated AI-generated estimate based on market data trends. It is not a certified valuation. For insurance, bank financing, legal, or audit purposes, a formal valuation report is required.
                            </div>
                        `;
                    } else {
                        resultsHTML = `
                            <div style="margin-bottom:20px;">
                                <span class="badge" style="background:#22c55e;color:#000;padding:4px 16px;border-radius:30px;font-weight:600;">✅ ${serviceName} Complete</span>
                            </div>
                            <div class="result-value">KES ${Number(result.market_value || 0).toLocaleString()}</div>
                            <p style="color:#eab308;font-weight:600;">Estimated ${serviceName} Value</p>
                            <div class="result-detail">
                                <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #2d3a4e;">
                                    <span style="color:#94a3b8;">Insurance Value</span>
                                    <strong style="color:#22c55e;">KES ${Number(result.insurance_value || 0).toLocaleString()}</strong>
                                </div>
                                <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #2d3a4e;">
                                    <span style="color:#94a3b8;">Trade-In Value</span>
                                    <strong style="color:#f59e0b;">KES ${Number(result.trade_in_value || 0).toLocaleString()}</strong>
                                </div>
                                <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #2d3a4e;">
                                    <span style="color:#94a3b8;">Forced Sale Value</span>
                                    <strong style="color:#ef4444;">KES ${Number(result.forced_sale_value || 0).toLocaleString()}</strong>
                                </div>
                                <div style="display:flex;justify-content:space-between;padding:10px 0;">
                                    <span style="color:#94a3b8;">Certificate Number</span>
                                    <strong style="color:#eab308;font-size:12px;">${result.certificate || 'N/A'}</strong>
                                </div>
                                <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #2d3a4e;">
                                    <span style="color:#94a3b8;">Verification</span>
                                    <a href="${result.verify_url || '#'}" target="_blank" style="color:#3b82f6;">Verify Online</a>
                                </div>
                            </div>
                            <div style="margin-top:20px;padding:15px;background:#14532d;border-radius:12px;">
                                <p style="color:#22c55e;font-weight:600;">✅ Request Submitted!</p>
                                <p style="color:#bbf7d0;font-size:13px;margin-top:5px;">
                                    Vehicle ${reg} has been submitted for ${serviceName}.
                                    ${isFirstTimeUser ? 'Your account is now fully set up!' : ''}
                                    <br><small>Status: ${result.status || 'Pending Assessor Review'}</small>
                                </p>
                            </div>
                        `;
                    }

                    document.getElementById('resultsContainer').innerHTML = resultsHTML;
                    showStep(7);
                    document.getElementById('downloadReportBtn').style.display = (selectedService !== 'instant') ? 'inline-block' : 'none';

                } catch (err) {
                    console.error('Submission error:', err);
                    showMessage('Error submitting request: ' + err.message, 'error');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalText;
                }
            }

            // ─── DOWNLOAD REPORT ─────────────────────────────────────
            async function downloadReport() {
                if (!currentRequestId) { showMessage('No request to download', 'error'); return; }
                try {
                    const response = await fetchWithAuth(`${API_BASE}/reports/${currentRequestId}`);
                    if (!response.ok) throw new Error('Report generation failed');
                    const contentType = response.headers.get('content-type');
                    if (!contentType || !contentType.includes('application/pdf')) {
                        const text = await response.text();
                        let errorMsg = 'Invalid report response';
                        try { const json = JSON.parse(text); if (json.error) errorMsg = json.error; } catch {}
                        throw new Error(errorMsg);
                    }
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `AUTO-V_Report_${currentRequestId}.pdf`;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    window.URL.revokeObjectURL(url);
                } catch (err) { showMessage('Download error: ' + err.message, 'error'); }
            }

            // ─── TOGGLE CORPORATE FIELDS ────────────────────────────
            function toggleCorporateFields() {
                const type = document.getElementById('customerType').value;
                const corporateDiv = document.getElementById('corporateFields');
                if (type === 'corporate') {
                    corporateDiv.style.display = 'block';
                    document.getElementById('contactPerson').value = document.getElementById('custName').value;
                } else {
                    corporateDiv.style.display = 'none';
                }
            }

            // ─── EVENT LISTENERS ─────────────────────────────────────
            document.getElementById('loginForm')?.addEventListener('submit', handleLogin);
            document.getElementById('signupForm')?.addEventListener('submit', handleSignup);
            document.getElementById('clientForm')?.addEventListener('submit', (e) => { e.preventDefault(); showStep(3); });
            document.getElementById('paymentForm')?.addEventListener('submit', initiatePayment);
            document.getElementById('vehicleForm')?.addEventListener('submit', submitVehicleRequest);
            document.getElementById('lookupVehicleBtn')?.addEventListener('click', lookupVehicle);
            document.getElementById('downloadReportBtn')?.addEventListener('click', downloadReport);

            document.getElementById('backToLogin')?.addEventListener('click', () => showStep(1));
            document.getElementById('backToClient')?.addEventListener('click', () => showStep(2));
            document.getElementById('backToService')?.addEventListener('click', () => showStep(3));
            document.getElementById('backToPurpose')?.addEventListener('click', () => { if (selectedService) updatePurposeList(selectedService); showStep(4); });
            document.getElementById('backToPay')?.addEventListener('click', () => showStep(5));

            document.getElementById('nextStep3Btn')?.addEventListener('click', () => {
                if (selectedService) {
                    updatePurposeList(selectedService);
                    showStep(4);
                } else showMessage('Select a service', 'error');
            });

            document.getElementById('nextStep4Btn')?.addEventListener('click', () => {
                if (selectedPurpose) { updateSummary(); showStep(5); }
                else showMessage('Select a purpose', 'error');
            });

            document.getElementById('newRequestBtn')?.addEventListener('click', () => window.location.reload());
            document.getElementById('goToDashboardBtn')?.addEventListener('click', () => window.location.href = 'dashboard.html');

            document.getElementById('showSignup')?.addEventListener('click', () => {
                document.getElementById('signupSection').style.display = 'block';
            });
            document.getElementById('hideSignup')?.addEventListener('click', () => {
                document.getElementById('signupSection').style.display = 'none';
            });

            document.getElementById('customerType')?.addEventListener('change', toggleCorporateFields);
            document.getElementById('custName')?.addEventListener('input', function() {
                if (document.getElementById('customerType').value === 'corporate') {
                    document.getElementById('contactPerson').value = this.value;
                }
            });

            // ─── SERVICE SELECTION ──────────────────────────────────
            document.querySelectorAll('.service-card').forEach(card => {
                card.onclick = () => {
                    document.querySelectorAll('.service-card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    selectedService = card.dataset.service;
                    selectedPurpose = null;
                    document.getElementById('purposeFieldsContainer').style.display = 'none';
                    document.getElementById('purposeFields').innerHTML = '';
                    document.querySelectorAll('.purpose-item').forEach(i => i.classList.remove('selected'));
                    updateSummary();
                    let name = '';
                    if (selectedService === 'instant') name = 'Instant Value Check';
                    else if (selectedService === 'valuation') name = 'Valuation';
                    else if (selectedService === 'inspection') name = 'Inspection';
                    else if (selectedService === 'assessment') name = 'Assessment';
                    else if (selectedService === 'mileage') name = 'Mileage Rate';
                    else if (selectedService === 'fleet') name = 'Fleet Services';
                    else if (selectedService === 'verification') name = 'Report Verification';
                    const price = getPrice(selectedService, selectedPurpose);
                    document.getElementById('selectedServiceMsg').innerHTML =
                        `✅ Selected: ${name} - ${price ? `KES ${Number(price).toLocaleString()}` : 'Price depends on purpose'}`;
                };
            });

            // ─── POPULATE YEARS ──────────────────────────────────────
            function populateYears() {
                const yearSelect = document.getElementById('vehicleYear');
                const currentYear = new Date().getFullYear();
                yearSelect.innerHTML = '';
                for (let y = currentYear; y >= 1950; y--) {
                    yearSelect.innerHTML += `<option value="${y}">${y}</option>`;
                }
            }

            // ─── CHECK SESSION ──────────────────────────────────────
            async function checkExistingSession() {
                try {
                    const { data: { user } } = await supabase.auth.getUser();
                    if (user) {
                        let isFirst = true;
                        let complete = false;

                        try {
                            isFirst = await checkFirstTimeUser(user.id);
                            complete = await isProfileComplete(user.id);
                        } catch (err) {
                            console.warn('Error checking user profile, proceeding with onboarding:', err);
                            isFirst = true;
                            complete = false;
                        }

                        if (isFirst || !complete) {
                            document.getElementById('welcomeBanner').style.display = 'block';
                            document.getElementById('custEmail').value = user.email;
                            if (user.user_metadata?.full_name) document.getElementById('custName').value = user.user_metadata.full_name;
                            if (user.user_metadata?.phone) document.getElementById('custPhone').value = user.user_metadata.phone;
                            showStep(2);
                        } else {
                            window.location.href = "dashboard.html";
                        }
                    }
                } catch (err) {
                    console.warn('Error checking session:', err);
                    showStep(1);
                }
            }

            // ─── LOGOUT ──────────────────────────────────────────────
            document.getElementById('logoutBtn')?.addEventListener('click', async () => {
                await supabase.auth.signOut();
                localStorage.removeItem('autoV_user');
                window.location.href = 'login.html';
            });

            // ─── INIT ────────────────────────────────────────────────
            async function init() {
                populateYears();
                await loadFees();

                realtimeChannel = subscribeToFeeChanges();
                feeInterval = setInterval(loadFees, 30000);

                toggleCorporateFields();
                await checkExistingSession();
                if (!document.querySelector('.step.active')) {
                    showStep(1);
                }
                document.getElementById('downloadReportBtn').style.display = 'none';

                window.addEventListener('beforeunload', () => {
                    if (pollInterval) clearInterval(pollInterval);
                    if (feeInterval) clearInterval(feeInterval);
                    if (realtimeChannel) supabase.removeChannel(realtimeChannel);
                });
            }

            init();
        });
    })();
</script>
</body>
</html>
