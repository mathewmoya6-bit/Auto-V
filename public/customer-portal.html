<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTO-V Service Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #0b1120; color: white; min-height: 100vh; }
        header { display: flex; justify-content: space-between; padding: 15px 30px; background: #111827; border-bottom: 2px solid #eab308; }
        .logo { font-size: 24px; color: #eab308; font-weight: bold; }
        .container { max-width: 800px; margin: auto; padding: 24px; }
        .card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; color: #94a3b8; margin-bottom: 5px; font-weight: 600; }
        input, select { width: 100%; padding: 12px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: white; }
        input:focus { border-color: #eab308; outline: none; }
        .btn-primary { background: #eab308; color: black; padding: 12px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
        .btn-primary:disabled { background: #555; }
        .btn-secondary { background: #475569; color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; }
        .status-box { padding: 15px; border-radius: 8px; margin-bottom: 15px; display: none; }
        .status-success { background: #14532d; color: #bbf7d0; border-left: 4px solid #22c55e; }
        .status-error { background: #7f1d1d; color: #fecaca; border-left: 4px solid #ef4444; }
        .back-btn { display: inline-block; margin-bottom: 20px; color: #94a3b8; text-decoration: none; }
        .back-btn:hover { color: #eab308; }
        .result-box { background: #1e293b; padding: 20px; border-radius: 12px; margin-top: 20px; display: none; }
        .result-value { font-size: 32px; color: #22c55e; font-weight: bold; text-align: center; margin: 10px 0; }
        .price-display { font-size: 24px; color: #22c55e; text-align: center; margin: 15px 0; }
    </style>
</head>
<body>
    <header>
        <div class="logo">🚗 AUTO-V Service Portal</div>
        <button onclick="logout()" style="background:#dc2626;color:white;padding:8px 16px;border:none;border-radius:8px;cursor:pointer;">Logout</button>
    </header>

    <div class="container">
        <a href="dashboard.html" class="back-btn">← Back to Dashboard</a>

        <div class="card">
            <h2 id="serviceTitle" style="color: #eab308;">Loading Service...</h2>
            <div id="serviceDescription" style="color: #94a3b8; margin-bottom: 20px;"></div>
            <div class="price-display" id="priceDisplay">KES 0</div>
        </div>

        <div id="statusMessage" class="status-box"></div>

        <div class="card">
            <form id="serviceForm">
                <div class="form-group">
                    <label>Vehicle Registration Number</label>
                    <input type="text" id="regNumber" placeholder="KCA 123A" required>
                </div>
                <div class="form-group">
                    <label>Make</label>
                    <input type="text" id="make" placeholder="Toyota" required>
                </div>
                <div class="form-group">
                    <label>Model</label>
                    <input type="text" id="model" placeholder="Axio" required>
                </div>
                <div class="form-group">
                    <label>Year</label>
                    <input type="number" id="year" placeholder="2020" required>
                </div>
                <div class="form-group">
                    <label>Purpose</label>
                    <select id="purpose">
                        <option value="Insurance">Insurance</option>
                        <option value="Sale">Sale</option>
                        <option value="Bank Loan">Bank Loan</option>
                        <option value="Transfer">Transfer</option>
                        <option value="Import">Import</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>M-Pesa Phone Number</label>
                    <input type="tel" id="phone" placeholder="0712345678" required>
                </div>
                <button type="submit" class="btn-primary" id="submitBtn">💳 Pay Now (KES 2,500)</button>
            </form>
        </div>

        <div class="result-box" id="resultBox">
            <h3 style="color: #eab308; margin-bottom: 15px;">Service Result</h3>
            <div id="resultContent"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://tsvejnzxrxrrecgquxbq.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzdmVqbnp4cnhycmVjZ3F1eGJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExODczNjgsImV4cCI6MjA5Njc2MzM2OH0.PCEppwafuPatBoWh4OnhzgHv6fA9uF5-bWW9mmf2VoQ";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const API_BASE = 'https://auto-v.onrender.com/api'; // Your backend URL

        const SERVICES = {
            'valuation': { name: 'Vehicle Valuation', fee: 2500 },
            'instant-value-check': { name: 'Instant Value Check', fee: 500 },
            'inspection': { name: 'Vehicle Inspection', fee: 3500 },
            'assessment': { name: 'Vehicle Assessment', fee: 3000 },
            'mileage-rate': { name: 'Mileage Rate Report', fee: 1500 },
            'fleet': { name: 'Fleet Services', fee: 4000 },
        };

        let serviceId = null;
        let serviceFee = 0;

        function getServiceFromUrl() {
            const params = new URLSearchParams(window.location.search);
            const s = params.get('service');
            return SERVICES[s] ? s : null;
        }

        function formatKES(amount) {
            return 'KES ' + Number(amount).toLocaleString('en-KE');
        }

        function showStatus(msg, type) {
            const box = document.getElementById('statusMessage');
            box.className = `status-box status-${type}`;
            box.textContent = msg;
            box.style.display = 'block';
            setTimeout(() => box.style.display = 'none', 5000);
        }

        async function init() {
            const { data: { user }, error } = await supabase.auth.getUser();
            if (error || !user) {
                window.location.href = 'login.html';
                return;
            }

            const s = getServiceFromUrl();
            if (!s) {
                document.getElementById('serviceTitle').textContent = 'Invalid Service';
                document.getElementById('submitBtn').disabled = true;
                return;
            }

            serviceId = s;
            serviceFee = SERVICES[s].fee;

            document.getElementById('serviceTitle').textContent = '💰 ' + SERVICES[s].name;
            document.getElementById('serviceDescription').textContent = 'Service Fee: ' + formatKES(serviceFee);
            document.getElementById('priceDisplay').textContent = formatKES(serviceFee);
            document.getElementById('submitBtn').textContent = `💳 Pay Now (${formatKES(serviceFee)})`;
        }

        document.getElementById('serviceForm').onsubmit = async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Processing...';

            const reg = document.getElementById('regNumber').value;
            const make = document.getElementById('make').value;
            const model = document.getElementById('model').value;
            const year = document.getElementById('year').value;
            const purpose = document.getElementById('purpose').value;
            const phone = document.getElementById('phone').value;

            try {
                const { data: { user }, error: authError } = await supabase.auth.getUser();
                if (authError || !user) {
                    showStatus('Please login again.', 'error');
                    window.location.href = 'login.html';
                    return;
                }

                // ✅ Backend-enforced security: The backend will use Supabase RLS to verify the user's role
                const response = await fetch(`${API_BASE}/mpesa/initiate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        phone: phone,
                        amount: serviceFee,
                        service: serviceId,
                        purpose: purpose,
                        reference: 'AUTO-' + Date.now().toString(36).toUpperCase(),
                        user_id: user.id,
                        vehicle: { reg, make, model, year }
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'Payment initiation failed');
                }

                showStatus('✅ Payment initiated! Check your phone for the M-Pesa STK Push.', 'success');
                btn.textContent = '✅ Waiting for confirmation...';
                
                // Poll for status using Realtime subscriptions or simple polling
                // For production, use Realtime subscription on the service_requests table
                // For simplicity, we will poll here
                const checkoutId = result.checkout_request_id;
                let attempts = 0;
                const interval = setInterval(async () => {
                    attempts++;
                    const statusRes = await fetch(`${API_BASE}/mpesa/status/${checkoutId}`);
                    const statusData = await statusRes.json();

                    if (statusData.status === 'completed') {
                        clearInterval(interval);
                        btn.textContent = '✅ Completed';
                        btn.disabled = true;
                        showStatus('✅ Payment confirmed! Generating result...', 'success');
                        displayResult(statusData.data);
                    } else if (attempts > 30) { // Timeout after 90 seconds (30 * 3s)
                        clearInterval(interval);
                        btn.textContent = '💳 Pay Now';
                        btn.disabled = false;
                        showStatus('⏰ Payment timed out. Please try again.', 'error');
                    }
                }, 3000);

            } catch (err) {
                showStatus('❌ Error: ' + err.message, 'error');
                btn.textContent = '💳 Pay Now';
                btn.disabled = false;
            }
        };

        function displayResult(data) {
            const box = document.getElementById('resultBox');
            const content = document.getElementById('resultContent');
            box.style.display = 'block';
            
            if (serviceId === 'valuation' || serviceId === 'instant-value-check') {
                content.innerHTML = `
                    <p><strong>Market Value:</strong> <span class="result-value">${formatKES(data.market_value)}</span></p>
                    <p><strong>Certificate:</strong> ${data.certificate_number}</p>
                    <p><strong>Condition:</strong> ${data.condition}</p>
                `;
            } else if (serviceId === 'inspection' || serviceId === 'assessment') {
                content.innerHTML = `
                    <p><strong>Overall Score:</strong> <span class="result-value">${data.overall_score}%</span></p>
                    <p><strong>Verdict:</strong> ${data.final_verdict}</p>
                    <p><strong>Certificate:</strong> ${data.certificate_number}</p>
                `;
            } else {
                content.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            }
        }

        async function logout() {
            await supabase.auth.signOut();
            localStorage.clear();
            sessionStorage.clear();
            window.location.href = 'login.html';
        }

        init();
    </script>
</body>
</html>
