<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTO-V | Customer Portal</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23eab308' rx='20'/%3E%3Ctext x='50' y='72' font-size='60' text-anchor='middle' fill='%23000'%3E🚗%3C/text%3E%3C/svg%3E">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="supabase.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #0b1120; color: white; min-height: 100vh; }
        header { display: flex; justify-content: space-between; padding: 15px 30px; background: #111827; border-bottom: 2px solid #eab308; }
        .logo { font-size: 24px; color: #eab308; font-weight: bold; }
        .container { max-width: 800px; margin: auto; padding: 24px; }
        .card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
        .step { display: none; animation: fadeIn 0.3s ease; }
        .step.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .progress-bar { display: flex; margin-bottom: 20px; background: #1e293b; border-radius: 40px; padding: 5px; }
        .progress-step { flex: 1; text-align: center; padding: 10px; border-radius: 40px; color: #94a3b8; font-size: 12px; font-weight: 600; }
        .progress-step.active { background: #eab308; color: #000; }
        .progress-step.completed { background: #22c55e; color: #000; }
        .form-group { margin-bottom: 15px; }
        label { display: block; color: #94a3b8; margin-bottom: 5px; font-weight: 600; }
        input, select { width: 100%; padding: 12px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: white; }
        input:focus { border-color: #eab308; outline: none; }
        .btn { padding: 12px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        .btn-primary { background: #eab308; color: black; }
        .btn-secondary { background: #475569; color: white; }
        .btn-success { background: #22c55e; color: white; }
        .btn-success:disabled { background: #555; cursor: not-allowed; }
        .nav-buttons { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; }
        .status-box { padding: 15px; border-radius: 8px; margin-bottom: 15px; display: none; }
        .status-success { background: #14532d; color: #bbf7d0; border-left: 4px solid #22c55e; }
        .status-error { background: #7f1d1d; color: #fecaca; border-left: 4px solid #ef4444; }
        .service-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .service-card { background: #1e293b; padding: 15px; border-radius: 8px; text-align: center; cursor: pointer; border: 2px solid transparent; transition: 0.3s; }
        .service-card:hover, .service-card.selected { border-color: #eab308; background: #2d3a4e; }
        .service-icon { font-size: 36px; display: block; margin-bottom: 5px; }
        .result-box { background: #1e293b; padding: 20px; border-radius: 12px; margin-top: 20px; display: none; }
        .result-value { font-size: 32px; color: #22c55e; font-weight: bold; text-align: center; }
        .logout-btn { background: #dc2626; color: white; padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <div class="logo">🚗 AUTO-V Portal</div>
        <button class="logout-btn" onclick="window.autoV.logout()">Logout</button>
    </header>

    <div class="container">
        <div class="progress-bar">
            <div class="progress-step active" id="step1Prog">1. Service</div>
            <div class="progress-step" id="step2Prog">2. Details</div>
            <div class="progress-step" id="step3Prog">3. Pay</div>
        </div>

        <!-- STEP 1: CHOOSE SERVICE -->
        <div id="step1" class="card step active">
            <h2>🔧 Choose Service</h2>
            <div class="service-cards" id="serviceCards"></div>
            <div id="selectedServiceMsg" style="text-align:center;margin-top:10px;color:#eab308;font-weight:500;"></div>
            <div class="nav-buttons">
                <button class="btn btn-secondary" onclick="window.location.href='dashboard.html'">← Dashboard</button>
                <button class="btn btn-primary" onclick="confirmService()">Next →</button>
            </div>
        </div>

        <!-- STEP 2: DETAILS (Adapts based on service) -->
        <div id="step2" class="card step">
            <h2 id="step2Title">📝 Enter Details</h2>
            <form id="detailsForm">
                <div class="form-group"><label>Registration Number</label><input type="text" id="regNumber" placeholder="KCA 123A" required></div>
                <div class="form-group"><label>Make</label><input type="text" id="make" placeholder="Toyota" required></div>
                <div class="form-group"><label>Model</label><input type="text" id="model" placeholder="Axio" required></div>
                <div class="form-group"><label>Year</label><input type="number" id="year" placeholder="2020" required></div>
                <div class="form-group" id="mileageGroup" style="display:none;"><label>Mileage (km)</label><input type="number" id="mileage" placeholder="50000"></div>
                <div class="form-group" id="conditionGroup" style="display:none;"><label>Condition</label><select id="condition"><option value="Excellent">Excellent</option><option value="Good" selected>Good</option><option value="Fair">Fair</option><option value="Poor">Poor</option></select></div>
                <div class="nav-buttons"><button type="button" class="btn btn-secondary" onclick="showStep(1)">← Back</button><button type="submit" class="btn btn-primary">Pay Now →</button></div>
            </form>
        </div>

        <!-- STEP 3: PAYMENT -->
        <div id="step3" class="card step">
            <h2>💳 Payment</h2>
            <div id="statusMessage" class="status-box"></div>
            <div class="payment-summary">
                <div class="row"><span class="label">Service</span><span class="value" id="summaryService">-</span></div>
                <div class="row"><span class="label">Vehicle</span><span class="value" id="summaryVehicle">-</span></div>
                <div class="row"><span class="label">Amount</span><span class="value" id="summaryAmount" style="font-size:24px;color:#22c55e;font-weight:bold;">KES 0</span></div>
            </div>
            <form id="paymentForm">
                <div class="form-group"><label>M-Pesa Phone Number</label><input type="tel" id="mpesaPhone" placeholder="0712345678" required></div>
                <div class="nav-buttons"><button class="btn btn-secondary" onclick="showStep(2)">← Back</button><button type="submit" class="btn btn-success" id="payBtn">💳 Pay Now</button></div>
            </form>
        </div>

        <div class="result-box" id="resultBox">
            <h3 style="color:#eab308;margin-bottom:15px;">Service Result</h3>
            <div id="resultContent"></div>
        </div>
    </div>

    <script>
        const client = window.autoV.supabase;
        let selectedService = null;
        let serviceFee = 0;
        let vehicleDetails = {};
        let feesChannel = null;

        // ─── Dynamic Fees from Supabase ──────────────────────────────
        const SERVICE_KEYS = {
            'instant-value-check': 'instant',
            'mileage-rate': 'mileage',
            'valuation': 'valuation',
            'inspection': 'inspection',
            'assessment': 'assessment',
            'fleet': 'fleet'
        };

        const SERVICE_PAGES = {
            'instant-value-check': 'instant-value.html',
            'mileage-rate': 'mileage.html',
            'valuation': 'valuation.html',
            'inspection': 'inspection.html',
            'assessment': 'assessment.html',
            'fleet': 'fleet.html'
        };

        async function loadFees() {
            const { data, error } = await client.from('system_fees').select('*');
            if (error) return;
            
            data.forEach(row => {
                const key = SERVICE_KEYS[row.service_type];
                if (key) SERVICE_FEES[row.service_type] = row.amount;
            });
            renderServices();
        }

        function subscribeToFees() {
            if (feesChannel) client.removeChannel(feesChannel);
            feesChannel = client.channel('system_fees_changes')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'system_fees' }, () => loadFees())
                .subscribe();
        }

        const SERVICE_FEES = {};

        function showStep(step) {
            ['step1', 'step2', 'step3'].forEach(id => document.getElementById(id).classList.remove('active'));
            ['step1Prog', 'step2Prog', 'step3Prog'].forEach(id => document.getElementById(id).classList.remove('active', 'completed'));
            document.getElementById(`step${step}`).classList.add('active');
            for(let i=1; i<step; i++) document.getElementById(`step${i}Prog`).classList.add('completed');
            document.getElementById(`step${step}Prog`).classList.add('active');
        }

        function renderServices() {
            const container = document.getElementById('serviceCards');
            container.innerHTML = Object.keys(SERVICE_FEES).map(key => `
                <div class="service-card" onclick="selectService('${key}')">
                    <span class="service-icon">${getIcon(key)}</span>
                    <h4>${formatName(key)}</h4>
                    <small style="color:#22c55e;">KES ${SERVICE_FEES[key].toLocaleString()}</small>
                </div>
            `).join('');
        }

        function selectService(key) {
            document.querySelectorAll('.service-card').forEach(c => c.classList.remove('selected'));
            document.querySelector(`.service-card[onclick="selectService('${key}')"]`).classList.add('selected');
            selectedService = key;
            serviceFee = SERVICE_FEES[key];
            document.getElementById('selectedServiceMsg').textContent = `✅ Selected: ${formatName(key)}`;
        }

        function confirmService() {
            if (!selectedService) return alert('Please select a service.');
            if (selectedService === 'instant-value-check') {
                window.location.href = SERVICE_PAGES[selectedService];
                return;
            }
            const mileageGroup = document.getElementById('mileageGroup');
            const conditionGroup = document.getElementById('conditionGroup');
            mileageGroup.style.display = 'none';
            conditionGroup.style.display = 'none';
            if (selectedService === 'mileage-rate' || selectedService === 'inspection') mileageGroup.style.display = 'block';
            if (selectedService === 'valuation' || selectedService === 'inspection' || selectedService === 'assessment') conditionGroup.style.display = 'block';
            document.getElementById('step2Title').textContent = `📝 ${formatName(selectedService)} Details`;
            showStep(2);
        }

        document.getElementById('detailsForm').onsubmit = function(e) {
            e.preventDefault();
            vehicleDetails = {
                reg: document.getElementById('regNumber').value,
                make: document.getElementById('make').value,
                model: document.getElementById('model').value,
                year: document.getElementById('year').value,
                mileage: document.getElementById('mileage').value || 0,
                condition: document.getElementById('condition').value || 'Good'
            };
            document.getElementById('summaryService').textContent = formatName(selectedService);
            document.getElementById('summaryVehicle').textContent = `${vehicleDetails.make} ${vehicleDetails.model} (${vehicleDetails.year})`;
            document.getElementById('summaryAmount').textContent = `KES ${serviceFee.toLocaleString()}`;
            showStep(3);
        };

        document.getElementById('paymentForm').onsubmit = async function(e) {
            e.preventDefault();
            const phone = document.getElementById('mpesaPhone').value.trim();
            const btn = document.getElementById('payBtn');
            const statusBox = document.getElementById('statusMessage');

            btn.disabled = true;
            btn.textContent = 'Processing...';
            statusBox.style.display = 'none';

            try {
                const { data: { user } } = await client.auth.getUser();
                if (!user) { alert('Please login again.'); window.location.href = 'login.html'; return; }

                const requestPayload = {
                    user_id: user.id,
                    service_type: selectedService,
                    amount: serviceFee,
                    phone: phone,
                    vehicle_reg: vehicleDetails.reg,
                    vehicle_make: vehicleDetails.make,
                    vehicle_model: vehicleDetails.model,
                    vehicle_year: parseInt(vehicleDetails.year),
                    payment_status: 'pending',
                    status: 'awaiting_payment'
                };

                if (selectedService === 'mileage-rate' || selectedService === 'inspection') requestPayload.vehicle_mileage = parseInt(vehicleDetails.mileage);
                if (selectedService === 'valuation' || selectedService === 'inspection' || selectedService === 'assessment') requestPayload.vehicle_condition = vehicleDetails.condition;

                const { data: request, error } = await client.from('service_requests').insert(requestPayload).select().single();
                if (error) throw error;

                setTimeout(async () => {
                    await client.from('service_requests').update({ payment_status: 'paid', status: 'completed' }).eq('id', request.id);
                    statusBox.className = 'status-box status-success';
                    statusBox.textContent = '✅ Payment successful! Redirecting to service page...';
                    statusBox.style.display = 'block';
                    btn.textContent = '✅ Completed';
                    btn.disabled = true;
                    
                    // ✅ REDIRECT TO THE ACTUAL SERVICE PAGE
                    setTimeout(() => {
                        const page = SERVICE_PAGES[selectedService] || 'valuation.html';
                        window.location.href = page;
                    }, 2000);
                    
                }, 3000);
            } catch (err) {
                statusBox.className = 'status-box status-error';
                statusBox.textContent = '❌ Error: ' + err.message;
                statusBox.style.display = 'block';
                btn.disabled = false;
                btn.textContent = '💳 Pay Now';
            }
        };

        function formatName(key) { return key.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase()); }
        function getIcon(key) { const icons = { 'instant-value-check': '💡', 'mileage-rate': '📏', 'valuation': '💰', 'inspection': '🔍', 'assessment': '⚠️', 'fleet': '🚛' }; return icons[key] || '📄'; }

        async function init() {
            const user = await window.autoV.requireAuth();
            if (!user) return;
            const role = await window.autoV.getUserRole(user.id);
            const ALLOWED_SERVICES = {
                'individual': ['instant-value-check', 'mileage-rate'],
                'corporate': ['instant-value-check', 'mileage-rate'],
                'valuer': ['valuation', 'inspection', 'assessment', 'fleet']
            };
            const allowed = ALLOWED_SERVICES[role] || [];
            Object.keys(SERVICE_FEES).forEach(key => { if (!allowed.includes(key)) delete SERVICE_FEES[key]; });
            await loadFees();
            subscribeToFees();
            renderServices();
            showStep(1);
        }
        init();
    </script>
</body>
</html>
