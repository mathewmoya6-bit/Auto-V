<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>AUTO-V | Admin Dashboard</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23eab308' rx='20'/%3E%3Ctext x='50' y='72' font-size='60' text-anchor='middle' fill='%23000'%3E🚗%3C/text%3E%3C/svg%3E">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js">
    </script>
    <script src="supabase.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ... your styles here ... */
    </style>
</head>
<body>
    <!-- ... your HTML here ... -->

    <script>
        // ─── USE SUPABASE FROM supabase.js ──────────────────────────
        // The 'supabase' variable is already declared in supabase.js
        // Do NOT redeclare it with 'const supabase = ...'
        
        // Instead, just use the existing variable
        // If supabase.js doesn't exist, fallback to direct initialization
        
        let supabaseClient;
        
        // Check if supabase is already defined (from supabase.js)
        if (typeof supabase !== 'undefined') {
            supabaseClient = supabase;
            console.log('✅ Using supabase from supabase.js');
        } else {
            // Fallback: initialize directly
            const SUPABASE_URL = "https://tsvejnzxrxrrecgquxbq.supabase.co";
            const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzdmVqbnp4cnhycmVjZ3F1eGJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExODczNjgsImV4cCI6MjA5Njc2MzM2OH0.PCEppwafuPatBoWh4OnhzgHv6fA9uF5-bWW9mmf2VoQ";
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            console.log('✅ Supabase initialized directly');
        }

        // ─── FUNCTIONS ──────────────────────────────────────────────

        function formatKES(amount) {
            if (amount === undefined || amount === null) return 'KES 0';
            return 'KES ' + Number(amount).toLocaleString('en-KE');
        }

        function getStatusBadge(status) {
            const map = {
                'completed': 'completed',
                'paid': 'paid',
                'pending': 'pending',
                'processing': 'processing',
                'failed': 'failed',
                'cancelled': 'cancelled',
                'active': 'active',
                'inactive': 'inactive'
            };
            return map[status] || 'pending';
        }

        function showToast(msg, type = 'success') {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        function hideLoading() {
            const overlay = document.getElementById('loadingOverlay');
            if (overlay) {
                overlay.style.opacity = '0';
                setTimeout(() => { overlay.style.display = 'none'; }, 500);
            }
        }

        // ─── LOAD STATS FROM SUPABASE ──────────────────────────────

        async function loadStats() {
            try {
                // Count users from profiles
                const { count: users, error: userError } = await supabaseClient
                    .from('profiles')
                    .select('*', { count: 'exact', head: true });

                if (userError) throw userError;

                // Count requests from service_requests
                const { count: requests, error: reqError } = await supabaseClient
                    .from('service_requests')
                    .select('*', { count: 'exact', head: true });

                if (reqError) throw reqError;

                // Get payments data
                const { data: payments, error: payError } = await supabaseClient
                    .from('payments')
                    .select('amount, status');

                if (payError) throw payError;

                const totalRevenue = payments?.reduce((s, p) => s + (p.amount || 0), 0) || 0;
                const pending = payments?.filter(p => p.status === 'pending').length || 0;

                document.getElementById('totalUsers').textContent = users || 0;
                document.getElementById('totalRequests').textContent = requests || 0;
                document.getElementById('totalRevenue').innerHTML = formatKES(totalRevenue);
                document.getElementById('pendingPayments').textContent = pending;

                return { users, requests, totalRevenue, pending };
            } catch (err) {
                console.error('Stats error:', err);
                showToast('Error loading stats: ' + err.message, 'error');
                return null;
            }
        }

        // ─── LOAD REQUESTS FROM SUPABASE ────────────────────────────

        async function loadRequests() {
            try {
                const { data, error } = await supabaseClient
                    .from('service_requests')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(50);

                if (error) throw error;

                if (data && data.length > 0) {
                    renderRequests(data);
                } else {
                    document.getElementById('requestsTableBody').innerHTML =
                        `<tr><td colspan="6" style="text-align:center;padding:40px;color:#64748b;">No requests found in Supabase</td></tr>`;
                }
            } catch (err) {
                console.error('Requests error:', err);
                document.getElementById('requestsTableBody').innerHTML =
                    `<tr><td colspan="6" style="text-align:center;padding:40px;color:#ef4444;">Error loading requests: ${err.message}</td></tr>`;
            }
        }

        function renderRequests(requests) {
            const tbody = document.getElementById('requestsTableBody');
            if (!requests || requests.length === 0) {
                tbody.innerHTML =
                    `<tr><td colspan="6" style="text-align:center;padding:40px;color:#64748b;">No requests found</td></tr>`;
                return;
            }

            tbody.innerHTML = requests.slice(0, 20).map(r => {
                const status = r.status || 'pending';
                const badge = getStatusBadge(status);
                const user = r.customer_name || r.user_profiles?.full_name || 'Unknown';
                const service = r.service_type || 'N/A';
                const amount = r.amount || 0;
                const date = r.created_at ? new Date(r.created_at).toLocaleDateString() : 'N/A';
                const id = r.id ? r.id.slice(0, 8) : 'N/A';

                return `<tr>
                    <td style="color:#eab308;font-weight:600;">#${id}</td>
                    <td>${user}</td>
                    <td>${service}</td>
                    <td style="font-weight:600;">${formatKES(amount)}</td>
                    <td><span class="badge badge-${badge}">${status.charAt(0).toUpperCase() + status.slice(1)}</span></td>
                    <td style="font-size:12px;color:#64748b;">${date}</td>
                </tr>`;
            }).join('');
        }

        // ─── LOAD USERS FROM SUPABASE ───────────────────────────────

        async function loadUsers() {
            try {
                const { data, error } = await supabaseClient
                    .from('profiles')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (data && data.length > 0) {
                    renderUsers(data);
                } else {
                    document.getElementById('usersTableBody').innerHTML =
                        `<tr><td colspan="4" style="text-align:center;padding:40px;color:#64748b;">No users found in Supabase</td></tr>`;
                }
            } catch (err) {
                console.error('Users error:', err);
                document.getElementById('usersTableBody').innerHTML =
                    `<tr><td colspan="4" style="text-align:center;padding:40px;color:#ef4444;">Error loading users: ${err.message}</td></tr>`;
            }
        }

        function renderUsers(users) {
            const tbody = document.getElementById('usersTableBody');
            if (!users || users.length === 0) {
                tbody.innerHTML =
                    `<tr><td colspan="4" style="text-align:center;padding:40px;color:#64748b;">No users found</td></tr>`;
                return;
            }

            tbody.innerHTML = users.slice(0, 20).map(u => {
                const name = u.full_name || 'Unknown';
                const email = u.email || 'N/A';
                const role = u.user_role || 'user';
                const joined = u.created_at ? new Date(u.created_at).toLocaleDateString() : 'N/A';

                return `<tr>
                    <td><div style="display:flex;align-items:center;gap:8px;"><div style="width:30px;height:30px;border-radius:50%;background:#eab308;display:flex;align-items:center;justify-content:center;color:#000;font-weight:600;font-size:12px;">${name[0]}</div> ${name}</div></td>
                    <td style="color:#94a3b8;font-size:13px;">${email}</td>
                    <td><span class="badge ${role === 'admin' ? 'badge-paid' : role === 'inspector' ? 'badge-processing' : ''}">${role}</span></td>
                    <td style="font-size:12px;color:#64748b;">${joined}</td>
                </tr>`;
            }).join('');
        }

        // ─── LOAD PAYMENTS FROM SUPABASE ─────────────────────────────

        async function loadPayments() {
            try {
                const { data, error } = await supabaseClient
                    .from('payments')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(50);

                if (error) throw error;

                if (data && data.length > 0) {
                    renderPayments(data);
                } else {
                    document.getElementById('paymentsTableBody').innerHTML =
                        `<tr><td colspan="5" style="text-align:center;padding:40px;color:#64748b;">No payments found in Supabase</td></tr>`;
                }
            } catch (err) {
                console.error('Payments error:', err);
                document.getElementById('paymentsTableBody').innerHTML =
                    `<tr><td colspan="5" style="text-align:center;padding:40px;color:#ef4444;">Error loading payments: ${err.message}</td></tr>`;
            }
        }

        function renderPayments(payments) {
            const tbody = document.getElementById('paymentsTableBody');
            if (!payments || payments.length === 0) {
                tbody.innerHTML =
                    `<tr><td colspan="5" style="text-align:center;padding:40px;color:#64748b;">No payments found</td></tr>`;
                return;
            }

            tbody.innerHTML = payments.slice(0, 20).map(p => {
                const status = p.status || 'pending';
                const badge = getStatusBadge(status);
                const user = p.user_profiles?.full_name || p.user || 'Unknown';
                const amount = p.amount || 0;
                const method = p.payment_method || 'M-Pesa';
                const date = p.created_at ? new Date(p.created_at).toLocaleDateString() : 'N/A';

                return `<tr>
                    <td>${user}</td>
                    <td style="font-weight:600;color:#22c55e;">${formatKES(amount)}</td>
                    <td style="color:#94a3b8;">${method}</td>
                    <td><span class="badge badge-${badge}">${status.charAt(0).toUpperCase() + status.slice(1)}</span></td>
                    <td style="font-size:12px;color:#64748b;">${date}</td>
                </tr>`;
            }).join('');
        }

        // ─── LOAD FUEL PRICES FROM SUPABASE ─────────────────────────

        async function loadFuelPrices() {
            try {
                const { data, error } = await supabaseClient
                    .from('fuel_prices')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(1);

                if (error) throw error;

                if (data && data.length > 0) {
                    const prices = data[0];
                    document.getElementById('fuelPetrol').value = prices.petrol || 214.03;
                    document.getElementById('fuelDiesel').value = prices.diesel || 222.86;
                    document.getElementById('fuelHybrid').value = prices.hybrid || 214.03;
                    document.getElementById('fuelLpg').value = prices.lpg || 120.00;
                    document.getElementById('fuelElectric').value = prices.electric || 20.00;

                    // Update active display
                    document.getElementById('activePetrol').textContent = `KES ${(prices.petrol || 214.03).toFixed(2)}/L`;
                    document.getElementById('activeDiesel').textContent = `KES ${(prices.diesel || 222.86).toFixed(2)}/L`;
                    document.getElementById('activeHybrid').textContent = `KES ${(prices.hybrid || 214.03).toFixed(2)}/L`;
                    document.getElementById('activeLpg').textContent = `KES ${(prices.lpg || 120.00).toFixed(2)}/kg`;
                    document.getElementById('activeElectric').textContent = `KES ${(prices.electric || 20.00).toFixed(2)}/kWh`;

                    // Update analytics
                    document.getElementById('analyticsPetrol').textContent = `KES ${(prices.petrol || 214.03).toFixed(2)}/L`;
                    document.getElementById('analyticsDiesel').textContent = `KES ${(prices.diesel || 222.86).toFixed(2)}/L`;

                    const updateDate = prices.updated_at ? new Date(prices.updated_at) : new Date();
                    document.getElementById('lastUpdateDisplay').textContent = updateDate.toLocaleString();

                    return prices;
                } else {
                    // No data - use defaults
                    const defaults = { petrol: 214.03, diesel: 222.86, hybrid: 214.03, lpg: 120.00, electric: 20.00 };
                    document.getElementById('fuelPetrol').value = defaults.petrol;
                    document.getElementById('fuelDiesel').value = defaults.diesel;
                    document.getElementById('fuelHybrid').value = defaults.hybrid;
                    document.getElementById('fuelLpg').value = defaults.lpg;
                    document.getElementById('fuelElectric').value = defaults.electric;

                    document.getElementById('activePetrol').textContent = `KES ${defaults.petrol.toFixed(2)}/L`;
                    document.getElementById('activeDiesel').textContent = `KES ${defaults.diesel.toFixed(2)}/L`;
                    document.getElementById('activeHybrid').textContent = `KES ${defaults.hybrid.toFixed(2)}/L`;
                    document.getElementById('activeLpg').textContent = `KES ${defaults.lpg.toFixed(2)}/kg`;
                    document.getElementById('activeElectric').textContent = `KES ${defaults.electric.toFixed(2)}/kWh`;

                    document.getElementById('analyticsPetrol').textContent = `KES ${defaults.petrol.toFixed(2)}/L`;
                    document.getElementById('analyticsDiesel').textContent = `KES ${defaults.diesel.toFixed(2)}/L`;

                    return defaults;
                }
            } catch (err) {
                console.error('Fuel prices error:', err);
                showToast('Error loading fuel prices: ' + err.message, 'error');
                return null;
            }
        }

        // ─── SAVE FUEL PRICES TO SUPABASE ───────────────────────────

        async function saveFuelPrices() {
            const prices = {
                petrol: parseFloat(document.getElementById('fuelPetrol').value) || 214.03,
                diesel: parseFloat(document.getElementById('fuelDiesel').value) || 222.86,
                hybrid: parseFloat(document.getElementById('fuelHybrid').value) || 214.03,
                lpg: parseFloat(document.getElementById('fuelLpg').value) || 120.00,
                electric: parseFloat(document.getElementById('fuelElectric').value) || 20.00,
                updated_at: new Date().toISOString()
            };

            const statusEl = document.getElementById('fuelUpdateStatus');

            try {
                // Check if record exists
                const { data: existing, error: checkError } = await supabaseClient
                    .from('fuel_prices')
                    .select('id')
                    .limit(1);

                if (checkError) throw checkError;

                let result;
                if (existing && existing.length > 0) {
                    // Update existing
                    const { data, error } = await supabaseClient
                        .from('fuel_prices')
                        .update(prices)
                        .eq('id', existing[0].id)
                        .select()
                        .single();

                    if (error) throw error;
                    result = data;
                } else {
                    // Insert new
                    const { data, error } = await supabaseClient
                        .from('fuel_prices')
                        .insert([prices])
                        .select()
                        .single();

                    if (error) throw error;
                    result = data;
                }

                // Update display
                document.getElementById('activePetrol').textContent = `KES ${(result.petrol || 214.03).toFixed(2)}/L`;
                document.getElementById('activeDiesel').textContent = `KES ${(result.diesel || 222.86).toFixed(2)}/L`;
                document.getElementById('activeHybrid').textContent = `KES ${(result.hybrid || 214.03).toFixed(2)}/L`;
                document.getElementById('activeLpg').textContent = `KES ${(result.lpg || 120.00).toFixed(2)}/kg`;
                document.getElementById('activeElectric').textContent = `KES ${(result.electric || 20.00).toFixed(2)}/kWh`;

                document.getElementById('analyticsPetrol').textContent = `KES ${(result.petrol || 214.03).toFixed(2)}/L`;
                document.getElementById('analyticsDiesel').textContent = `KES ${(result.diesel || 222.86).toFixed(2)}/L`;

                document.getElementById('lastUpdateDisplay').textContent = new Date().toLocaleString();

                statusEl.style.display = 'block';
                statusEl.style.color = '#22c55e';
                statusEl.textContent = '✅ Fuel prices saved to Supabase! All users updated.';
                setTimeout(() => { statusEl.style.display = 'none'; }, 4000);

                showToast('✅ Fuel prices saved to Supabase!', 'success');
            } catch (err) {
                statusEl.style.display = 'block';
                statusEl.style.color = '#ef4444';
                statusEl.textContent = '❌ Error: ' + err.message;
                showToast('❌ Failed to save fuel prices: ' + err.message, 'error');
                console.error('Save error:', err);
            }
        }

        // ─── LOAD VEHICLE STATS ──────────────────────────────────────

        async function loadVehicleStats() {
            try {
                // Count makes
                const { count: makes, error: makeError } = await supabaseClient
                    .from('vehicle_makes')
                    .select('*', { count: 'exact', head: true });

                if (makeError) throw makeError;

                // Count models
                const { count: models, error: modelError } = await supabaseClient
                    .from('vehicle_models')
                    .select('*', { count: 'exact', head: true });

                if (modelError) throw modelError;

                document.getElementById('totalMakes').textContent = makes || 0;
                document.getElementById('totalModels').textContent = models || 0;
            } catch (err) {
                console.error('Vehicle stats error:', err);
                document.getElementById('totalMakes').textContent = '—';
                document.getElementById('totalModels').textContent = '—';
            }
        }

        // ─── TABS ──────────────────────────────────────────────────────

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
                document.getElementById(`tab-${this.dataset.tab}`).classList.add('active');
            });
        });

        // ─── LOGOUT ────────────────────────────────────────────────────

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            window.location.href = 'admin-login.html';
        });

        // ─── CHARTS ────────────────────────────────────────────────────

        function initCharts() {
            try {
                const ctx1 = document.getElementById('revenueChart').getContext('2d');
                new Chart(ctx1, {
                    type: 'line',
                    data: {
                        labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
                        datasets: [{ label: 'Revenue', data: [1250000, 1420000, 1580000, 1750000, 1920000, 2080000],
                            borderColor: '#eab308', backgroundColor: 'rgba(234,179,8,0.08)', fill: true,
                            tension: 0.4, pointBackgroundColor: '#eab308' }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
                        scales: { x: { grid: { color: 'rgba(255,255,255,0.03)' }, ticks: { color: '#94a3b8' } },
                            y: { grid: { color: 'rgba(255,255,255,0.03)' }, ticks: { color: '#94a3b8' } } } }
                });

                const ctx2 = document.getElementById('serviceChart').getContext('2d');
                new Chart(ctx2, {
                    type: 'doughnut',
                    data: {
                        labels: ['Valuation', 'Inspection', 'Instant', 'Fleet', 'Mileage'],
                        datasets: [{ data: [28, 22, 18, 14, 10], backgroundColor: ['#eab308', '#22c55e',
                                '#3b82f6', '#f59e0b', '#8b5cf6'
                            ], borderColor: '#0a0c15', borderWidth: 2 }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom',
                                labels: { color: '#94a3b8', padding: 12, usePointStyle: true } } },
                        cutout: '65%' }
                });
            } catch (err) {
                console.warn('Chart error:', err);
            }
        }

        // ─── MAKE FUNCTIONS GLOBAL ──────────────────────────────────

        window.saveFuelPrices = saveFuelPrices;
        window.loadFuelPrices = loadFuelPrices;

        // ─── INIT ─────────────────────────────────────────────────────

        async function init() {
            console.log('🚀 Initializing Admin Dashboard with Supabase as Single Source of Truth...');

            try {
                // Check auth
                const { data: { user } } = await supabaseClient.auth.getUser();
                if (!user) {
                    window.location.href = 'admin-login.html';
                    return;
                }

                document.getElementById('userAvatar').textContent = (user.email || 'A')[0].toUpperCase();
                document.getElementById('userEmail').textContent = user.email;

                // Load all data from Supabase
                await Promise.all([
                    loadStats(),
                    loadRequests(),
                    loadUsers(),
                    loadPayments(),
                    loadFuelPrices(),
                    loadVehicleStats()
                ]);

                // Initialize charts
                initCharts();

                // Hide loading
                hideLoading();

                console.log('✅ Admin Dashboard ready - Supabase is the Single Source of Truth');
                showToast('✅ Data loaded from Supabase', 'success');
            } catch (err) {
                console.error('Init error:', err);
                hideLoading();
                showToast('Error initializing dashboard: ' + err.message, 'error');
            }
        }

        // Start
        document.addEventListener('DOMContentLoaded', init);

        // Auto-refresh stats every 60 seconds
        setInterval(() => {
            loadStats();
            loadRequests();
            loadUsers();
            loadPayments();
        }, 60000);
    </script>
</body>
</html>
