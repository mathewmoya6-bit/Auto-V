<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>AUTO-V | Admin Login</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23eab308' rx='20'/%3E%3Ctext x='50' y='72' font-size='60' text-anchor='middle' fill='%23000'%3E🚗%3C/text%3E%3C/svg%3E">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="supabase.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ─── RESET & BASE ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #0a0c15;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* ─── AMBIENT BACKGROUND ─── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(234, 179, 8, 0.07) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(234, 179, 8, 0.05) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(34, 197, 94, 0.04) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .glow-orb {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(234, 179, 8, 0.06), transparent 70%);
            top: -200px;
            right: -200px;
            pointer-events: none;
            animation: floatGlow 20s ease-in-out infinite alternate;
            z-index: 0;
        }

        .glow-orb-bottom {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(34, 197, 94, 0.04), transparent 70%);
            bottom: -150px;
            left: -150px;
            pointer-events: none;
            animation: floatGlow 25s ease-in-out infinite alternate-reverse;
            z-index: 0;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 30px) scale(1.2); }
        }

        .login-container {
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 48px 40px 36px;
            width: 100%;
            max-width: 440px;
            border: 1px solid rgba(234, 179, 8, 0.15);
            box-shadow:
                0 25px 60px -12px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.03);
            position: relative;
            z-index: 1;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-container:hover {
            box-shadow:
                0 30px 70px -12px rgba(0, 0, 0, 0.7),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .logo { text-align: center; margin-bottom: 32px; }

        .logo-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 8px;
            filter: drop-shadow(0 4px 12px rgba(234, 179, 8, 0.2));
        }

        .logo h1 {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #eab308, #facc15);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .logo .subtitle { color: #94a3b8; font-size: 14px; font-weight: 400; margin-top: 4px; }

        .admin-badge {
            display: inline-block;
            background: rgba(234, 179, 8, 0.15);
            color: #eab308;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            margin-top: 10px;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            border: 1px solid rgba(234, 179, 8, 0.15);
        }

        .message {
            padding: 14px 18px;
            border-radius: 14px;
            margin-bottom: 24px;
            display: none;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            animation: slideDown 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .error-message {
            background: rgba(127, 29, 29, 0.8);
            color: #fecaca;
            border-left: 4px solid #ef4444;
            backdrop-filter: blur(4px);
        }

        .success-message {
            background: rgba(20, 83, 45, 0.8);
            color: #bbf7d0;
            border-left: 4px solid #22c55e;
            backdrop-filter: blur(4px);
        }

        .info-message {
            background: rgba(30, 41, 59, 0.8);
            color: #fcd34d;
            border-left: 4px solid #eab308;
            backdrop-filter: blur(4px);
        }

        .form-group { margin-bottom: 20px; }

        label {
            display: block;
            margin-bottom: 6px;
            color: #94a3b8;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .input-wrapper { position: relative; }

        .input-wrapper input {
            width: 100%;
            padding: 14px 18px;
            background: #0a0f1c;
            border: 2px solid #1e293b;
            border-radius: 14px;
            color: #f1f5f9;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: #eab308;
            box-shadow: 0 0 0 4px rgba(234, 179, 8, 0.1);
            background: #0f172a;
        }

        .input-wrapper input::placeholder { color: #475569; font-weight: 400; }

        .input-wrapper input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 1000px #0a0f1c inset !important;
            -webkit-text-fill-color: #f1f5f9 !important;
            border-color: #2d3a4e;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #eab308, #facc15);
            color: #0a0c15;
            border: none;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            margin-top: 8px;
            font-family: inherit;
            position: relative;
            overflow: hidden;
        }

        .login-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 40%, rgba(255, 255, 255, 0.15) 100%);
            pointer-events: none;
        }

        .login-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px -8px rgba(234, 179, 8, 0.35);
        }

        .login-btn:active:not(:disabled) { transform: translateY(0px) scale(0.98); }

        .login-btn:disabled {
            background: #334155;
            color: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .login-btn .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(10, 12, 21, 0.2);
            border-radius: 50%;
            border-top-color: #0a0c15;
            animation: spin 0.6s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .footer-links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #1e293b;
            flex-wrap: wrap;
            gap: 12px;
        }

        .footer-links a { color: #64748b; text-decoration: none; font-size: 13px; transition: color 0.2s; }
        .footer-links a:hover { color: #eab308; }

        .mpesa-info {
            text-align: center;
            padding-top: 18px;
            font-size: 11px;
            color: #475569;
            line-height: 1.7;
        }

        .mpesa-info strong { color: #22c55e; font-size: 13px; }
        .mpesa-info .highlight { color: #eab308; }

        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 11px;
            color: #475569;
            margin-top: 14px;
        }

        .security-badge svg { width: 14px; height: 14px; fill: #22c55e; }

        @media (max-width: 480px) {
            .login-container { padding: 32px 20px 28px; border-radius: 24px; margin: 12px; }
            .logo h1 { font-size: 26px; }
            .logo-icon { font-size: 38px; }
            .input-wrapper input { padding: 13px 16px; font-size: 14px; }
            .login-btn { padding: 14px; font-size: 15px; }
            .footer-links { flex-direction: column; text-align: center; }
        }

        @media (max-width: 380px) {
            .login-container { padding: 24px 16px 20px; }
            .logo h1 { font-size: 22px; }
        }
    </style>
</head>
<body>

    <div class="glow-orb"></div>
    <div class="glow-orb-bottom"></div>

    <div class="login-container" role="main" aria-label="Admin Login">

        <div class="logo">
            <span class="logo-icon">🚗</span>
            <h1>AUTO‑V</h1>
            <p class="subtitle">Administrator Portal</p>
            <span class="admin-badge">🔒 Admin Access</span>
        </div>

        <div id="messageBox" class="message" role="alert" aria-live="polite"></div>

        <form id="loginForm" autocomplete="off" novalidate>
            <div class="form-group">
                <label for="email">📧 Email Address</label>
                <div class="input-wrapper">
                    <input type="email" id="email" placeholder="admin@autov.co.ke" autocomplete="email" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">🔒 Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
                </div>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                Admin Login
            </button>
        </form>

        <div class="footer-links">
            <a href="login.html">← User Login</a>
            <a href="#" onclick="event.preventDefault(); showMessage('Contact support@autov.co.ke for access.', 'info');">Need Help?</a>
        </div>

        <div class="mpesa-info">
            💳 M‑Pesa Paybill: <strong>4095377</strong> &nbsp;|&nbsp; Account: <strong>AUTO‑V</strong><br>
            <span style="font-size:10px;">Valuations: <span class="highlight">KES 2,500</span> &nbsp;·&nbsp; Inspections: <span class="highlight">KES 3,500</span></span>
        </div>

        <div class="security-badge">
            <svg viewBox="0 0 24 24"><path d="M12 1C8.676 1 5.5 2.5 3.5 4.5 2 6 1 8.5 1 11c0 6 4.5 11 11 12 6.5-1 11-6 11-12 0-2.5-1-5-2.5-6.5C18.5 2.5 15.324 1 12 1zm0 19c-4.5-1-8-4.5-9-9 0-2 1-4 2-5 1.5-1.5 4-2.5 7-2.5s5.5 1 7 2.5c1 1 2 3 2 5-1 4.5-4.5 8-9 9zm0-14c-1.5 0-2.5 1-2.5 2.5S10.5 11 12 11s2.5-1 2.5-2.5S13.5 6 12 6zm0 8c-2 0-3.5 1.5-3.5 3.5h7c0-2-1.5-3.5-3.5-3.5z"/></svg>
            <span>256‑bit SSL · Secure Login</span>
        </div>
    </div>

    <script>
        // ================================================================
        // AUTO-V ADMIN LOGIN — PRODUCTION SECURE VERSION (fixed)
        // ================================================================

        (function() {
            // ─── SUPABASE CLIENT ─────────────────────────────────────────
            // FIX: previously this fell into `supabaseJs.createClient(...)`
            // on failure — `supabaseJs` was never defined anywhere, so that
            // branch always threw, and the catch block just retried the
            // exact same failing call. Now: reuse the shared client from
            // supabase.js (window.autoV.supabase) when it's ready, since
            // that's the single source of truth for the rest of the app;
            // otherwise create one directly from the CDN global with no
            // undefined fallback path.
            const SUPABASE_URL = "https://tsvejnzxrxrrecgquxbq.supabase.co";
            const SUPABASE_ANON_KEY =
                "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzdmVqbnp4cnhycmVjZ3F1eGJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExODczNjgsImV4cCI6MjA5Njc2MzM2OH0.PCEppwafuPatBoWh4OnhzgHv6fA9uF5-bWW9mmf2VoQ";

            let supabase = null;
            if (window.autoV && window.autoV.supabase) {
                supabase = window.autoV.supabase;
            } else if (window.supabase && typeof window.supabase.createClient === 'function') {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }

            const ADMIN_DASHBOARD = 'admin-dashboard.html';

            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            const messageBox = document.getElementById('messageBox');
            const loginForm = document.getElementById('loginForm');

            if (!supabase) {
                // Both the shared client and the CDN global failed to
                // materialize — surface this clearly instead of letting
                // every subsequent call throw a cryptic "Cannot read
                // properties of null" error.
                showMessage('⚠️ Could not connect to authentication service. Please refresh the page.', 'error');
                loginBtn.disabled = true;
            }

            function showMessage(text, type = 'error') {
                messageBox.textContent = text;
                messageBox.className = 'message ' + type + '-message';
                messageBox.style.display = 'block';
                clearTimeout(window._msgTimer);
                window._msgTimer = setTimeout(() => {
                    messageBox.style.display = 'none';
                }, 5000);
            }

            function clearMessage() {
                messageBox.style.display = 'none';
                clearTimeout(window._msgTimer);
            }

            function isValidEmail(email) {
                return /^[^\s@]+@([^\s@.,]+\.)+[^\s@.,]{2,}$/.test(email);
            }

            function isAdminRole(role) {
                if (!role) return false;
                return String(role).toLowerCase().trim() === 'admin';
            }

            function setLoading(state) {
                loginBtn.disabled = state;
                loginBtn.innerHTML = state ?
                    '<span class="spinner"></span> Authenticating...' :
                    'Admin Login';
            }

            async function verifyAdminRole(userId) {
                try {
                    const { data, error } = await supabase
                        .from('user_profiles')
                        .select('id, email, role')
                        .eq('id', userId)
                        .single();

                    if (error) {
                        console.error('Admin verification error:', error.message);
                        return { isAdmin: false, profile: null, error };
                    }

                    if (!data) {
                        return { isAdmin: false, profile: null, error: null };
                    }

                    return { isAdmin: isAdminRole(data.role), profile: data, error: null };

                } catch (err) {
                    console.error('Admin verification exception:', err);
                    return { isAdmin: false, profile: null, error: err };
                }
            }

            function redirectToAdmin() {
                window.location.href = ADMIN_DASHBOARD;
            }

            async function handleLogin(e) {
                e.preventDefault();
                clearMessage();

                if (!supabase) {
                    showMessage('⚠️ Authentication service unavailable. Please refresh the page.', 'error');
                    return;
                }

                const email = emailInput.value.trim();
                const password = passwordInput.value;

                if (!email || !password) {
                    showMessage('Please enter both email and password.', 'error');
                    if (!email) emailInput.focus();
                    else passwordInput.focus();
                    return;
                }

                if (!isValidEmail(email)) {
                    showMessage('Please enter a valid email address.', 'error');
                    emailInput.focus();
                    return;
                }

                setLoading(true);

                try {
                    const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
                        email,
                        password
                    });

                    if (authError) {
                        console.warn('Auth error:', authError.message);
                        if (authError.message === 'Invalid login credentials') {
                            showMessage('❌ Invalid email or password. Please try again.', 'error');
                        } else if (authError.message.toLowerCase().includes('email not confirmed')) {
                            showMessage('📧 Please verify your email address before logging in.', 'info');
                        } else {
                            showMessage('Login failed: ' + authError.message, 'error');
                        }
                        setLoading(false);
                        return;
                    }

                    if (!authData || !authData.user) {
                        showMessage('Login failed. Please try again.', 'error');
                        setLoading(false);
                        return;
                    }

                    const user = authData.user;
                    console.log('✅ Authenticated:', user.email);

                    const { isAdmin, profile, error } = await verifyAdminRole(user.id);

                    if (error) {
                        console.error('Verification error:', error);
                        showMessage('Error verifying admin privileges. Please contact support.', 'error');
                        await supabase.auth.signOut();
                        setLoading(false);
                        return;
                    }

                    if (!isAdmin) {
                        console.warn('⛔ Access denied for:', user.email, 'Role:', profile?.role);
                        showMessage('⛔ Access denied. Admin privileges required.', 'error');
                        await supabase.auth.signOut();
                        setLoading(false);
                        return;
                    }

                    localStorage.setItem('autoV_admin', JSON.stringify({
                        id: user.id,
                        email: user.email,
                        role: profile.role,
                        isAdmin: true,
                        verifiedAt: new Date().toISOString()
                    }));

                    showMessage('✅ Login successful! Redirecting to dashboard...', 'success');

                    setTimeout(() => {
                        redirectToAdmin();
                    }, 1200);

                } catch (err) {
                    console.error('Login error:', err);
                    showMessage('Network error. Please check your connection.', 'error');
                    setLoading(false);
                } finally {
                    if (loginBtn.disabled && !loginBtn.textContent.includes('Redirecting')) {
                        setLoading(false);
                    }
                }
            }

            async function checkExistingSession() {
                if (!supabase) return;
                try {
                    const { data: { session }, error } = await supabase.auth.getSession();

                    if (error) {
                        console.warn('Session check error:', error.message);
                        return;
                    }

                    if (session && session.user) {
                        console.log('🔍 Active session:', session.user.email);

                        const { isAdmin, profile } = await verifyAdminRole(session.user.id);

                        if (isAdmin) {
                            localStorage.setItem('autoV_admin', JSON.stringify({
                                id: session.user.id,
                                email: session.user.email,
                                role: profile?.role,
                                isAdmin: true,
                                verifiedAt: new Date().toISOString()
                            }));
                            console.log('✅ Admin verified — redirecting');
                            redirectToAdmin();
                        } else {
                            console.log('👤 User is not admin — staying on login');
                            localStorage.removeItem('autoV_admin');
                            emailInput.value = session.user.email;
                        }
                    } else {
                        localStorage.removeItem('autoV_admin');
                    }
                } catch (err) {
                    console.warn('Session check error:', err);
                }
            }

            loginForm.addEventListener('submit', handleLogin);
            emailInput.addEventListener('focus', clearMessage);
            passwordInput.addEventListener('focus', clearMessage);

            setTimeout(() => emailInput.focus(), 150);
            checkExistingSession();

            console.log('🚀 AUTO-V Admin Login (secure, fixed client init)');
            console.log('📌 Dashboard:', ADMIN_DASHBOARD);
        })();
    </script>
</body>
</html>
