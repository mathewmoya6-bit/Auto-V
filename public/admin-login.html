<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>AUTO-V | Admin Login</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23eab308' rx='20'/%3E%3Ctext x='50' y='72' font-size='60' text-anchor='middle' fill='%23000'%3E🚗%3C/text%3E%3C/svg%3E">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(234,179,8,0.06) 0%, transparent 70%);
            animation: rotate 40s linear infinite;
            pointer-events: none;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .login-container {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 48px 40px;
            width: 100%;
            max-width: 460px;
            border: 1px solid rgba(234, 179, 8, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 1;
        }
        .logo { text-align: center; margin-bottom: 32px; }
        .logo h1 {
            font-size: 36px;
            background: linear-gradient(135deg, #eab308, #facc15);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 800;
        }
        .logo p { 
            color: #94a3b8; 
            font-size: 14px; 
            margin-top: 5px;
        }
        .admin-badge {
            display: inline-block;
            background: #dc2626;
            color: #fff;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            margin-top: 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .form-group { margin-bottom: 24px; }
        label { 
            display: block; 
            margin-bottom: 8px; 
            color: #cbd5e1; 
            font-weight: 600; 
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input {
            width: 100%;
            padding: 14px 18px;
            background: #0a0f1c;
            border: 2px solid #2d3a4e;
            border-radius: 16px;
            color: white;
            font-size: 15px;
            transition: all 0.3s;
            font-family: inherit;
        }
        input:focus {
            outline: none;
            border-color: #eab308;
            box-shadow: 0 0 0 4px rgba(234, 179, 8, 0.15);
        }
        input::placeholder { color: #475569; }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #eab308, #facc15);
            color: #0a0c15;
            border: none;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
            font-family: inherit;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(234, 179, 8, 0.3);
        }
        button:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .message {
            padding: 14px 18px;
            border-radius: 16px;
            margin-bottom: 24px;
            display: none;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            animation: slideDown 0.3s ease;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .error-message { background: #7f1d1d; color: #fecaca; border-left: 4px solid #ef4444; }
        .success-message { background: #14532d; color: #bbf7d0; border-left: 4px solid #22c55e; }
        .info-message { background: #1e293b; color: #eab308; border-left: 4px solid #eab308; }
        .back-link { text-align: center; margin-top: 20px; }
        .back-link a { color: #64748b; text-decoration: none; font-size: 13px; transition: all 0.2s; }
        .back-link a:hover { color: #eab308; text-decoration: underline; }
        .mpesa-badge {
            text-align: center;
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid #1e293b;
            font-size: 11px;
            color: #64748b;
        }
        .mpesa-badge strong { color: #22c55e; font-size: 13px; }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid #fff;
            border-radius: 50%;
            border-top-color: #eab308;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .admin-icon { font-size: 48px; display: block; margin-bottom: 10px; }
        @media (max-width: 480px) {
            .login-container { padding: 32px 24px; margin: 16px; }
            .logo h1 { font-size: 28px; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <div class="admin-icon">🔐</div>
            <h1>🚗 AUTO-V</h1>
            <p>Administrator Portal</p>
            <span class="admin-badge">🔒 Admin Access</span>
        </div>
        
        <div id="messageBox" class="message"></div>
        
        <form id="loginForm" autocomplete="off">
            <div class="form-group">
                <label>📧 Email Address</label>
                <input type="email" id="email" placeholder="admin@autov.co.ke" autocomplete="email" required>
            </div>
            
            <div class="form-group">
                <label>🔒 Password</label>
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
            </div>
            
            <button type="submit" id="loginBtn">Admin Login</button>
        </form>
        
        <div class="back-link">
            <a href="login.html">← Back to User Login</a>
        </div>
        
        <div class="mpesa-badge">
            💳 M-Pesa Paybill: <strong>4095377</strong> | Account: <strong>AUTO-V</strong><br>
            <span style="font-size: 10px;">Valuations: KES 2,500 | Inspections: KES 3,500</span>
        </div>
    </div>

    <script>
        // ============================================
        // AUTO-V ADMIN LOGIN
        // ✅ Redirects to admin-dashboard.html
        // ============================================
        (function() {
            if (window.autoVAdminLoginInitialized) return;
            window.autoVAdminLoginInitialized = true;
            
            const SUPABASE_URL = "https://tsvejnzxrxrrecgquxbq.supabase.co";
            const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzdmVqbnp4cnhycmVjZ3F1eGJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExODczNjgsImV4cCI6MjA5Njc2MzM2OH0.PCEppwafuPatBoWh4OnhzgHv6fA9uF5-bWW9mmf2VoQ";
            
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            const messageBox = document.getElementById('messageBox');
            const loginForm = document.getElementById('loginForm');

            // ─── Redirect Target ──────────────────────────────────────
            const ADMIN_DASHBOARD = 'admin-dashboard.html';

            // ============================================
            // HELPER FUNCTIONS
            // ============================================
            function showMessage(text, type = 'error') {
                messageBox.textContent = text;
                messageBox.className = `message ${type}-message`;
                messageBox.style.display = 'block';
                setTimeout(() => { messageBox.style.display = 'none'; }, 5000);
            }
            
            function clearMessage() { 
                messageBox.style.display = 'none'; 
            }

            function isValidEmail(email) {
                return /^[^\s@]+@([^\s@.,]+\.)+[^\s@.,]{2,}$/.test(email);
            }

            // ============================================
            // CHECK IF USER HAS ADMIN ROLE
            // ============================================
            async function checkAdminRole(userId) {
                try {
                    const { data, error } = await supabase
                        .from('user_profiles')
                        .select('id, email, role')
                        .eq('id', userId)
                        .single();
                    
                    if (error) {
                        if (error.code === 'PGRST116') {
                            return null;
                        }
                        console.error('Error checking admin role:', error);
                        return null;
                    }
                    
                    return data;
                } catch (err) {
                    console.error('Admin check error:', err);
                    return null;
                }
            }

            // ============================================
            // CREATE ADMIN PROFILE
            // ============================================
            async function createAdminProfile(user) {
                try {
                    const { data, error } = await supabase
                        .from('user_profiles')
                        .insert({
                            id: user.id,
                            email: user.email,
                            role: 'admin'
                        })
                        .select('id, email, role')
                        .single();
                    
                    if (error) {
                        console.error('Error creating admin profile:', error);
                        return null;
                    }
                    
                    return data;
                } catch (err) {
                    console.error('Create profile error:', err);
                    return null;
                }
            }

            // ============================================
            // UPDATE USER TO ADMIN
            // ============================================
            async function updateToAdmin(userId) {
                try {
                    const { data, error } = await supabase
                        .from('user_profiles')
                        .update({ role: 'admin' })
                        .eq('id', userId)
                        .select('id, email, role')
                        .single();
                    
                    if (error) {
                        console.error('Error updating to admin:', error);
                        return null;
                    }
                    
                    return data;
                } catch (err) {
                    console.error('Update error:', err);
                    return null;
                }
            }

            // ============================================
            // REDIRECT TO ADMIN DASHBOARD
            // ============================================
            function redirectToAdmin() {
                console.log('📌 Redirecting to:', ADMIN_DASHBOARD);
                window.location.href = ADMIN_DASHBOARD;
            }

            // ============================================
            // MAIN LOGIN HANDLER
            // ============================================
            async function handleLogin(e) {
                e.preventDefault();
                const email = emailInput.value.trim();
                const password = passwordInput.value;
                
                clearMessage();
                
                if (!email || !password) {
                    showMessage('Please enter both email and password', 'error');
                    emailInput.focus();
                    return;
                }
                
                if (!isValidEmail(email)) {
                    showMessage('Please enter a valid email address', 'error');
                    emailInput.focus();
                    return;
                }
                
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<span class="spinner"></span> Authenticating...';

                try {
                    // Step 1: Login with Supabase Auth
                    const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
                        email,
                        password
                    });

                    if (authError) {
                        console.error('Auth error:', authError);
                        if (authError.message === 'Invalid login credentials') {
                            showMessage('❌ Invalid email or password.', 'error');
                        } else if (authError.message.includes('Email not confirmed')) {
                            showMessage('📧 Please verify your email first.', 'info');
                        } else {
                            showMessage('Login failed: ' + authError.message, 'error');
                        }
                        loginBtn.disabled = false;
                        loginBtn.innerHTML = 'Admin Login';
                        return;
                    }

                    if (!authData || !authData.user) {
                        showMessage('Login failed. Please try again.', 'error');
                        loginBtn.disabled = false;
                        loginBtn.innerHTML = 'Admin Login';
                        return;
                    }

                    const user = authData.user;
                    console.log('✅ User authenticated:', user.email);

                    // Step 2: Check if user has admin role
                    let profile = await checkAdminRole(user.id);
                    console.log('📋 Profile check result:', profile);

                    // Step 3: If no profile, create one with admin role
                    if (!profile) {
                        console.log('📝 No profile found, creating admin profile...');
                        profile = await createAdminProfile(user);
                        if (!profile) {
                            showMessage('Error creating admin profile. Please contact support.', 'error');
                            await supabase.auth.signOut();
                            loginBtn.disabled = false;
                            loginBtn.innerHTML = 'Admin Login';
                            return;
                        }
                        console.log('✅ Admin profile created:', profile);
                    }

                    // Step 4: If profile exists but not admin, update to admin
                    if (profile && profile.role !== 'admin') {
                        console.log('🔄 Updating user to admin...');
                        profile = await updateToAdmin(user.id);
                        if (!profile) {
                            showMessage('Error updating admin privileges.', 'error');
                            await supabase.auth.signOut();
                            loginBtn.disabled = false;
                            loginBtn.innerHTML = 'Admin Login';
                            return;
                        }
                        console.log('✅ User updated to admin:', profile);
                    }

                    // Step 5: Final admin verification
                    if (!profile || profile.role !== 'admin') {
                        showMessage('⛔ Access denied. Admin privileges required.', 'error');
                        await supabase.auth.signOut();
                        loginBtn.disabled = false;
                        loginBtn.innerHTML = 'Admin Login';
                        return;
                    }

                    // ✅ Step 6: Store admin session
                    localStorage.setItem('autoV_admin', JSON.stringify({
                        id: user.id,
                        email: user.email,
                        role: profile.role,
                        isAdmin: true,
                        loginTime: new Date().toISOString()
                    }));

                    // Remove regular user session to prevent conflict
                    localStorage.removeItem('autoV_user');

                    showMessage('✅ Admin login successful! Redirecting to Admin Dashboard...', 'success');
                    
                    // ✅ Step 7: Redirect to admin-dashboard.html
                    setTimeout(() => {
                        redirectToAdmin();
                    }, 1500);

                } catch (err) {
                    console.error('❌ Login error:', err);
                    showMessage('Network error. Please try again.', 'error');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = 'Admin Login';
                }
            }

            // ============================================
            // CHECK EXISTING ADMIN SESSION
            // ============================================
            async function checkExistingSession() {
                try {
                    // Check if admin session exists in localStorage
                    const adminData = localStorage.getItem('autoV_admin');
                    if (adminData) {
                        try {
                            const admin = JSON.parse(adminData);
                            if (admin.isAdmin) {
                                console.log('✅ Admin session found, redirecting to', ADMIN_DASHBOARD);
                                redirectToAdmin();
                                return;
                            }
                        } catch (e) {
                            console.error('Error parsing admin data:', e);
                            localStorage.removeItem('autoV_admin');
                        }
                    }

                    // Check Supabase session
                    const { data: { session }, error } = await supabase.auth.getSession();
                    
                    if (error) {
                        console.error('Session check error:', error);
                        return;
                    }
                    
                    if (session && session.user) {
                        console.log('🔍 Active session found for:', session.user.email);
                        
                        // Check if user has admin role
                        const profile = await checkAdminRole(session.user.id);
                        
                        if (profile && profile.role === 'admin') {
                            // Store admin session and redirect
                            localStorage.setItem('autoV_admin', JSON.stringify({
                                id: session.user.id,
                                email: session.user.email,
                                role: profile.role,
                                isAdmin: true,
                                loginTime: new Date().toISOString()
                            }));
                            localStorage.removeItem('autoV_user');
                            console.log('✅ Redirecting to', ADMIN_DASHBOARD);
                            redirectToAdmin();
                        } else {
                            // Not admin, but maybe regular user
                            console.log('👤 User is not admin, staying on login page');
                            emailInput.value = session.user.email;
                        }
                    }
                } catch (err) {
                    console.error('Session check error:', err);
                }
            }

            // ============================================
            // EVENT LISTENERS
            // ============================================
            loginForm.addEventListener('submit', handleLogin);
            
            emailInput.addEventListener('input', clearMessage);
            passwordInput.addEventListener('input', clearMessage);
            
            emailInput.addEventListener('keypress', (e) => { 
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleLogin(e);
                }
            });
            passwordInput.addEventListener('keypress', (e) => { 
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleLogin(e);
                }
            });
            
            // Focus on email input after page loads
            setTimeout(() => emailInput.focus(), 100);

            // Check existing admin session on page load
            checkExistingSession();
            
            console.log('🚀 Admin Login ready - Redirects to:', ADMIN_DASHBOARD);
        })();
    </script>
</body>
</html>
