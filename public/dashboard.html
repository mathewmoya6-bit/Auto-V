<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTO-V Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23eab308' rx='20'/%3E%3Ctext x='50' y='72' font-size='60' text-anchor='middle' fill='%23000'%3E🚗%3C/text%3E%3C/svg%3E">
    
    <!-- Load UMD & Source of Truth -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="supabase.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            background: #0b1120; 
            color: #fff; 
            min-height: 100vh; 
        }
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 16px 24px; 
            background: #111827; 
            border-bottom: 2px solid #eab308; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
        }
        .logo { 
            font-size: 24px; 
            color: #eab308; 
            font-weight: 800; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
        .logout-btn { 
            background: #dc2626; 
            color: #fff; 
            padding: 8px 16px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 700; 
        }
        .logout-btn:hover { background: #b91c1c; }
        
        .container { 
            max-width: 1100px; 
            margin: 0 auto; 
            padding: 24px; 
        }
        .card { 
            background: #0f172a; 
            border: 1px solid #1f2937; 
            border-radius: 12px; 
            padding: 24px; 
            margin-bottom: 20px; 
        }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
            gap: 20px; 
        }
        
        .service-card { 
            background: #1e293b; 
            padding: 24px; 
            border-radius: 12px; 
            text-align: center; 
            transition: all 0.3s; 
            border: 1px solid transparent; 
        }
        .service-card:hover { 
            border-color: #eab308; 
            transform: translateY(-5px); 
            box-shadow: 0 8px 25px rgba(234,179,8,0.1); 
        }
        .service-icon { 
            font-size: 48px; 
            margin-bottom: 10px; 
        }
        .service-card h3 { 
            color: #eab308; 
            font-size: 18px; 
            margin-bottom: 8px; 
        }
        .service-card p { 
            color: #94a3b8; 
            font-size: 14px; 
            margin-bottom: 15px; 
        }
        
        .btn { 
            background: #eab308; 
            color: #000; 
            padding: 10px 20px; 
            border: none; 
            border-radius: 8px; 
            font-weight: 700; 
            cursor: pointer; 
            width: 100%; 
            transition: all 0.3s; 
        }
        .btn:hover { 
            background: #facc15; 
            transform: scale(1.02); 
        }
        .btn:disabled { 
            background: #555; 
            cursor: not-allowed; 
        }
        
        .error { 
            color: #ef4444; 
            text-align: center; 
            padding: 20px; 
            background: #2a0a0a; 
            border-left: 4px solid #ef4444; 
            border-radius: 6px; 
        }
        
        #profileCard { 
            display: none; 
        }
        #userRole { 
            color: #eab308; 
            font-weight: 600; 
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">🚗 AUTO-V Dashboard</div>
        <button class="logout-btn" id="logoutBtn">Logout</button>
    </header>

    <div class="container">
        <div id="profileCard" class="card">
            <h2>Welcome, <span id="userName">User</span></h2>
            <p>Role: <span id="userRole">Loading...</span></p>
        </div>
        
        <div id="serviceGrid" class="grid">
            <div class="card" style="grid-column: 1/-1; text-align: center; color: #94a3b8;">
                Loading services...
            </div>
        </div>
    </div>

    <script>
        // ✅ Wait for the single source of truth
        function waitForAutoV(retries = 30) {
            if (window.autoV && typeof window.autoV.getCurrentUser === 'function') {
                initDashboard();
                return;
            }
            
            if (retries > 0) {
                console.log(`⏳ Waiting for autoV... (${30 - retries} attempts)`);
                setTimeout(() => waitForAutoV(retries - 1), 100);
            } else {
                document.getElementById('serviceGrid').innerHTML = `
                    <div class="error" style="grid-column: 1/-1;">
                        <strong>⚠️ Connection Error</strong><br><br>
                        Could not connect to the server. Please refresh the page.
                        <br><br>
                        <button onclick="window.location.reload()" style="background:#eab308;color:#000;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-weight:bold;">
                            Refresh Page
                        </button>
                    </div>
                `;
            }
        }

        // ─── Main Dashboard Logic ──────────────────────────────────────
        const ALL_SERVICES = [
            { 
                id: 'valuation', 
                icon: '💰', 
                name: 'Vehicle Valuation', 
                desc: 'Get accurate market value', 
                page: 'customer-portal.html?service=valuation', 
                roles: ['individual', 'corporate', 'valuer'] 
            },
            { 
                id: 'instant-value-check', 
                icon: '💡', 
                name: 'Instant Value Check', 
                desc: 'Quick AI market estimate', 
                page: 'customer-portal.html?service=instant-value-check', 
                roles: ['individual', 'corporate', 'valuer'] 
            },
            { 
                id: 'inspection', 
                icon: '🔍', 
                name: 'Vehicle Inspection', 
                desc: '150+ point condition report', 
                page: 'customer-portal.html?service=inspection', 
                roles: ['valuer'] 
            },
            { 
                id: 'assessment', 
                icon: '⚠️', 
                name: 'Vehicle Assessment', 
                desc: 'Accident & repair evaluation', 
                page: 'customer-portal.html?service=assessment', 
                roles: ['valuer'] 
            },
            { 
                id: 'mileage-rate', 
                icon: '📏', 
                name: 'Mileage Rate Report', 
                desc: 'Cost per kilometre analysis', 
                page: 'customer-portal.html?service=mileage-rate', 
                roles: ['valuer'] 
            },
            { 
                id: 'fleet', 
                icon: '🚛', 
                name: 'Fleet Services', 
                desc: 'Full fleet management', 
                page: 'customer-portal.html?service=fleet', 
                roles: ['valuer'] 
            },
        ];

        function initDashboard() {
            try {
                // 🔥 FIX: Access methods directly from window.autoV to preserve 'this' context
                const user = window.autoV.requireAuth();
                if (!user) return;

                user.then(async (userObj) => {
                    if (!userObj) return;

                    // Fetch the user's role
                    let role = 'individual';
                    try {
                        const userRole = await window.autoV.getUserRole(userObj.id);
                        if (userRole) role = userRole;
                    } catch (err) {
                        console.warn('Could not fetch role, defaulting to individual:', err);
                    }
                    
                    // Update the profile card
                    document.getElementById('profileCard').style.display = 'block';
                    document.getElementById('userName').textContent = userObj.email || 'User';
                    document.getElementById('userRole').textContent = role.charAt(0).toUpperCase() + role.slice(1);

                    // Filter services
                    const allowedServices = ALL_SERVICES.filter(s => s.roles.includes(role));
                    const grid = document.getElementById('serviceGrid');
                    
                    if (allowedServices.length === 0) {
                        grid.innerHTML = `
                            <div class="card" style="grid-column: 1/-1; text-align: center; padding: 40px;">
                                <h3 style="color: #94a3b8;">No services available for your role.</h3>
                                <p style="color: #64748b; margin-top: 10px;">Contact admin to update your permissions.</p>
                            </div>
                        `;
                        return;
                    }

                    grid.innerHTML = allowedServices.map(s => `
                        <div class="service-card">
                            <div class="service-icon">${s.icon}</div>
                            <h3>${s.name}</h3>
                            <p>${s.desc}</p>
                            <button class="btn" onclick="window.location.href='${s.page}'">
                                Start Service →
                            </button>
                        </div>
                    `).join('');
                });
            } catch (err) {
                console.error('Dashboard init error:', err);
                const grid = document.getElementById('serviceGrid');
                grid.innerHTML = `
                    <div class="error" style="grid-column: 1/-1;">
                        <strong>⚠️ Error:</strong> ${err.message}
                        <br><br>
                        <button onclick="window.location.reload()" style="background:#eab308;color:#000;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-weight:bold;margin-top:10px;">
                            Refresh Page
                        </button>
                    </div>
                `;
            }
        }

        // 5. Logout handler
        document.getElementById('logoutBtn').addEventListener('click', async function() {
            if (window.autoV && typeof window.autoV.logout === 'function') {
                await window.autoV.logout();
            } else {
                window.location.href = 'login.html';
            }
        });

        // 6. Start waiting for AutoV
        waitForAutoV();
    </script>
</body>
</html>
