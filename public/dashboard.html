<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTO-V Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #0b1120; color: white; min-height: 100vh; }
        header { display: flex; justify-content: space-between; padding: 15px 30px; background: #111827; border-bottom: 2px solid #eab308; }
        .logo { font-size: 24px; color: #eab308; font-weight: bold; }
        .container { max-width: 1100px; margin: auto; padding: 24px; }
        .card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .service-card { background: #1e293b; padding: 20px; border-radius: 12px; text-align: center; transition: 0.3s; border: 1px solid transparent; }
        .service-card:hover { border-color: #eab308; }
        .btn { background: #eab308; color: black; padding: 10px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; width: 100%; }
        .btn:disabled { background: #555; cursor: not-allowed; }
        .logout-btn { background: #dc2626; color: white; padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; }
        .logout-btn:hover { background: #b91c1c; }
        .error { color: #ef4444; text-align: center; padding: 20px; }
    </style>
</head>
<body>
    <header>
        <div class="logo">🚗 AUTO-V Dashboard</div>
        <button class="logout-btn" id="logoutBtn">Logout</button>
    </header>

    <div class="container">
        <div id="profileCard" class="card" style="display:none;">
            <h2>Welcome, <span id="userName">User</span></h2>
            <p>Role: <span id="userRole" style="color:#eab308;">Loading...</span></p>
        </div>

        <div id="serviceGrid" class="grid">
            <div class="card" style="grid-column: 1/-1; text-align: center;">Loading services...</div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://tsvejnzxrxrrecgquxbq.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzdmVqbnp4cnhycmVjZ3F1eGJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExODczNjgsImV4cCI6MjA5Njc2MzM2OH0.PCEppwafuPatBoWh4OnhzgHv6fA9uF5-bWW9mmf2VoQ";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const ALL_SERVICES = [
            { id: 'valuation', icon: '💰', name: 'Vehicle Valuation', page: 'customer-portal.html?service=valuation', roles: ['individual', 'corporate', 'valuer'] },
            { id: 'instant-value-check', icon: '💡', name: 'Instant Value Check', page: 'customer-portal.html?service=instant-value-check', roles: ['individual', 'corporate', 'valuer'] },
            { id: 'inspection', icon: '🔍', name: 'Vehicle Inspection', page: 'customer-portal.html?service=inspection', roles: ['valuer'] },
            { id: 'assessment', icon: '⚠️', name: 'Vehicle Assessment', page: 'customer-portal.html?service=assessment', roles: ['valuer'] },
            { id: 'mileage-rate', icon: '📏', name: 'Mileage Rate Report', page: 'customer-portal.html?service=mileage-rate', roles: ['valuer'] },
            { id: 'fleet', icon: '🚛', name: 'Fleet Services', page: 'customer-portal.html?service=fleet', roles: ['valuer'] },
        ];

        async function init() {
            const { data: { user }, error } = await supabase.auth.getUser();
            if (error || !user) {
                window.location.href = 'login.html';
                return;
            }

            // Fetch role directly from the database (Server-side enforced)
            const { data: profile, error: profileError } = await supabase
                .from('user_profiles')
                .select('role, full_name')
                .eq('id', user.id)
                .single();

            if (profileError) {
                document.getElementById('serviceGrid').innerHTML = `<div class="error">Error loading profile. Please contact support.</div>`;
                return;
            }

            const role = profile.role || 'individual';
            
            document.getElementById('profileCard').style.display = 'block';
            document.getElementById('userName').textContent = profile.full_name || user.email;
            document.getElementById('userRole').textContent = role.charAt(0).toUpperCase() + role.slice(1);

            // Filter services based on database role
            const allowedServices = ALL_SERVICES.filter(s => s.roles.includes(role));

            if (allowedServices.length === 0) {
                document.getElementById('serviceGrid').innerHTML = `<div class="card" style="grid-column:1/-1;text-align:center;">No services available for your role.</div>`;
                return;
            }

            document.getElementById('serviceGrid').innerHTML = allowedServices.map(s => `
                <div class="service-card">
                    <div style="font-size: 40px;">${s.icon}</div>
                    <h3 style="color: #eab308; margin: 10px 0;">${s.name}</h3>
                    <button class="btn" onclick="window.location.href='${s.page}'">Start →</button>
                </div>
            `).join('');
        }

        document.getElementById('logoutBtn').onclick = async function() {
            await supabase.auth.signOut();
            localStorage.clear();
            sessionStorage.clear();
            window.location.href = 'login.html';
        };

        init();
    </script>
</body>
</html>
