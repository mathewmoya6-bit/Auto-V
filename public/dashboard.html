<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTO-V Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23eab308' rx='20'/%3E%3Ctext x='50' y='72' font-size='60' text-anchor='middle' fill='%23000'%3E🚗%3C/text%3E%3C/svg%3E">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="supabase.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #0b1120; color: white; min-height: 100vh; }
        
        /* ─── Header ────────────────────────────────────────────────── */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: #111827;
            border-bottom: 2px solid #eab308;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo { font-size: 24px; color: #eab308; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 14px;
        }
        .header-right .member-id { color: #94a3b8; font-size: 12px; }
        .header-right .icon-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 20px;
            cursor: pointer;
            transition: 0.3s;
        }
        .header-right .icon-btn:hover { color: #eab308; }
        .logout-btn {
            background: #dc2626;
            color: white;
            padding: 6px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }
        .logout-btn:hover { background: #b91c1c; }

        /* ─── Container ─────────────────────────────────────────────── */
        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }

        /* ─── Welcome Section ───────────────────────────────────────── */
        .welcome-card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .welcome-card h2 { color: #eab308; font-size: 24px; margin: 0; }
        .welcome-card p { color: #94a3b8; margin: 5px 0 0; }
        .welcome-card .role-badge {
            background: #1e293b;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 13px;
            color: #eab308;
            border: 1px solid #334155;
        }

        /* ─── Summary Cards ─────────────────────────────────────────── */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }
        .summary-card {
            background: #1e293b;
            border: 1px solid #2d3a4e;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: 0.3s;
        }
        .summary-card:hover { border-color: #eab308; transform: translateY(-3px); }
        .summary-card h3 { font-size: 13px; color: #94a3b8; margin-bottom: 5px; }
        .summary-card .number { font-size: 32px; font-weight: bold; color: #eab308; }
        .summary-card .sub { font-size: 12px; color: #64748b; margin-top: 5px; }

        /* ─── Services Grid ─────────────────────────────────────────── */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .service-card {
            background: #1e293b;
            padding: 24px;
            border-radius: 12px;
            text-align: center;
            transition: 0.3s;
            border: 1px solid transparent;
        }
        .service-card:hover { border-color: #eab308; transform: translateY(-5px); box-shadow: 0 8px 25px rgba(234,179,8,0.1); }
        .service-icon { font-size: 40px; margin-bottom: 10px; display: block; }
        .service-card h3 { color: #eab308; font-size: 18px; margin-bottom: 6px; }
        .service-card p { color: #94a3b8; font-size: 13px; margin-bottom: 15px; }
        .service-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .service-actions .btn {
            background: #eab308;
            color: black;
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            transition: 0.3s;
            text-decoration: none;
        }
        .service-actions .btn:hover { background: #facc15; transform: scale(1.02); }
        .service-actions .btn-outline {
            background: transparent;
            border: 1px solid #475569;
            color: #94a3b8;
        }
        .service-actions .btn-outline:hover {
            border-color: #eab308;
            color: #eab308;
            background: rgba(234, 179, 8, 0.1);
        }

        /* ─── Sections (Vehicles, Reports, Certificates) ────────────── */
        .section-block {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 24px;
        }
        .section-block h3 { color: #eab308; font-size: 18px; margin-bottom: 15px; border-left: 3px solid #eab308; padding-left: 12px; }
        
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #1f2937;
            flex-wrap: wrap;
        }
        .list-item:last-child { border-bottom: none; }
        .list-item .info h4 { color: white; font-size: 15px; }
        .list-item .info p { color: #94a3b8; font-size: 13px; margin-top: 3px; }
        .list-item .actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .list-item .actions .btn-sm {
            background: #2d3a4e;
            color: white;
            padding: 4px 14px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.3s;
        }
        .list-item .actions .btn-sm:hover { background: #eab308; color: black; }
        .list-item .status-badge {
            background: #22c55e;
            color: black;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }

        /* ─── Loading / Empty States ────────────────────────────────── */
        .loading-spinner { color: #94a3b8; text-align: center; padding: 20px; }
        .empty-state { color: #64748b; text-align: center; padding: 20px; font-size: 14px; }
    </style>
</head>
<body>
    <!-- ─── Header ──────────────────────────────────────────────────── -->
    <header>
        <div class="logo">🚗 AUTO-V</div>
        <div class="header-right">
            <span id="memberId" class="member-id">Member ID: ---</span>
            <button class="icon-btn">🔔</button>
            <button class="icon-btn">👤</button>
            <button class="logout-btn" id="logoutBtn">Logout</button>
        </div>
    </header>

    <div class="container">
        <!-- ─── Welcome Card ──────────────────────────────────────────── -->
        <div class="welcome-card" id="profileCard">
            <div>
                <h2>Welcome, <span id="userName">User</span></h2>
                <p id="userEmail">Loading...</p>
            </div>
            <div>
                <span class="role-badge" id="userRole">Individual</span>
            </div>
        </div>

        <!-- ─── Summary Cards ────────────────────────────────────────── -->
        <div class="summary-grid">
            <div class="summary-card">
                <h3>My Vehicles</h3>
                <div class="number" id="sumVehicles">-</div>
                <div class="sub">Registered</div>
            </div>
            <div class="summary-card">
                <h3>Reports</h3>
                <div class="number" id="sumReports">-</div>
                <div class="sub">Generated</div>
            </div>
            <div class="summary-card">
                <h3>Certificates</h3>
                <div class="number" id="sumCertificates">-</div>
                <div class="sub">Issued</div>
            </div>
            <div class="summary-card">
                <h3>Total Value</h3>
                <div class="number" id="sumValue">KES -</div>
                <div class="sub">Portfolio</div>
            </div>
        </div>

        <!-- ─── Main Services ────────────────────────────────────────── -->
        <div class="services-grid" id="serviceGrid">
            <!-- Cards injected via JS -->
        </div>

        <!-- ─── My Vehicles ──────────────────────────────────────────── -->
        <div class="section-block">
            <h3>🚗 My Vehicles</h3>
            <div id="vehicleList">
                <div class="loading-spinner">Loading vehicles...</div>
            </div>
        </div>

        <!-- ─── Recent Reports ────────────────────────────────────────── -->
        <div class="section-block">
            <h3>📄 Recent Reports</h3>
            <div id="recentReports">
                <div class="loading-spinner">Loading reports...</div>
            </div>
        </div>

        <!-- ─── My Certificates ──────────────────────────────────────── -->
        <div class="section-block">
            <h3>📜 My Certificates</h3>
            <div id="certificateList">
                <div class="loading-spinner">Loading certificates...</div>
            </div>
        </div>
    </div>

    <script>
        // ─── Source of Truth ──────────────────────────────────────────
        if (!window.autoV || !window.autoV.supabase) {
            document.getElementById('serviceGrid').innerHTML = `<div style="text-align:center;color:#ef4444;padding:40px;">❌ Supabase failed to load.</div>`;
            throw new Error('Supabase client not found.');
        }

        const client = window.autoV.supabase;
        const ALL_SERVICES = [
            { id: 'instant-value-check', icon: '💡', name: 'Instant Value Check', desc: 'Quick AI market estimate', page: 'customer-portal.html?service=instant-value-check' },
            { id: 'mileage-rate', icon: '📏', name: 'Mileage Rate Report', desc: 'Cost per kilometre analysis', page: 'customer-portal.html?service=mileage-rate' },
            { id: 'valuation', icon: '💰', name: 'Vehicle Valuation', desc: 'Certified valuation report', page: 'customer-portal.html?service=valuation' },
            { id: 'inspection', icon: '🔍', name: 'Vehicle Inspection', desc: 'Comprehensive inspection report', page: 'customer-portal.html?service=inspection' },
            { id: 'assessment', icon: '⚠️', name: 'Vehicle Assessment', desc: 'Accident and damage assessment', page: 'customer-portal.html?service=assessment' },
            { id: 'fleet', icon: '🚛', name: 'Fleet Services', desc: 'Full fleet management', page: 'customer-portal.html?service=fleet' }
        ];

        async function init() {
            const user = await window.autoV.requireAuth();
            if (!user) return;

            const role = await window.autoV.getUserRole(user.id);
            const { data: profile } = await client.from('user_profiles').select('*').eq('id', user.id).single();
            
            // ─── Update Header & Profile ──────────────────────────────
            document.getElementById('userName').textContent = profile?.full_name || user.email.split('@')[0];
            document.getElementById('userEmail').textContent = user.email;
            document.getElementById('userRole').textContent = role.charAt(0).toUpperCase() + role.slice(1);
            document.getElementById('memberId').textContent = `Member ID: AUTOV-${String(Math.floor(Math.random()*100000)).padStart(6,'0')}`;

            // ─── Render Services ──────────────────────────────────────
            const serviceGrid = document.getElementById('serviceGrid');
            serviceGrid.innerHTML = ALL_SERVICES.map(s => `
                <div class="service-card">
                    <span class="service-icon">${s.icon}</span>
                    <h3>${s.name}</h3>
                    <p>${s.desc}</p>
                    <div class="service-actions">
                        <a href="${s.page}" class="btn">Start Service</a>
                        <a href="#" class="btn btn-outline">Learn More</a>
                    </div>
                </div>
            `).join('');

            // ─── Fetch Real Vehicles ──────────────────────────────────
            const { data: vehicles } = await client.from('vehicles').select('*').eq('user_id', user.id);
            const vehicleList = document.getElementById('vehicleList');
            
            if (!vehicles || vehicles.length === 0) {
                vehicleList.innerHTML = `<div class="empty-state">You haven't registered any vehicles yet.</div>`;
            } else {
                vehicleList.innerHTML = vehicles.map(v => `
                    <div class="list-item">
                        <div class="info">
                            <h4>${v.make} ${v.model}</h4>
                            <p>${v.registration_number} · ${v.year} · ${v.body_type || 'N/A'}</p>
                        </div>
                        <div class="actions">
                            <button class="btn-sm">View History</button>
                            <button class="btn-sm" onclick="window.location.href='customer-portal.html?service=valuation'">Request Valuation</button>
                            <button class="btn-sm" onclick="window.location.href='customer-portal.html?service=inspection'">Request Inspection</button>
                        </div>
                    </div>
                `).join('');
            }

            // ─── Fetch Real Reports ──────────────────────────────────
            const { data: reports } = await client
                .from('service_requests')
                .select('*')
                .eq('user_id', user.id)
                .order('created_at', { ascending: false })
                .limit(5);

            const reportsList = document.getElementById('recentReports');
            
            if (!reports || reports.length === 0) {
                reportsList.innerHTML = `<div class="empty-state">No reports generated yet.</div>`;
            } else {
                reportsList.innerHTML = reports.map(r => `
                    <div class="list-item">
                        <div class="info">
                            <h4>${r.vehicle_make || 'N/A'} ${r.vehicle_model || ''} · ${formatName(r.service_type)}</h4>
                            <p>${new Date(r.created_at).toLocaleDateString('en-KE')}</p>
                        </div>
                        <div class="actions">
                            <span class="status-badge">${r.status || 'pending'}</span>
                            <button class="btn-sm">View</button>
                            <button class="btn-sm">Download PDF</button>
                        </div>
                    </div>
                `).join('');
            }

            // ─── Fetch Real Certificates ─────────────────────────────
            const { data: certificates } = await client
                .from('certificates')
                .select('*')
                .eq('user_id', user.id)
                .order('issued_at', { ascending: false })
                .limit(5);

            const certList = document.getElementById('certificateList');
            
            if (!certificates || certificates.length === 0) {
                certList.innerHTML = `<div class="empty-state">No certificates issued yet.</div>`;
            } else {
                certList.innerHTML = certificates.map(c => `
                    <div class="list-item">
                        <div class="info">
                            <h4>${c.certificate_number}</h4>
                            <p>${c.vehicle_make || 'N/A'} ${c.vehicle_model || ''} · ${c.status === 'active' ? '✅ Verified' : '⏳ Pending'}</p>
                        </div>
                        <div class="actions">
                            <button class="btn-sm">📥 Download</button>
                            <button class="btn-sm">🖨 Print</button>
                        </div>
                    </div>
                `).join('');
            }

            // ─── Fetch Summary Statistics ────────────────────────────
            const { count: vehicleCount } = await client
                .from('vehicles')
                .select('*', { count: 'exact', head: true })
                .eq('user_id', user.id);

            const { count: reportCount } = await client
                .from('service_requests')
                .select('*', { count: 'exact', head: true })
                .eq('user_id', user.id);

            const { count: certCount } = await client
                .from('certificates')
                .select('*', { count: 'exact', head: true })
                .eq('user_id', user.id);

            // Calculate total portfolio value (sum of valuations)
            const { data: valuations } = await client
                .from('service_requests')
                .select('result')
                .eq('user_id', user.id)
                .eq('service_type', 'valuation')
                .eq('status', 'completed');

            let totalValue = 0;
            if (valuations && valuations.length > 0) {
                valuations.forEach(v => {
                    if (v.result && v.result.value) {
                        totalValue += v.result.value;
                    }
                });
            }

            document.getElementById('sumVehicles').textContent = vehicleCount || 0;
            document.getElementById('sumReports').textContent = reportCount || 0;
            document.getElementById('sumCertificates').textContent = certCount || 0;
            document.getElementById('sumValue').textContent = `KES ${totalValue.toLocaleString()}`;

            // ─── Logout ────────────────────────────────────────────────
            document.getElementById('logoutBtn').onclick = async function() {
                await window.autoV.logout();
            };
        }

        // ─── Helpers ──────────────────────────────────────────────────
        function formatName(key) {
            return key.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
        }

        init();
    </script>
</body>
</html>
