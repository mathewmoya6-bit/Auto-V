<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTO-V Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23eab308' rx='20'/%3E%3Ctext x='50' y='72' font-size='60' text-anchor='middle' fill='%23000'%3E🚗%3C/text%3E%3C/svg%3E">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="supabase.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #0b1120; color: white; min-height: 100vh; }
        header { display: flex; justify-content: space-between; padding: 15px 30px; background: #111827; border-bottom: 2px solid #eab308; }
        .logo { font-size: 24px; color: #eab308; font-weight: bold; }
        .container { max-width: 1100px; margin: auto; padding: 24px; }
        .card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .service-card { background: #1e293b; padding: 20px; border-radius: 12px; text-align: center; transition: 0.3s; border: 1px solid transparent; }
        .service-card:hover { border-color: #eab308; transform: translateY(-5px); box-shadow: 0 8px 25px rgba(234,179,8,0.1); }
        .service-icon { font-size: 48px; margin-bottom: 10px; }
        .service-card h3 { color: #eab308; font-size: 18px; margin-bottom: 8px; }
        .service-card p { color: #94a3b8; font-size: 14px; margin-bottom: 15px; }
        .btn { background: #eab308; color: black; padding: 10px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; }
        .btn:hover { background: #facc15; transform: scale(1.02); }
        .btn:disabled { background: #555; cursor: not-allowed; }
        .logout-btn { background: #dc2626; color: white; padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; }
        .logout-btn:hover { background: #b91c1c; }
    </style>
</head>
<body>
    <header>
        <div class="logo">🚗 AUTO-V Dashboard</div>
        <button class="logout-btn" id="logoutBtn">Logout</button>
    </header>

    <div class="container">
        <div id="profileCard" class="card" style="display:none;">
            <h2>Welcome, <span id="userName">User</span></h2>
            <p>Role: <span id="userRole" style="color:#eab308;">Loading...</span></p>
        </div>
        <div id="serviceGrid" class="grid">
            <div class="card" style="grid-column: 1/-1; text-align: center;">Loading services...</div>
        </div>
    </div>

    <script>
        const ALL_SERVICES = [
            // ─── INDIVIDUAL / CORPORATE ONLY ──────────────────────────
            { 
                id: 'instant-value-check', 
                icon: '💡', 
                name: 'Instant Value Check', 
                desc: 'Quick AI market estimate', 
                page: 'customer-portal.html?service=instant-value-check', 
                roles: ['individual', 'corporate'] 
            },
            { 
                id: 'mileage-rate', 
                icon: '📏', 
                name: 'Mileage Rate Report', 
                desc: 'Cost per kilometre analysis', 
                page: 'customer-portal.html?service=mileage-rate', 
                roles: ['individual', 'corporate'] 
            },
            
            // ─── VALUER ONLY ───────────────────────────────────────────
            { 
                id: 'valuation', 
                icon: '💰', 
                name: 'Vehicle Valuation', 
                desc: 'Formal certified valuation', 
                page: 'customer-portal.html?service=valuation', 
                roles: ['valuer'] 
            },
            { 
                id: 'inspection', 
                icon: '🔍', 
                name: 'Vehicle Inspection', 
                desc: '150+ point condition report', 
                page: 'customer-portal.html?service=inspection', 
                roles: ['valuer'] 
            },
            { 
                id: 'assessment', 
                icon: '⚠️', 
                name: 'Vehicle Assessment', 
                desc: 'Accident & repair evaluation', 
                page: 'customer-portal.html?service=assessment', 
                roles: ['valuer'] 
            },
            { 
                id: 'fleet', 
                icon: '🚛', 
                name: 'Fleet Services', 
                desc: 'Full fleet management', 
                page: 'customer-portal.html?service=fleet', 
                roles: ['valuer'] 
            },
        ];

        async function init() {
            const user = await window.autoV.requireAuth();
            if (!user) return;

            const role = await window.autoV.getUserRole(user.id);
            
            document.getElementById('profileCard').style.display = 'block';
            document.getElementById('userName').textContent = user.email;
            document.getElementById('userRole').textContent = role.charAt(0).toUpperCase() + role.slice(1);

            // ⚡ SEPARATE ACCESS: Only filter by role
            const allowedServices = ALL_SERVICES.filter(s => s.roles.includes(role));

            if (allowedServices.length === 0) {
                document.getElementById('serviceGrid').innerHTML = `<div class="card" style="grid-column:1/-1;text-align:center;">No services available for your role.</div>`;
                return;
            }

            document.getElementById('serviceGrid').innerHTML = allowedServices.map(s => `
                <div class="service-card">
                    <div style="font-size: 40px;">${s.icon}</div>
                    <h3 style="color: #eab308; margin: 10px 0;">${s.name}</h3>
                    <p style="color:#94a3b8; font-size:13px;">${s.desc || 'Click to start'}</p>
                    <button class="btn" onclick="window.location.href='${s.page}'">Start →</button>
                </div>
            `).join('');
        }

        document.getElementById('logoutBtn').onclick = async function() {
            await window.autoV.logout();
        };

        init();
    </script>
</body>
</html>
