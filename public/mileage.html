<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AUTO-V | Professional Mileage Calculator</title>
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* ... existing styles ... */
    </style>
</head>
<body>
    <!-- ... existing HTML ... -->
    
    <script>
        // ============================================================
        // HYBRID ARCHITECTURE: Supabase Direct + FastAPI Backend
        // ============================================================
        
        (function() {
            "use strict";
            
            // ── Configuration ──
            const SUPABASE_URL = 'https://tsvejnzxrxrrecgquxbq.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzdmVqbnp4cnhycmVjZ3F1eGJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExODczNjgsImV4cCI6MjA5Njc2MzM2OH0.PCEppwafuPatBoWh4OnhzgHv6fA9uF5-bWW9mmf2VoQ';
            const FASTAPI_BASE_URL = 'https://auto-v.onrender.com/api/v1';
            
            // ── Initialize Supabase Client ──
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                auth: {
                    autoRefreshToken: true,
                    persistSession: true,
                    detectSessionInUrl: true
                },
                realtime: {
                    params: {
                        eventsPerSecond: 10
                    }
                }
            });
            
            // ── FastAPI Client ──
            const fastapi = {
                baseURL: FASTAPI_BASE_URL,
                
                async request(endpoint, options = {}) {
                    const url = `${this.baseURL}${endpoint}`;
                    const response = await fetch(url, {
                        ...options,
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json',
                            ...(options.headers || {})
                        }
                    });
                    
                    if (!response.ok) {
                        const error = await response.json().catch(() => ({}));
                        throw new Error(error.detail || `HTTP ${response.status}`);
                    }
                    
                    return response.json();
                },
                
                // Business logic endpoints
                async calculateMileage(data) {
                    return this.request('/calculate/mileage', {
                        method: 'POST',
                        body: JSON.stringify(data)
                    });
                },
                
                async createVehicle(data) {
                    return this.request('/vehicles', {
                        method: 'POST',
                        body: JSON.stringify(data)
                    });
                },
                
                async updateVehicle(id, data) {
                    return this.request(`/vehicles/${id}`, {
                        method: 'PUT',
                        body: JSON.stringify(data)
                    });
                },
                
                async submitReport(data) {
                    return this.request('/reports', {
                        method: 'POST',
                        body: JSON.stringify(data)
                    });
                },
                
                async authenticate(credentials) {
                    return this.request('/auth/login', {
                        method: 'POST',
                        body: JSON.stringify(credentials)
                    });
                }
            };
            
            // ── Supabase Data Access Layer ──
            const supabaseDB = {
                // Read-only queries (direct from Supabase)
                async getCategories() {
                    const { data, error } = await supabase
                        .from('vehicle_categories')
                        .select('*')
                        .eq('is_active', true)
                        .order('name');
                    
                    if (error) throw error;
                    return data;
                },
                
                async getVariants(categoryId) {
                    const { data, error } = await supabase
                        .from('vehicle_variants')
                        .select(`
                            *,
                            category:vehicle_categories(name, fuel_type)
                        `)
                        .eq('category_id', categoryId)
                        .eq('is_active', true)
                        .order('label');
                    
                    if (error) throw error;
                    return data;
                },
                
                async getRoutes() {
                    const { data, error } = await supabase
                        .from('routes')
                        .select('*')
                        .eq('is_active', true)
                        .order('from_city');
                    
                    if (error) throw error;
                    return data;
                },
                
                // Real-time subscriptions
                subscribeToChanges(table, callback) {
                    const subscription = supabase
                        .channel(`${table}_changes`)
                        .on(
                            'postgres_changes',
                            {
                                event: '*',
                                schema: 'public',
                                table: table
                            },
                            (payload) => {
                                console.log(`${table} changed:`, payload);
                                callback(payload);
                            }
                        )
                        .subscribe();
                    
                    return subscription;
                },
                
                // Analytics tracking
                async trackCalculation(data) {
                    const { error } = await supabase
                        .from('mileage_calculations')
                        .insert([{
                            variant_id: data.variantId,
                            distance: data.distance,
                            total_cost: data.totalCost,
                            user_id: data.userId || null,
                            timestamp: new Date().toISOString()
                        }]);
                    
                    if (error) console.error('Analytics error:', error);
                }
            };
            
            // ── State Management ──
            const state = {
                categories: [],
                variants: [],
                routes: [],
                selectedCategory: null,
                selectedVariant: null,
                distance: 100,
                currentFuelFilter: 'all',
                showAllClasses: false,
                isLoading: false,
                results: null,
                user: null,
                subscriptions: []
            };
            
            // ── Business Logic ──
            const mileageCalculator = {
                // Simple calculations done client-side
                calculateSimple(variant, distance) {
                    if (!variant || !distance) return null;
                    
                    const fixedRate = parseFloat(variant.fixed_per_km) || 0;
                    const operatingRate = parseFloat(variant.operating_per_km) || 0;
                    const totalRate = parseFloat(variant.total_per_km) || (fixedRate + operatingRate);
                    
                    return {
                        totalCost: totalRate * distance,
                        fixedCost: fixedRate * distance,
                        operatingCost: operatingRate * distance,
                        totalRate: totalRate,
                        fixedRate: fixedRate,
                        operatingRate: operatingRate,
                        components: this.calculateComponents(variant, distance)
                    };
                },
                
                // Complex calculations done server-side
                async calculateAdvanced(variant, distance, options = {}) {
                    try {
                        // Send to FastAPI for complex business logic
                        const result = await fastapi.calculateMileage({
                            variant_id: variant.id,
                            distance: distance,
                            include_projections: true,
                            include_comparison: true,
                            ...options
                        });
                        
                        // Track calculation
                        await supabaseDB.trackCalculation({
                            variantId: variant.id,
                            distance: distance,
                            totalCost: result.totalCost,
                            userId: state.user?.id
                        });
                        
                        return result;
                    } catch (error) {
                        console.error('Server calculation failed, falling back to client:', error);
                        // Fallback to simple calculation
                        return this.calculateSimple(variant, distance);
                    }
                },
                
                calculateComponents(variant, distance) {
                    const components = variant.components || {};
                    const result = {};
                    
                    Object.keys(components).forEach(key => {
                        result[key] = (parseFloat(components[key]) || 0) * distance;
                    });
                    
                    return result;
                }
            };
            
            // ── UI Controller ──
            const UI = {
                // ... existing UI methods ...
                
                async init() {
                    try {
                        // 1. Subscribe to real-time updates
                        this.setupRealtimeSubscriptions();
                        
                        // 2. Load initial data from Supabase
                        await this.loadInitialData();
                        
                        // 3. Setup event listeners
                        this.setupEventListeners();
                        
                        // 4. Check authentication
                        await this.checkAuth();
                        
                        console.log('✅ Application initialized (Hybrid Mode)');
                        this.showToast('Connected to Supabase + FastAPI', 'success');
                    } catch (error) {
                        console.error('❌ Initialization error:', error);
                        this.showToast('Error connecting to services', 'error');
                    }
                },
                
                async loadInitialData() {
                    try {
                        // Parallel loading for speed
                        const [categories, routes] = await Promise.all([
                            supabaseDB.getCategories(),
                            supabaseDB.getRoutes()
                        ]);
                        
                        state.categories = categories;
                        state.routes = routes;
                        
                        this.populateCategories();
                        this.renderRouteChips();
                        
                        this.setStatus('✅ Connected to Supabase', true);
                    } catch (error) {
                        console.error('Data loading error:', error);
                        // Fallback to hardcoded data
                        this.setStatus('⚠️ Using fallback data', false);
                    }
                },
                
                setupRealtimeSubscriptions() {
                    // Subscribe to category changes
                    const sub1 = supabaseDB.subscribeToChanges('vehicle_categories', (payload) => {
                        console.log('Category changed:', payload);
                        // Reload categories
                        this.loadInitialData();
                    });
                    
                    // Subscribe to variant changes
                    const sub2 = supabaseDB.subscribeToChanges('vehicle_variants', (payload) => {
                        console.log('Variant changed:', payload);
                        // Reload variants if current category affected
                        if (state.selectedCategory) {
                            this.loadVariants(state.selectedCategory);
                        }
                    });
                    
                    state.subscriptions = [sub1, sub2];
                },
                
                async loadVariants(categoryId) {
                    try {
                        state.isLoading = true;
                        const variants = await supabaseDB.getVariants(categoryId);
                        state.variants = variants;
                        this.populateVariants();
                    } catch (error) {
                        console.error('Variant loading error:', error);
                        this.showToast('Error loading vehicles', 'error');
                    } finally {
                        state.isLoading = false;
                    }
                },
                
                async handleCalculate() {
                    const variant = this.currentVariant();
                    const distance = parseFloat(document.getElementById('distanceInput').value);
                    
                    if (!variant || !distance) {
                        this.showToast('Please select a vehicle and enter distance', 'error');
                        return;
                    }
                    
                    try {
                        // Try advanced calculation via FastAPI first
                        const result = await mileageCalculator.calculateAdvanced(variant, distance, {
                            include_forecast: true,
                            include_comparison: true
                        });
                        
                        state.results = result;
                        this.renderResults(result);
                        this.showToast('✅ Calculation complete!', 'success');
                    } catch (error) {
                        console.error('Calculation error:', error);
                        // Fallback to simple client-side calculation
                        const result = mileageCalculator.calculateSimple(variant, distance);
                        state.results = result;
                        this.renderResults(result);
                        this.showToast('⚠️ Using simplified calculation', 'warning');
                    }
                },
                
                renderResults(result) {
                    // ... existing rendering code ...
                    // Enhanced with server-calculated data
                    
                    if (result.forecast) {
                        this.renderForecast(result.forecast);
                    }
                    
                    if (result.comparison) {
                        this.renderComparison(result.comparison);
                    }
                },
                
                // ... other UI methods ...
            };
            
            // ── Authentication ──
            const auth = {
                async login(email, password) {
                    try {
                        // Try Supabase auth first
                        const { data, error } = await supabase.auth.signInWithPassword({
                            email,
                            password
                        });
                        
                        if (error) throw error;
                        
                        state.user = data.user;
                        UI.showToast('✅ Logged in successfully!', 'success');
                        return data;
                    } catch (error) {
                        // Fallback to FastAPI auth
                        try {
                            const result = await fastapi.authenticate({
                                email,
                                password
                            });
                            state.user = result.user;
                            UI.showToast('✅ Logged in via FastAPI!', 'success');
                            return result;
                        } catch (err) {
                            UI.showToast('❌ Login failed', 'error');
                            throw err;
                        }
                    }
                },
                
                async logout() {
                    await supabase.auth.signOut();
                    state.user = null;
                    UI.showToast('Logged out', 'info');
                },
                
                async checkAuth() {
                    const { data } = await supabase.auth.getSession();
                    if (data.session) {
                        state.user = data.session.user;
                        UI.showToast(`Welcome back, ${state.user.email}!`, 'success');
                    }
                }
            };
            
            // ── Performance Optimizations ──
            const cache = {
                _store: new Map(),
                _ttl: 300000, // 5 minutes
                
                get(key) {
                    const item = this._store.get(key);
                    if (!item) return null;
                    if (Date.now() - item.timestamp > this._ttl) {
                        this._store.delete(key);
                        return null;
                    }
                    return item.data;
                },
                
                set(key, data) {
                    this._store.set(key, {
                        data,
                        timestamp: Date.now()
                    });
                },
                
                clear() {
                    this._store.clear();
                }
            };
            
            // ── Initialize Application ──
            document.addEventListener('DOMContentLoaded', () => {
                UI.init();
            });
            
        })();
    </script>
</body>
</html>
