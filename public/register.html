<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>AUTO-V | Create Account</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23eab308' rx='20'/%3E%3Ctext x='50' y='72' font-size='60' text-anchor='middle' fill='%23000'%3E🚗%3C/text%3E%3C/svg%3E">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Hybrid API Client -->
    <script src="/auto-v-api.js"></script>
    
    <style>
        /* ─── RESET & BASE ─── */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #0a0c15;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* ─── AMBIENT BACKGROUND ─── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(234, 179, 8, 0.07) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(234, 179, 8, 0.05) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(34, 197, 94, 0.04) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .glow-orb {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(234, 179, 8, 0.06), transparent 70%);
            top: -200px;
            right: -200px;
            pointer-events: none;
            animation: floatGlow 20s ease-in-out infinite alternate;
            z-index: 0;
        }

        .glow-orb-bottom {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(34, 197, 94, 0.04), transparent 70%);
            bottom: -150px;
            left: -150px;
            pointer-events: none;
            animation: floatGlow 25s ease-in-out infinite alternate-reverse;
            z-index: 0;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 30px) scale(1.2); }
        }

        .register-container {
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 48px 40px 36px;
            width: 100%;
            max-width: 480px;
            border: 1px solid rgba(234, 179, 8, 0.15);
            box-shadow:
                0 25px 60px -12px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.03);
            position: relative;
            z-index: 1;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .register-container:hover {
            box-shadow:
                0 30px 70px -12px rgba(0, 0, 0, 0.7),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .logo { text-align: center; margin-bottom: 28px; }

        .logo-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 8px;
            filter: drop-shadow(0 4px 12px rgba(234, 179, 8, 0.2));
        }

        .logo h1 {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #eab308, #facc15);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .logo .subtitle { color: #94a3b8; font-size: 14px; font-weight: 400; margin-top: 4px; }

        .message {
            padding: 14px 18px;
            border-radius: 14px;
            margin-bottom: 24px;
            display: none;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            animation: slideDown 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .error-message {
            background: rgba(127, 29, 29, 0.8);
            color: #fecaca;
            border-left: 4px solid #ef4444;
            backdrop-filter: blur(4px);
        }

        .success-message {
            background: rgba(20, 83, 45, 0.8);
            color: #bbf7d0;
            border-left: 4px solid #22c55e;
            backdrop-filter: blur(4px);
        }

        .info-message {
            background: rgba(30, 41, 59, 0.8);
            color: #fcd34d;
            border-left: 4px solid #eab308;
            backdrop-filter: blur(4px);
        }

        .form-group { margin-bottom: 18px; }

        label {
            display: block;
            margin-bottom: 6px;
            color: #94a3b8;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        label .required {
            color: #ef4444;
            margin-left: 2px;
        }

        .input-wrapper { position: relative; }

        .input-wrapper input,
        .input-wrapper select {
            width: 100%;
            padding: 14px 18px;
            background: #0a0f1c;
            border: 2px solid #1e293b;
            border-radius: 14px;
            color: #f1f5f9;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .input-wrapper select {
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
        }

        .input-wrapper select option {
            background: #0a0f1c;
            color: #f1f5f9;
        }

        .input-wrapper input:focus,
        .input-wrapper select:focus {
            outline: none;
            border-color: #eab308;
            box-shadow: 0 0 0 4px rgba(234, 179, 8, 0.1);
            background: #0f172a;
        }

        .input-wrapper input::placeholder { color: #475569; font-weight: 400; }

        .input-wrapper input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 1000px #0a0f1c inset !important;
            -webkit-text-fill-color: #f1f5f9 !important;
            border-color: #2d3a4e;
        }

        .password-strength {
            margin-top: 8px;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .password-strength .bars {
            display: flex;
            gap: 4px;
            flex: 1;
        }

        .password-strength .bar {
            height: 4px;
            flex: 1;
            border-radius: 4px;
            background: #1e293b;
            transition: all 0.3s;
        }

        .password-strength .bar.weak { background: #ef4444; }
        .password-strength .bar.medium { background: #f59e0b; }
        .password-strength .bar.strong { background: #22c55e; }

        .password-strength .text {
            font-size: 11px;
            font-weight: 600;
            min-width: 60px;
            text-align: right;
        }

        .password-strength .text.weak { color: #ef4444; }
        .password-strength .text.medium { color: #f59e0b; }
        .password-strength .text.strong { color: #22c55e; }

        .input-hint {
            font-size: 11px;
            color: #64748b;
            margin-top: 4px;
        }

        .register-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #eab308, #facc15);
            color: #0a0c15;
            border: none;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            margin-top: 8px;
            font-family: inherit;
            position: relative;
            overflow: hidden;
        }

        .register-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 40%, rgba(255, 255, 255, 0.15) 100%);
            pointer-events: none;
        }

        .register-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px -8px rgba(234, 179, 8, 0.35);
        }

        .register-btn:active:not(:disabled) { transform: translateY(0px) scale(0.98); }

        .register-btn:disabled {
            background: #334155;
            color: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .register-btn .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(10, 12, 21, 0.2);
            border-radius: 50%;
            border-top-color: #0a0c15;
            animation: spin 0.6s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .footer-links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #1e293b;
            flex-wrap: wrap;
            gap: 12px;
        }

        .footer-links a {
            color: #64748b;
            text-decoration: none;
            font-size: 13px;
            transition: color 0.2s;
        }
        .footer-links a:hover { color: #eab308; }

        .terms-text {
            text-align: center;
            font-size: 11px;
            color: #475569;
            margin-top: 16px;
            line-height: 1.6;
        }

        .terms-text a {
            color: #eab308;
            text-decoration: none;
        }
        .terms-text a:hover { text-decoration: underline; }

        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 11px;
            color: #475569;
            margin-top: 14px;
        }

        .security-badge svg { width: 14px; height: 14px; fill: #22c55e; }

        /* ─── TOAST ─── */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 24px;
            border-radius: 8px;
            z-index: 9999;
            font-weight: 500;
            animation: slideIn 0.3s ease;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            font-family: 'Inter', sans-serif;
        }
        .toast-success { background: #22c55e; color: #000; }
        .toast-error { background: #ef4444; color: #fff; }
        .toast-warning { background: #eab308; color: #000; }
        .toast-info { background: #3b82f6; color: #fff; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(100px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .role-selector {
            display: flex;
            gap: 12px;
            margin-top: 4px;
            flex-wrap: wrap;
        }

        .role-option {
            flex: 1;
            min-width: 80px;
            padding: 10px 14px;
            background: #0a0f1c;
            border: 2px solid #1e293b;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 500;
        }

        .role-option:hover {
            border-color: #3b82f6;
            color: #fff;
        }

        .role-option.selected {
            border-color: #eab308;
            color: #eab308;
            background: rgba(234, 179, 8, 0.08);
        }

        .role-option .icon {
            display: block;
            font-size: 24px;
            margin-bottom: 4px;
        }

        @media (max-width: 480px) {
            .register-container { padding: 32px 20px 28px; border-radius: 24px; margin: 12px; }
            .logo h1 { font-size: 26px; }
            .logo-icon { font-size: 38px; }
            .input-wrapper input { padding: 13px 16px; font-size: 14px; }
            .register-btn { padding: 14px; font-size: 15px; }
            .footer-links { flex-direction: column; text-align: center; }
            .role-selector { flex-direction: column; }
        }

        @media (max-width: 380px) {
            .register-container { padding: 24px 16px 20px; }
            .logo h1 { font-size: 22px; }
        }
    </style>
</head>
<body>

    <div class="glow-orb"></div>
    <div class="glow-orb-bottom"></div>

    <div class="register-container" role="main" aria-label="Create Account">

        <div class="logo">
            <span class="logo-icon">🚗</span>
            <h1>AUTO‑V</h1>
            <p class="subtitle">Create your account</p>
        </div>

        <div id="messageBox" class="message" role="alert" aria-live="polite"></div>

        <form id="registerForm" autocomplete="off" novalidate>
            <!-- Full Name -->
            <div class="form-group">
                <label for="fullName">👤 Full Name <span class="required">*</span></label>
                <div class="input-wrapper">
                    <input type="text" id="fullName" placeholder="John Doe" autocomplete="name" required>
                </div>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">📧 Email Address <span class="required">*</span></label>
                <div class="input-wrapper">
                    <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
                </div>
            </div>

            <!-- Phone -->
            <div class="form-group">
                <label for="phone">📱 Phone Number</label>
                <div class="input-wrapper">
                    <input type="tel" id="phone" placeholder="+254 700 000 000" autocomplete="tel">
                </div>
            </div>

            <!-- Company -->
            <div class="form-group">
                <label for="company">🏢 Company / Organisation</label>
                <div class="input-wrapper">
                    <input type="text" id="company" placeholder="Company name (optional)">
                </div>
            </div>

            <!-- Role Selection -->
            <div class="form-group">
                <label>🎯 Account Type</label>
                <div class="role-selector" id="roleSelector">
                    <div class="role-option selected" data-role="user">
                        <span class="icon">👤</span>
                        Individual
                    </div>
                    <div class="role-option" data-role="corporate">
                        <span class="icon">🏢</span>
                        Corporate
                    </div>
                    <div class="role-option" data-role="valuer">
                        <span class="icon">🔍</span>
                        Valuer
                    </div>
                </div>
                <input type="hidden" id="role" value="user">
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">🔒 Password <span class="required">*</span></label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="••••••••" autocomplete="new-password" required minlength="6">
                </div>
                <div class="password-strength" id="passwordStrength">
                    <div class="bars">
                        <div class="bar" id="pwdBar1"></div>
                        <div class="bar" id="pwdBar2"></div>
                        <div class="bar" id="pwdBar3"></div>
                        <div class="bar" id="pwdBar4"></div>
                    </div>
                    <span class="text" id="pwdText">Weak</span>
                </div>
                <div class="input-hint">Minimum 6 characters. Use letters, numbers &amp; symbols for strength.</div>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label for="confirmPassword">✅ Confirm Password <span class="required">*</span></label>
                <div class="input-wrapper">
                    <input type="password" id="confirmPassword" placeholder="••••••••" autocomplete="new-password" required>
                </div>
            </div>

            <!-- Terms -->
            <div class="terms-text">
                By creating an account, you agree to our <a href="terms.html">Terms of Service</a> and <a href="privacy.html">Privacy Policy</a>.
            </div>

            <button type="submit" class="register-btn" id="registerBtn">
                🚀 Create Account
            </button>
        </form>

        <div class="footer-links">
            <a href="login.html">← Already have an account? Login</a>
            <a href="index.html">🏠 Home</a>
        </div>

        <div class="security-badge">
            <svg viewBox="0 0 24 24"><path d="M12 1C8.676 1 5.5 2.5 3.5 4.5 2 6 1 8.5 1 11c0 6 4.5 11 11 12 6.5-1 11-6 11-12 0-2.5-1-5-2.5-6.5C18.5 2.5 15.324 1 12 1zm0 19c-4.5-1-8-4.5-9-9 0-2 1-4 2-5 1.5-1.5 4-2.5 7-2.5s5.5 1 7 2.5c1 1 2 3 2 5-1 4.5-4.5 8-9 9zm0-14c-1.5 0-2.5 1-2.5 2.5S10.5 11 12 11s2.5-1 2.5-2.5S13.5 6 12 6zm0 8c-2 0-3.5 1.5-3.5 3.5h7c0-2-1.5-3.5-3.5-3.5z"/></svg>
            <span>256‑bit SSL · Secure Registration</span>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════
        // AUTO-V REGISTER — Production Ready
        // Uses window.autoV (Supabase + FastAPI)
        // ═══════════════════════════════════════════════════════════════

        (function() {
            'use strict';

            if (window.autoVRegisterInitialized) return;
            window.autoVRegisterInitialized = true;

            // ─── DOM REFS ───────────────────────────────────────────────
            const form = document.getElementById('registerForm');
            const btn = document.getElementById('registerBtn');
            const messageBox = document.getElementById('messageBox');
            const fullName = document.getElementById('fullName');
            const email = document.getElementById('email');
            const phone = document.getElementById('phone');
            const company = document.getElementById('company');
            const password = document.getElementById('password');
            const confirmPassword = document.getElementById('confirmPassword');
            const roleHidden = document.getElementById('role');

            // ─── ROLE SELECTION ──────────────────────────────────────────
            document.querySelectorAll('.role-option').forEach(opt => {
                opt.addEventListener('click', function() {
                    document.querySelectorAll('.role-option').forEach(o => o.classList.remove('selected'));
                    this.classList.add('selected');
                    roleHidden.value = this.dataset.role;
                });
            });

            // ─── PASSWORD STRENGTH ──────────────────────────────────────
            function checkPasswordStrength(pwd) {
                let score = 0;
                if (pwd.length >= 6) score++;
                if (pwd.length >= 10) score++;
                if (/[A-Z]/.test(pwd) && /[a-z]/.test(pwd)) score++;
                if (/[0-9]/.test(pwd)) score++;
                if (/[^A-Za-z0-9]/.test(pwd)) score++;

                const bars = [
                    document.getElementById('pwdBar1'),
                    document.getElementById('pwdBar2'),
                    document.getElementById('pwdBar3'),
                    document.getElementById('pwdBar4')
                ];
                const text = document.getElementById('pwdText');

                // Reset all bars
                bars.forEach(b => { b.className = 'bar'; });

                if (pwd.length === 0) {
                    text.textContent = '';
                    text.className = 'text';
                    return;
                }

                let strength, className;
                if (score <= 2) {
                    strength = 'Weak';
                    className = 'weak';
                    bars.slice(0, 2).forEach(b => b.classList.add('weak'));
                } else if (score <= 3) {
                    strength = 'Medium';
                    className = 'medium';
                    bars.slice(0, 3).forEach(b => b.classList.add('medium'));
                } else {
                    strength = 'Strong';
                    className = 'strong';
                    bars.forEach(b => b.classList.add('strong'));
                }

                text.textContent = strength;
                text.className = 'text ' + className;
            }

            password.addEventListener('input', function() {
                checkPasswordStrength(this.value);
            });

            // ─── MESSAGE FUNCTIONS ─────────────────────────────────────
            function showMessage(text, type = 'error') {
                messageBox.textContent = text;
                messageBox.className = `message ${type}-message`;
                messageBox.style.display = 'block';
                clearTimeout(window._msgTimer);
                window._msgTimer = setTimeout(() => {
                    messageBox.style.display = 'none';
                }, 6000);
            }

            function clearMessage() {
                messageBox.style.display = 'none';
                clearTimeout(window._msgTimer);
            }

            function showToast(message, type = 'success') {
                if (window.autoV && window.autoV.showToast) {
                    window.autoV.showToast(message, type);
                    return;
                }
                const existing = document.querySelector('.toast');
                if (existing) existing.remove();
                const toast = document.createElement('div');
                toast.className = `toast toast-${type}`;
                toast.textContent = message;
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 4000);
            }

            // ─── VALIDATION ─────────────────────────────────────────────
            function isValidEmail(email) {
                return /^[^\s@]+@([^\s@.,]+\.)+[^\s@.,]{2,}$/.test(email);
            }

            function isValidPhone(phone) {
                if (!phone) return true;
                return /^[\+\d\s\-\(\)]{10,}$/.test(phone.trim());
            }

            function setLoading(state) {
                btn.disabled = state;
                btn.innerHTML = state ?
                    '<span class="spinner"></span> Creating account...' :
                    '🚀 Create Account';
            }

            // ─── REGISTER HANDLER ────────────────────────────────────────
            async function handleRegister(e) {
                e.preventDefault();
                clearMessage();

                // ─── Get values ─────────────────────────────────────────
                const name = fullName.value.trim();
                const emailVal = email.value.trim();
                const phoneVal = phone.value.trim();
                const companyVal = company.value.trim();
                const pwd = password.value;
                const confirmPwd = confirmPassword.value;
                const role = roleHidden.value;

                // ─── Validation ─────────────────────────────────────────
                if (!name) {
                    showMessage('Please enter your full name.', 'error');
                    fullName.focus();
                    return;
                }

                if (!emailVal || !isValidEmail(emailVal)) {
                    showMessage('Please enter a valid email address.', 'error');
                    email.focus();
                    return;
                }

                if (phoneVal && !isValidPhone(phoneVal)) {
                    showMessage('Please enter a valid phone number.', 'error');
                    phone.focus();
                    return;
                }

                if (!pwd || pwd.length < 6) {
                    showMessage('Password must be at least 6 characters.', 'error');
                    password.focus();
                    return;
                }

                if (pwd !== confirmPwd) {
                    showMessage('Passwords do not match.', 'error');
                    confirmPassword.focus();
                    return;
                }

                setLoading(true);

                try {
                    // ─── Step 1: Register via API ──────────────────────
                    const registerData = {
                        email: emailVal,
                        password: pwd,
                        full_name: name,
                        phone: phoneVal || null,
                        company: companyVal || null,
                        role: role
                    };

                    let result;
                    if (window.autoV) {
                        result = await window.autoV.apiRequest('/auth/register', {
                            method: 'POST',
                            body: JSON.stringify(registerData)
                        });
                    } else {
                        const res = await fetch('https://auto-v.onrender.com/api/v1/auth/register', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(registerData)
                        });
                        if (!res.ok) {
                            const err = await res.json();
                            throw new Error(err.detail || 'Registration failed');
                        }
                        result = await res.json();
                    }

                    showMessage('✅ Account created successfully! Redirecting...', 'success');
                    showToast('✅ Account created! Please login.', 'success');

                    // ─── Step 2: Auto-login ─────────────────────────────
                    setTimeout(async () => {
                        try {
                            let loginResult;
                            if (window.autoV) {
                                loginResult = await window.autoV.apiRequest('/auth/login', {
                                    method: 'POST',
                                    body: JSON.stringify({
                                        email: emailVal,
                                        password: pwd
                                    })
                                });
                            } else {
                                const loginRes = await fetch('https://auto-v.onrender.com/api/v1/auth/login', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({
                                        email: emailVal,
                                        password: pwd
                                    })
                                });
                                if (!loginRes.ok) throw new Error('Auto-login failed');
                                loginResult = await loginRes.json();
                            }

                            if (loginResult.access_token) {
                                if (window.autoV) {
                                    window.autoV.setAuthToken(loginResult.access_token);
                                } else {
                                    localStorage.setItem('access_token', loginResult.access_token);
                                }
                                // Redirect to dashboard
                                window.location.href = 'dashboard.html';
                            }
                        } catch (autoLoginError) {
                            // If auto-login fails, redirect to login page
                            showToast('Please login manually.', 'warning');
                            window.location.href = 'login.html?registered=true&email=' + encodeURIComponent(emailVal);
                        }
                    }, 2000);

                } catch (error) {
                    console.error('Registration error:', error);

                    // ─── Handle specific error cases ─────────────────────
                    const errorMsg = error.message || 'Unknown error';

                    if (errorMsg.toLowerCase().includes('already registered') ||
                        errorMsg.toLowerCase().includes('duplicate key') ||
                        errorMsg.toLowerCase().includes('email already exists')) {
                        showMessage('❌ This email is already registered. Please login.', 'error');
                        showToast('Email already registered. Please login.', 'warning');
                    } else if (errorMsg.includes('400') || errorMsg.includes('validation')) {
                        showMessage('❌ Please check your input and try again.', 'error');
                    } else if (errorMsg.includes('Network') || errorMsg.includes('Failed to fetch')) {
                        showMessage('🌐 Network error. Please check your connection.', 'error');
                    } else if (errorMsg.includes('500')) {
                        showMessage('⚠️ Server error. Please try again later.', 'error');
                    } else {
                        showMessage(`❌ Registration failed: ${errorMsg}`, 'error');
                    }

                    setLoading(false);
                }
            }

            // ─── EVENT LISTENERS ──────────────────────────────────────
            form.addEventListener('submit', handleRegister);

            // Clear messages on focus
            document.querySelectorAll('input').forEach(input => {
                input.addEventListener('focus', clearMessage);
            });

            // ─── CHECK IF ALREADY LOGGED IN ─────────────────────────────
            async function checkExistingSession() {
                try {
                    let user;
                    if (window.autoV) {
                        user = await window.autoV.getCurrentUser();
                    } else {
                        const token = localStorage.getItem('access_token');
                        if (!token) return;
                        const res = await fetch('https://auto-v.onrender.com/api/v1/auth/me', {
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        if (res.ok) user = await res.json();
                    }
                    if (user) {
                        window.location.href = user.role === 'admin' ? 'admin-dashboard.html' : 'dashboard.html';
                    }
                } catch (e) {}
            }

            // ─── INIT ──────────────────────────────────────────────────
            async function init() {
                // Wait for autoV to be ready
                if (window.autoV && !window.autoV._initialized) {
                    console.log('⏳ Waiting for autoV to initialize...');
                    await new Promise(resolve => {
                        const check = () => {
                            if (window.autoV && window.autoV._initialized) {
                                resolve();
                            } else {
                                setTimeout(check, 100);
                            }
                        };
                        check();
                    });
                }

                await checkExistingSession();

                // Focus first field
                setTimeout(() => fullName.focus(), 200);

                console.log('🚀 AUTO-V Register Page (Production)');
                if (window.autoV) {
                    console.log(`📌 API Base: ${window.autoV.API_BASE || 'https://auto-v.onrender.com/api/v1'}`);
                }
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>
</body>
</html>
