<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTO-V Register</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0a0a0a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            width: 400px;
            max-width: 95%;
            background: #111;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #333;
        }

        h2 {
            text-align: center;
            color: #eab308;
            margin-bottom: 25px;
        }

        /* Client Type Toggle */
        .client-type-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: #1a1a1a;
            border-radius: 8px;
            padding: 5px;
        }

        .client-type-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: #94a3b8;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .client-type-btn.active {
            background: #eab308;
            color: #000;
        }

        .client-type-btn:hover:not(.active) {
            color: #fff;
        }

        /* Forms */
        .form-section {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .form-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #1a1a1a;
            color: white;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #eab308;
        }

        button.submit-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #eab308;
            color: black;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button.submit-btn:hover {
            background: #ca8a04;
        }

        a {
            color: #eab308;
            text-decoration: none;
        }

        p {
            text-align: center;
            margin-top: 20px;
        }

        .error {
            color: #ef4444;
            font-size: 14px;
            margin-top: -10px;
            margin-bottom: 15px;
            display: none;
            background: #2a0a0a;
            padding: 10px;
            border-radius: 6px;
            border-left: 4px solid #ef4444;
        }
    </style>
</head>
<body>

<div class="card">

    <h2>Create Account</h2>

    <!-- Client Type Selector -->
    <div class="client-type-selector">
        <button type="button" class="client-type-btn active" data-type="individual" onclick="switchClientType('individual')">
            👤 Individual
        </button>
        <button type="button" class="client-type-btn" data-type="corporate" onclick="switchClientType('corporate')">
            🏢 Corporate
        </button>
    </div>

    <form onsubmit="register(event)">

        <!-- Shared Fields -->
        <input type="email" id="email" placeholder="Email Address" required>
        <input type="password" id="password" placeholder="Password" required>
        <input type="tel" id="phone" placeholder="Phone Number (Optional)">

        <!-- Individual Fields -->
        <div id="individual-fields" class="form-section active">
            <input type="text" id="full_name" placeholder="Full Name" required>
            <input type="text" id="id_passport" placeholder="ID / Passport Number" required>
        </div>

        <!-- Corporate Fields -->
        <div id="corporate-fields" class="form-section">
            <input type="text" id="company_name" placeholder="Company Name" required>
            <input type="text" id="company_reg" placeholder="Company Registration Number" required>
        </div>

        <div class="error" id="error-message"></div>

        <button type="submit" class="submit-btn">
            Create Account
        </button>

    </form>

    <p>
        Already have an account?
        <a href="login.html">Login</a>
    </p>

</div>

<script>

// Supabase Config
const SUPABASE_URL = "https://tsvejnzxrxrrecgquxbq.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzdmVqbnp4cnhycmVjZ3F1eGJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExODczNjgsImV4cCI6MjA5Njc2MzM2OH0.PCEppwafuPatBoWh4OnhzgHv6fA9uF5-bWW9mmf2VoQ";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// State
let currentClientType = 'individual';

// Switch between Individual and Corporate fields
function switchClientType(type) {
    currentClientType = type;

    // Update active button styles
    document.querySelectorAll('.client-type-btn').forEach(btn => {
        btn.classList.remove('active');
    });
    document.querySelector(`.client-type-btn[data-type="${type}"]`).classList.add('active');

    // Toggle fields
    document.getElementById('individual-fields').classList.toggle('active', type === 'individual');
    document.getElementById('corporate-fields').classList.toggle('active', type === 'corporate');
}

async function register(event) {
    event.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const phone = document.getElementById("phone").value;
    const errorDiv = document.getElementById("error-message");

    // Hide previous error
    errorDiv.style.display = "none";
    errorDiv.textContent = "";

    // Collect specific fields based on client type
    let metadata = {
        client_type: currentClientType,
        phone: phone || ''
    };

    if (currentClientType === 'individual') {
        const full_name = document.getElementById("full_name").value;
        const id_passport = document.getElementById("id_passport").value;

        if (!full_name || !id_passport) {
            errorDiv.textContent = "Please fill in your Full Name and ID/Passport.";
            errorDiv.style.display = "block";
            return;
        }

        metadata.full_name = full_name;
        metadata.id_passport = id_passport;
    } else { // Corporate
        const company_name = document.getElementById("company_name").value;
        const company_reg = document.getElementById("company_reg").value;

        if (!company_name || !company_reg) {
            errorDiv.textContent = "Please fill in the Company Name and Registration Number.";
            errorDiv.style.display = "block";
            return;
        }

        metadata.company_name = company_name;
        metadata.company_reg = company_reg;
    }

    // Send to Supabase Auth
    const { data, error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: {
            data: metadata
        }
    });

    if (error) {
        errorDiv.textContent = error.message;
        errorDiv.style.display = "block";
        return;
    }

    if (data.user) {
        alert("Account created successfully! Please check your email for verification.");
        window.location.href = "login.html";
    }
}

</script>

</body>
</html>
