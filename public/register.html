<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTO-V Register</title>

    <!-- ✅ Embedded Favicon (No 404 errors) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23eab308' rx='20'/%3E%3Ctext x='50' y='72' font-size='60' text-anchor='middle' fill='%23000'%3E🚗%3C/text%3E%3C/svg%3E">
    
    <!-- ✅ Load Supabase UMD & Single Source of Truth -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="supabase.js"></script>

    <style>
        body{font-family:Arial,sans-serif;background:#0a0a0a;color:white;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;}
        .card{width:400px;max-width:95%;background:#111;padding:30px;border-radius:12px;border:1px solid #333;}
        h2{text-align:center;color:#eab308;margin-bottom:20px;}
        
        .role-selector{display:flex;gap:10px;margin-bottom:20px;background:#1a1a1a;border-radius:8px;padding:5px;}
        .role-btn{flex:1;padding:10px;border:none;border-radius:6px;background:transparent;color:#94a3b8;font-weight:bold;cursor:pointer;transition:all 0.3s;}
        .role-btn.active{background:#eab308;color:#000;}
        
        .form-section{display:none;animation:fadeIn 0.3s ease;}
        .form-section.active{display:block;}
        @keyframes fadeIn{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}

        input{width:100%;padding:12px;margin-bottom:15px;border:1px solid #333;border-radius:8px;background:#1a1a1a;color:white;box-sizing:border-box;}
        input:focus{outline:none;border-color:#eab308;}
        
        button.submit-btn{width:100%;padding:12px;border:none;border-radius:8px;background:#eab308;color:black;font-weight:bold;cursor:pointer;margin-top:10px;}
        button.submit-btn:hover{background:#ca8a04;}
        
        .error{color:#ef4444;font-size:14px;margin-bottom:15px;display:none;background:#2a0a0a;padding:10px;border-radius:6px;border-left:4px solid #ef4444;}
        .link{text-align:center;margin-top:15px;color:#94a3b8;}
        .link a{color:#eab308;text-decoration:none;}
    </style>
</head>
<body>

<div class="card">
    <h2>🚗 Create Account</h2>

    <div class="role-selector">
        <button type="button" class="role-btn active" data-type="individual">👤 Individual</button>
        <button type="button" class="role-btn" data-type="corporate">🏢 Corporate</button>
    </div>

    <div class="error" id="errorMsg"></div>

    <form id="signupForm" novalidate> <!-- ✅ novalidate completely disables browser validation errors -->
        <!-- SHARED FIELDS -->
        <input type="email" id="email" placeholder="Email Address" required>
        <input type="password" id="password" placeholder="Password (min 6 chars)" required minlength="6">
        <input type="tel" id="phone" placeholder="Phone Number (Optional)">

        <!-- INDIVIDUAL FIELDS -->
        <div id="individual-fields" class="form-section active">
            <input type="text" id="full_name" placeholder="Full Name" required>
            <input type="text" id="id_passport" placeholder="ID / Passport Number" required>
        </div>

        <!-- CORPORATE FIELDS -->
        <div id="corporate-fields" class="form-section">
            <input type="text" id="company_name" placeholder="Company Name" required>
            <input type="text" id="company_reg" placeholder="Company Registration Number" required>
        </div>

        <button type="submit" class="submit-btn">Create Account</button>
    </form>

    <div class="link">Already have an account? <a href="login.html">Login</a></div>
</div>

<script>
    const { supabase } = window.autoV;

    let currentType = 'individual';

    document.querySelectorAll('.role-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentType = this.dataset.type;

            const indFields = document.getElementById('individual-fields');
            const corpFields = document.getElementById('corporate-fields');

            if (currentType === 'individual') {
                indFields.classList.add('active');
                corpFields.classList.remove('active');
            } else {
                indFields.classList.remove('active');
                corpFields.classList.add('active');
            }
        });
    });

    document.getElementById('signupForm').addEventListener('submit', async function(e) {
        e.preventDefault(); // ✅ Prevents default browser validation entirely

        // ✅ MANUAL VALIDATION (Bypasses the hidden field bug)
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('errorMsg');
        errorDiv.style.display = 'none';

        if (!email || !password) {
            errorDiv.textContent = "Please fill in Email and Password.";
            errorDiv.style.display = 'block';
            return;
        }

        let metadata = { phone: document.getElementById('phone').value || '', client_type: currentType };

        if (currentType === 'individual') {
            const name = document.getElementById('full_name').value.trim();
            const id = document.getElementById('id_passport').value.trim();
            if (!name || !id) {
                errorDiv.textContent = "Please fill in Full Name and ID/Passport.";
                errorDiv.style.display = 'block';
                return;
            }
            metadata.full_name = name;
            metadata.id_passport = id;
        } else {
            const cName = document.getElementById('company_name').value.trim();
            const cReg = document.getElementById('company_reg').value.trim();
            if (!cName || !cReg) {
                errorDiv.textContent = "Please fill in Company Name and Registration Number.";
                errorDiv.style.display = 'block';
                return;
            }
            metadata.company_name = cName;
            metadata.company_reg = cReg;
        }

        const { data, error } = await supabase.auth.signUp({
            email,
            password,
            options: { data: metadata }
        });

        if (error) {
            errorDiv.textContent = error.message;
            errorDiv.style.display = 'block';
            return;
        }

        if (data.user) {
            await supabase.from('user_profiles').upsert({
                id: data.user.id,
                email: email,
                role: currentType,
                full_name: metadata.full_name || metadata.company_name || email.split('@')[0]
            }, { onConflict: 'id' });

            alert('Account created! Please check your email to verify.');
            window.location.href = 'login.html';
        }
    });
</script>
</body>
</html>
