<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTO-V | Vehicle Intelligence Network</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0c15;
            color: #fff;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #0f172a, #0a0c15);
            border-bottom: 2px solid #eab308;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        .logo { font-size: 28px; font-weight: 800; }
        .logo span { color: #eab308; }
        .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
        
        .intelligence-search {
            background: #0f172a;
            border-radius: 60px;
            padding: 12px 20px;
            display: flex;
            gap: 12px;
            border: 1px solid #1e293b;
            max-width: 600px;
            margin: 0 auto 30px;
        }
        .intelligence-search input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        .intelligence-search button {
            background: #eab308;
            color: #000;
            border: none;
            border-radius: 40px;
            padding: 8px 24px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #0f172a;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #1e293b;
            text-align: center;
        }
        .stat-number { font-size: 32px; font-weight: 800; color: #22c55e; }
        .stat-label { color: #94a3b8; font-size: 12px; margin-top: 8px; }
        
        .result-box {
            background: #0f172a;
            border-radius: 20px;
            padding: 28px;
            border: 1px solid #1e293b;
            display: none;
        }
        .result-box.show { display: block; }
        
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #1e293b;
        }
        .detail-label { color: #eab308; font-weight: 600; }
        
        .risk-low { color: #22c55e; }
        .risk-medium { color: #eab308; }
        .risk-high { color: #ef4444; }
        
        @media (max-width: 768px) {
            .container { padding: 16px; }
            .intelligence-search { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">🚗 AUTO-V <span>Intelligence Network</span></div>
    </div>
    
    <div class="container">
        <div class="intelligence-search">
            <input type="text" id="searchInput" placeholder="Enter registration number (e.g., KDA 123A)">
            <button onclick="searchVehicle()">🔍 Search</button>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-number" id="totalVehicles">0</div><div class="stat-label">Vehicles in Database</div></div>
            <div class="stat-card"><div class="stat-number" id="totalValuations">0</div><div class="stat-label">Valuations</div></div>
            <div class="stat-card"><div class="stat-number" id="totalInspections">0</div><div class="stat-label">Inspections</div></div>
            <div class="stat-card"><div class="stat-number" id="avgValue">KES 0</div><div class="stat-label">Average Market Value</div></div>
        </div>
        
        <div id="resultBox" class="result-box">
            <h2 id="vehicleTitle" style="color:#eab308; margin-bottom:20px;">Vehicle Intelligence Report</h2>
            <div id="vehicleDetails"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://tsvejnzxrxrrecgquxbq.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzdmVqbnp4cnhycmVjZ3F1eGJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExODczNjgsImV4cCI6MjA5Njc2MzM2OH0.PCEppwafuPatBoWh4OnhzgHv6fA9uF5-bWW9mmf2VoQ";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadStats() {
            const { count: vehicles } = await supabase.from('vehicles').select('*', { count: 'exact' });
            const { count: valuations } = await supabase.from('valuations').select('*', { count: 'exact' });
            const { count: inspections } = await supabase.from('inspections').select('*', { count: 'exact' });
            
            document.getElementById('totalVehicles').textContent = vehicles || 0;
            document.getElementById('totalValuations').textContent = valuations || 0;
            document.getElementById('totalInspections').textContent = inspections || 0;
            
            const { data } = await supabase.from('valuations').select('market_value').limit(100);
            if (data && data.length > 0) {
                const avg = data.reduce((s, v) => s + (v.market_value || 0), 0) / data.length;
                document.getElementById('avgValue').innerHTML = KES ;
            }
        }

        window.searchVehicle = async function() {
            const reg = document.getElementById('searchInput').value.trim().toUpperCase();
            if (!reg) { alert('Enter a registration number'); return; }
            
            const { data: vehicle } = await supabase
                .from('vehicles')
                .select('*, valuations(*), inspections(*)')
                .eq('registration_number', reg)
                .maybeSingle();
            
            const box = document.getElementById('resultBox');
            const details = document.getElementById('vehicleDetails');
            
            if (!vehicle) {
                box.classList.add('show');
                details.innerHTML = <p style="color:#ef4444;">❌ Vehicle not found in database.</p>;
                return;
            }
            
            const valuation = vehicle.valuations?.[0] || {};
            const inspection = vehicle.inspections?.[0] || {};
            
            document.getElementById('vehicleTitle').textContent = 🚗   ();
            
            details.innerHTML = 
                <div class="detail-row"><span class="detail-label">Registration</span><span></span></div>
                <div class="detail-row"><span class="detail-label">Make & Model</span><span> </span></div>
                <div class="detail-row"><span class="detail-label">Year</span><span></span></div>
                <div class="detail-row"><span class="detail-label">Mileage</span><span> km</span></div>
                <div class="detail-row"><span class="detail-label">Market Value</span><span style="color:#22c55e; font-weight:bold;">KES </span></div>
                <div class="detail-row"><span class="detail-label">Insurance Value</span><span>KES </span></div>
                <div class="detail-row"><span class="detail-label">Trade-In Value</span><span>KES </span></div>
                <div class="detail-row"><span class="detail-label">Inspection Score</span><span>%</span></div>
                <div class="detail-row"><span class="detail-label">Risk Level</span><span class="risk-"></span></div>
                <div class="detail-row"><span class="detail-label">Valuation Count</span><span></span></div>
                <div class="detail-row"><span class="detail-label">Last Valuation</span><span></span></div>
                <div class="detail-row"><span class="detail-label">Condition</span><span></span></div>
            ;
            box.classList.add('show');
        };

        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchVehicle();
        });

        loadStats();
    </script>
</body>
</html>
