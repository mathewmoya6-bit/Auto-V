# render.yaml (if using Render Blueprint)
services:
  - type: web
    name: auto-v-backend
    runtime: python
    repo: https://github.com/yourusername/auto-v-backend
    plan: starter
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: AUTO-V Professional Valuation Engine
      - key: APP_VERSION
        value: 2.0.0
      - key: ENV
        value: production
      - key: DEBUG
        value: false
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: API_V1_PREFIX
        value: /api/v1
      - key: PROJECT_NAME
        value: AUTO-V API
      - key: SUPABASE_URL
        value: https://tsvejnzxrxrrecgquxbq.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        value: 4095377
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_ENVIRONMENT
        value: production
      - key: BASE_URL
        value: https://auto-v.meipressgroup.com
      - key: MPESA_CALLBACK_URL
        value: https://auto-v.meipressgroup.com/api/webhooks/mpesa
      - key: CORS_ORIGINS
        value: '["https://auto-v.meipressgroup.com","https://www.auto-v.meipressgroup.com","https://auto-v.onrender.com","http://localhost:3000","http://localhost:5173","http://localhost:5500"]'
      - key: ALLOWED_HOSTS
        value: '["auto-v.meipressgroup.com","www.auto-v.meipressgroup.com","auto-v.onrender.com","localhost","127.0.0.1"]'
      - key: REDIS_ENABLED
        value: true
      - key: REDIS_URL
        value: redis://red-d8q57kn7f7vs73dv7bd0:6379
      - key: REDIS_MAX_CONNECTIONS
        value: 10
      - key: REDIS_TTL
        value: 3600
      - key: RATELIMIT_ENABLED
        value: true
      - key: RATELIMIT_DEFAULT
        value: 100/minute
      - key: RATELIMIT_STORAGE_URI
        value: redis://red-d8q57kn7f7vs73dv7bd0:6379
      - key: MAX_LOGIN_ATTEMPTS
        value: 5
      - key: IP_RATE_LIMIT
        value: 100
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: AI_WEIGHT
        value: 0.4
      - key: AI_MIN_CONFIDENCE
        value: 0.3
      - key: AI_CACHE_ENABLED
        value: true
      - key: AI_FALLBACK_ENABLED
        value: true
      - key: AI_PREDICTIONS_ENABLED
        value: true
      - key: AI_CACHE_TTL
        value: 3600
      - key: FEATURE_MPESA
        value: true
      - key: FEATURE_VIN_AUTOFILL
        value: true
      - key: FEATURE_AI_VALUATION
        value: true
      - key: FEATURE_FRAUD_DETECTION
        value: true
      - key: FEATURE_DOCUMENT_VERIFICATION
        value: true
      - key: FEATURE_REPORT_GENERATION
        value: true
      - key: FEATURE_QR_VERIFICATION
        value: true
      - key: ENABLE_IMAGE_ANALYSIS
        value: true
      - key: ENABLE_DOCUMENT_OCR
        value: true
      - key: ENABLE_PRICE_PREDICTION
        value: true
      - key: ENABLE_CHAT_ASSISTANT
        value: true
      - key: REALTIME_ENABLED
        value: true
      - key: STORAGE_TYPE
        value: supabase
      - key: STORAGE_BUCKET
        value: autov-storage
      - key: MAX_IMAGE_SIZE
        value: 10485760
      - key: MAX_DOCUMENT_SIZE
        value: 20971520
      - key: CARAPI_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_VISION_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USERNAME
        value: noreply@autov.africa
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        value: noreply@autov.africa
      - key: SMTP_TLS
        value: true
      - key: SSL_ENABLED
        value: false
      - key: MAINTENANCE_MODE
        value: false
