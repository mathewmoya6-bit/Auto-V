# ============================================================
# render.yaml - Render.com Deployment
# ============================================================

services:
  - type: web
    name: auto-v-api
    runtime: python
    plan: starter
    region: frankfurt
    branch: main
    healthCheckPath: /health
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: |
      gunicorn -c gunicorn.conf.py wsgi:app
    envVars:
      - key: ENV
        value: production
      - key: PORT
        value: 8000
      - key: WORKERS
        value: 4
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_PASSKEY
        sync: false

  - type: worker
    name: auto-v-worker
    runtime: python
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: |
      python run_worker.py
    envVars:
      - key: ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
