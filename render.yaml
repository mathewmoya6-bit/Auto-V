services:
  - type: web
    name: auto-v-api
    runtime: python
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: |
      pip install --upgrade pip
      pip install setuptools wheel
      pip install -r requirements.txt
    startCommand: |
      gunicorn -k uvicorn.workers.UvicornWorker main:app --bind 0.0.0.0:$PORT --workers 4
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: false
      - key: PORT
        value: 8000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_SHORTCODE
        value: 4095377
      - key: MPESA_ENVIRONMENT
        value: sandbox
      - key: CORS_ORIGINS
        value: https://auto-v.meipressgroup.com,https://www.auto-v.meipressgroup.com
      - key: LOG_LEVEL
        value: INFO
