# render.yaml - Deploy to Render.com

services:
  - type: web
    name: auto-v-backend
    runtime: python
    plan: starter
    region: frankfurt
    branch: main
    healthCheckPath: /health
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: |
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: false
      - key: APP_VERSION
        value: 2.0.0
      - key: BASE_URL
        value: https://auto-v.onrender.com
      
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_SHORTCODE
        value: 4095377
      - key: MPESA_ENVIRONMENT
        value: sandbox
      - key: MPESA_CALLBACK_URL
        value: https://auto-v.onrender.com/api/mpesa/callback
      
      - key: CORS_ORIGINS
        value: https://auto-v.meipressgroup.com,https://www.auto-v.meipressgroup.com,https://auto-v.onrender.com,http://localhost:3000,http://localhost:5173
