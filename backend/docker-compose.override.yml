# ============================================================
# AUTO-V DOCKER COMPOSE OVERRIDE
# Development Only - Overrides production settings
# ============================================================

version: '3.8'

services:
  api:
    environment:
      - ENV=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - LOG_FORMAT=console
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  redis:
    ports:
      - "6379:6379"

  celery:
    command: celery -A app.tasks worker --loglevel=debug --concurrency=2

  celery-beat:
    command: celery -A app.tasks beat --loglevel=debug
