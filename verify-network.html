<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTO-V | Verification Network</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="supabase.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:#0a0c15; color:#fff; }
        .header { background:#0f172a; border-bottom:2px solid #eab308; padding:16px 24px; display:flex; justify-content:space-between; align-items:center; }
        .logo { font-size:24px; font-weight:bold; color:#eab308; }
        .container { max-width:800px; margin:0 auto; padding:24px; }
        .card { background:#0f172a; border-radius:16px; padding:32px; border:1px solid #1e293b; }
        h2 { color:#eab308; margin-bottom:20px; }
        .search-box { display:flex; gap:12px; margin-bottom:24px; }
        .search-box input { flex:1; padding:14px; background:#1e293b; border:1px solid #334155; border-radius:8px; color:#fff; font-size:16px; }
        .btn { background:#eab308; color:#000; padding:14px 28px; border:none; border-radius:8px; cursor:pointer; font-weight:bold; }
        .btn:hover { background:#facc15; }
        .result-valid { background:#14532d; border:1px solid #22c55e; padding:20px; border-radius:12px; margin-top:20px; }
        .result-invalid { background:#7f1d1d; border:1px solid #ef4444; padding:20px; border-radius:12px; margin-top:20px; }
        .verified-badge { display:inline-block; background:#22c55e; color:#000; padding:4px 16px; border-radius:20px; font-weight:bold; }
    </style>
</head>
<body>
    <div class="header"><div class="logo">🔍 AUTO-V Verification Network</div></div>
    <div class="container">
        <div class="card">
            <h2>🔐 Verify a Vehicle</h2>
            <p style="color:#94a3b8; margin-bottom:20px;">Enter a registration number or certificate number to verify</p>
            <div class="search-box">
                <input type="text" id="verifyInput" placeholder="e.g., KDA 123A or AUTO-2024-XXXX">
                <button class="btn" onclick="verify()">Verify</button>
            </div>
            <div id="verifyResult"></div>
        </div>
    </div>
    <script>
        window.verify = async function() {
            const input = document.getElementById('verifyInput').value.trim();
            const result = document.getElementById('verifyResult');
            
            if (!input) { alert('Enter a registration or certificate number'); return; }
            
            const { data: vehicle } = await autoV.supabase
                .from('vehicles')
                .select('*')
                .eq('registration_number', input.toUpperCase())
                .maybeSingle();
            
            if (vehicle) {
                result.innerHTML = 
                    <div class="result-valid">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <span style="font-size:24px;">✅</span>
                            <span class="verified-badge">VERIFIED</span>
                        </div>
                        <h3 style="margin:12px 0 8px 0;"> </h3>
                        <div style="color:#94a3b8;"> • </div>
                        <div style="margin-top:12px;">
                            <span style="color:#22c55e;">✓ Valid vehicle record</span>
                            <span style="color:#94a3b8; margin-left:16px;">• Last verified: </span>
                        </div>
                    </div>
                ;
            } else {
                result.innerHTML = 
                    <div class="result-invalid">
                        <div style="display:flex; align-items:center; gap:12px;">
                            <span style="font-size:24px;">❌</span>
                            <div>
                                <div style="font-weight:bold;">Not Verified</div>
                                <div style="color:#94a3b8; font-size:14px;">No record found for ""</div>
                            </div>
                        </div>
                    </div>
                ;
            }
        };
    </script>
</body>
</html>
