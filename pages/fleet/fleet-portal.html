<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTO-V | Fleet Intelligence</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="supabase.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:#0a0c15; color:#fff; }
        .header { background:#0f172a; border-bottom:2px solid #eab308; padding:16px 24px; display:flex; justify-content:space-between; align-items:center; }
        .logo { font-size:24px; font-weight:bold; color:#eab308; }
        .container { max-width:1400px; margin:0 auto; padding:24px; }
        .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:20px; margin-bottom:24px; }
        .stat-card { background:#0f172a; border-radius:16px; padding:20px; border:1px solid #1e293b; text-align:center; }
        .stat-number { font-size:32px; font-weight:800; color:#22c55e; }
        .stat-label { color:#94a3b8; font-size:12px; margin-top:8px; }
        .card { background:#0f172a; border-radius:16px; padding:24px; border:1px solid #1e293b; margin-bottom:20px; }
        h2 { color:#eab308; margin-bottom:20px; }
        .alert { background:#7f1d1d; padding:12px; border-radius:8px; margin-bottom:16px; border-left:4px solid #ef4444; }
        .alert-success { background:#14532d; border-left-color:#22c55e; }
    </style>
</head>
<body>
    <div class="header"><div class="logo">🚛 AUTO-V Fleet Portal</div></div>
    <div class="container">
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-number" id="fleetCount">0</div><div class="stat-label">Total Vehicles</div></div>
            <div class="stat-card"><div class="stat-number" id="fleetValue">KES 0</div><div class="stat-label">Total Fleet Value</div></div>
            <div class="stat-card"><div class="stat-number" id="inspectionDue">0</div><div class="stat-label">Inspection Due</div></div>
            <div class="stat-card"><div class="stat-number" id="alertsCount">0</div><div class="stat-label">Maintenance Alerts</div></div>
        </div>
        <div id="alertsContainer"></div>
        <div class="card">
            <h2>📋 Fleet Vehicles</h2>
            <div style="overflow-x:auto;"><table id="fleetTable"><thead><tr><th>Registration</th><th>Make/Model</th><th>Year</th><th>Mileage</th><th>Status</th><th>Next Service</th></tr></thead><tbody id="fleetBody"></tbody></table></div>
        </div>
    </div>
    <script>
        (async function() {
            const user = await autoV.requireAuth();
            if (!user) return;
            
            const { data: vehicles } = await autoV.supabase
                .from('vehicles')
                .select('*')
                .eq('user_id', user.id);
            
            if (vehicles) {
                document.getElementById('fleetCount').textContent = vehicles.length;
                const total = vehicles.reduce((s, v) => s + (v.current_mileage || 0), 0);
                document.getElementById('fleetValue').innerHTML = KES ;
                document.getElementById('inspectionDue').textContent = vehicles.filter(v => !v.last_inspection_date).length;
                document.getElementById('alertsCount').textContent = Math.floor(vehicles.length * 0.3);
                
                document.getElementById('fleetBody').innerHTML = vehicles.map(v => 
                    <tr>
                        <td></td>
                        <td> </td>
                        <td></td>
                        <td> km</td>
                        <td><span style="color:#22c55e;">Active</span></td>
                        <td></td>
                    </tr>
                ).join('');
                
                // Alerts
                if (document.getElementById('alertsCount').textContent > 0) {
                    document.getElementById('alertsContainer').innerHTML = 
                        <div class="alert">⚠️  vehicles need maintenance attention</div>
                        <div class="alert alert-success">✅  vehicles are up to date</div>
                    ;
                }
            }
        })();
    </script>
</body>
</html>
