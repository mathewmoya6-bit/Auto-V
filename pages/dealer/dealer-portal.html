<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTO-V | Dealer Intelligence</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="supabase.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:#0a0c15; color:#fff; }
        .header { background:#0f172a; border-bottom:2px solid #eab308; padding:16px 24px; display:flex; justify-content:space-between; align-items:center; }
        .logo { font-size:24px; font-weight:bold; color:#eab308; }
        .container { max-width:1400px; margin:0 auto; padding:24px; }
        .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:20px; margin-bottom:24px; }
        .stat-card { background:#0f172a; border-radius:16px; padding:20px; border:1px solid #1e293b; text-align:center; }
        .stat-number { font-size:32px; font-weight:800; color:#22c55e; }
        .stat-label { color:#94a3b8; font-size:12px; margin-top:8px; }
        .card { background:#0f172a; border-radius:16px; padding:24px; border:1px solid #1e293b; margin-bottom:20px; }
        h2 { color:#eab308; margin-bottom:20px; }
        table { width:100%; border-collapse:collapse; }
        th, td { padding:12px; text-align:left; border-bottom:1px solid #1e293b; }
        th { color:#eab308; }
        .btn { background:#eab308; color:#000; padding:8px 20px; border:none; border-radius:40px; cursor:pointer; font-weight:bold; }
        .btn:hover { background:#facc15; }
    </style>
</head>
<body>
    <div class="header"><div class="logo">🏪 AUTO-V Dealer Portal</div></div>
    <div class="container">
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-number" id="inventoryCount">0</div><div class="stat-label">Total Inventory</div></div>
            <div class="stat-card"><div class="stat-number" id="inventoryValue">KES 0</div><div class="stat-label">Total Value</div></div>
            <div class="stat-card"><div class="stat-number" id="avgDays">0</div><div class="stat-label">Avg Days on Lot</div></div>
            <div class="stat-card"><div class="stat-number" id="demandScore">0</div><div class="stat-label">Demand Score</div></div>
        </div>
        <div class="card">
            <h2>📋 Inventory</h2>
            <div style="overflow-x:auto;"><table id="inventoryTable"><thead><tr><th>Registration</th><th>Make/Model</th><th>Year</th><th>List Price</th><th>Days on Lot</th><th>Status</th><th>Action</th></tr></thead><tbody id="inventoryBody"></tbody></table></div>
        </div>
    </div>

            if (!user) return;

                .from('vehicles')
                .select('*')
                .eq('user_id', user.id);

                    <tr>
                        <td></td>

                        <td> days</td>

                        <td><button class="btn" onclick="alert('View details')">View</button></td>
                    </tr>

            }
        })();
    </script>
</body>
</html>
