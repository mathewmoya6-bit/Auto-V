<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTO-V | Market Intelligence</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:#0a0c15; color:#fff; }
        .header { background:#0f172a; border-bottom:2px solid #eab308; padding:16px 24px; }
        .logo { font-size:28px; font-weight:bold; color:#eab308; }
        .container { max-width:1400px; margin:0 auto; padding:24px; }
        .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:20px; margin-bottom:24px; }
        .stat-card { background:#0f172a; border-radius:16px; padding:20px; border:1px solid #1e293b; text-align:center; }
        .stat-number { font-size:32px; font-weight:800; color:#22c55e; }
        .stat-label { color:#94a3b8; font-size:12px; margin-top:8px; }
        .chart-container { background:#0f172a; border-radius:16px; padding:24px; border:1px solid #1e293b; height:400px; }
        .row { display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-top:24px; }
        @media (max-width:768px) { .row { grid-template-columns:1fr; } }
    </style>
</head>
<body>
    <div class="header"><div class="logo">📊 AUTO-V Market Intelligence</div></div>
    <div class="container">
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-number" id="topMake">Toyota</div><div class="stat-label">Most Popular Make</div></div>
            <div class="stat-card"><div class="stat-number" id="topModel">Axio</div><div class="stat-label">Most Popular Model</div></div>
            <div class="stat-card"><div class="stat-number" id="avgPrice">KES 2.8M</div><div class="stat-label">Average Market Price</div></div>
            <div class="stat-card"><div class="stat-number" id="marketTrend">📈 +5.2%</div><div class="stat-label">Trend (YoY)</div></div>
        </div>
        <div class="chart-container"><canvas id="marketChart"></canvas></div>
        <div class="row">
            <div class="chart-container"><canvas id="makeChart"></canvas></div>
            <div class="chart-container"><canvas id="modelChart"></canvas></div>
        </div>
    </div>
    <script>
        const ctx = document.getElementById('marketChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
                datasets: [{
                    label: 'Average Vehicle Price (KES)',
                    data: [2800000, 2750000, 2850000, 2900000, 2950000, 3000000, 3100000, 3150000, 3200000, 3250000, 3300000, 3350000],
                    borderColor: '#eab308',
                    backgroundColor: 'rgba(234,179,8,0.1)',
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { labels: { color: '#fff' } } },
                scales: { y: { ticks: { color: '#fff' }, grid: { color: '#1e293b' } }, x: { ticks: { color: '#fff' }, grid: { color: '#1e293b' } } }
            }
        });
        
        new Chart(document.getElementById('makeChart').getContext('2d'), {
            type: 'doughnut',
            data: {
                labels: ['Toyota', 'Honda', 'Nissan', 'Subaru', 'Mercedes'],
                datasets: [{
                    data: [45, 20, 15, 12, 8],
                    backgroundColor: ['#eab308', '#22c55e', '#3b82f6', '#8b5cf6', '#ef4444']
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { labels: { color: '#fff' } } }
            }
        });
        
        new Chart(document.getElementById('modelChart').getContext('2d'), {
            type: 'bar',
            data: {
                labels: ['Axio', 'Premio', 'Prado', 'Hilux', 'RAV4'],
                datasets: [{
                    label: 'Avg Price (KES)',
                    data: [2850000, 3200000, 10000000, 5750000, 4300000],
                    backgroundColor: '#eab308'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { labels: { color: '#fff' } } },
                scales: { y: { ticks: { color: '#fff' }, grid: { color: '#1e293b' } }, x: { ticks: { color: '#fff' } } }
            }
        });
    </script>
</body>
</html>
